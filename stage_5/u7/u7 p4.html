<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Giới Từ (Level 2) - Ms. Mai An </title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #8854C0;
            --primary-cyan: #00C9A7;
            --accent-yellow: #FFC048;
            --correct-green: #00D26A;
            --wrong-red: #FF4757;
            --bg-pattern: #f3f0ff;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-pattern);
            background-image: radial-gradient(var(--primary-purple) 0.8px, transparent 0.8px), radial-gradient(var(--primary-cyan) 0.8px, var(--bg-pattern) 0.8px);
            background-size: 25px 25px;
            background-position: 0 0, 12.5px 12.5px;
            margin: 0;
            padding: 20px;
            color: #2f3542;
            min-height: 100vh;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        /* Header Styles */
        header {
            text-align: center;
            background: #fff;
            padding: 30px;
            border-radius: 25px;
            border-bottom: 8px solid var(--primary-purple);
            margin-bottom: 40px;
            box-shadow: 0 10px 25px rgba(136, 84, 192, 0.15);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -10px; left: -10px;
            width: 100%; height: 10px;
            background: repeating-linear-gradient(45deg, var(--primary-cyan), var(--primary-cyan) 10px, white 10px, white 20px);
        }

        h1 {
            color: var(--primary-purple);
            font-weight: 800;
            font-size: 2.2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .teacher-name {
            background: var(--primary-cyan);
            color: white;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 700;
            margin-top: 10px;
            font-size: 1rem;
        }

        /* Question Card */
        .quiz-card {
            background: white;
            border-radius: 25px;
            padding: 30px;
            margin-bottom: 35px;
            position: relative;
            box-shadow: 0 8px 0 #dfe4ea, 0 15px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid #fff;
        }

        .quiz-card:hover {
            transform: translateY(-5px);
        }

        .q-badge {
            background: var(--accent-yellow);
            color: #574b90;
            font-weight: 800;
            padding: 5px 15px;
            border-radius: 12px;
            position: absolute;
            top: -15px;
            left: 20px;
            box-shadow: 0 4px 0 #e1b12c;
        }

        .question-content {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 15px 0 25px 0;
            line-height: 1.4;
            color: #2f3640;
        }

        .blank-space {
            display: inline-block;
            width: 80px;
            border-bottom: 3px dashed var(--primary-purple);
            margin: 0 5px;
        }

        /* Options Grid */
        .options-wrapper {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .btn-option {
            background: white;
            border: 3px solid #f1f2f6;
            border-radius: 18px;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: 'Quicksand', sans-serif;
            color: #57606f;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            text-align: left;
            padding-left: 20px;
            box-shadow: 0 5px 0 #f1f2f6;
        }

        .btn-option:hover:not(:disabled) {
            border-color: var(--primary-purple);
            color: var(--primary-purple);
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #dcdde1;
        }

        .btn-option:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 0 0;
            border-bottom-width: 3px;
        }

        /* Correct/Wrong States */
        .btn-option.correct {
            background: var(--correct-green);
            color: white;
            border-color: #00b85c;
            box-shadow: 0 5px 0 #008f47;
        }

        .btn-option.wrong {
            background: var(--wrong-red);
            color: white;
            border-color: #e63b49;
            box-shadow: 0 5px 0 #c42e3a;
            animation: shake 0.4s ease-in-out;
        }

        /* Explanations */
        .expl-container {
            margin-top: 25px;
            background: #fffdf0;
            border: 2px dashed var(--accent-yellow);
            border-radius: 20px;
            padding: 20px;
            display: none;
            animation: expandOpen 0.5s;
        }

        .expl-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e67e22;
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .expl-body p {
            margin: 8px 0;
            line-height: 1.6;
        }

        .vocab-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            font-size: 0.95rem;
            border: 1px solid #eee;
        }

        .vocab-table th, .vocab-table td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #f1f2f6;
        }

        .vocab-table th {
            background: var(--primary-purple);
            color: white;
        }

        .reason-box {
            background: white;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
            border-left: 5px solid;
        }

        .reason-correct { border-left-color: var(--correct-green); }
        .reason-wrong { border-left-color: var(--wrong-red); }

        /* Footer / Submit */
        .footer-action {
            text-align: center;
            margin-top: 50px;
            padding-bottom: 60px;
        }

        .submit-btn {
            background: linear-gradient(180deg, var(--primary-purple), #6c429c);
            color: white;
            border: none;
            padding: 18px 60px;
            font-size: 1.5rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(136, 84, 192, 0.4), 0 6px 0 #56347c;
            transition: all 0.2s;
            font-family: 'Quicksand', sans-serif;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(136, 84, 192, 0.5), 0 8px 0 #56347c;
        }

        .submit-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 5px solid var(--primary-cyan);
            animation: popIn 0.5s;
        }

        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px) rotate(-3deg); }
            40%, 80% { transform: translateX(6px) rotate(3deg); }
        }

        @keyframes expandOpen {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        #confetti {
            position: fixed;
            top: 0; left: 0;
            pointer-events: none;
            width: 100%; height: 100%;
            z-index: 999;
        }

        @media (max-width: 600px) {
            .options-wrapper { grid-template-columns: 1fr; }
            h1 { font-size: 1.6rem; }
            .question-content { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <canvas id="confetti"></canvas>

    <div class="container">
        <header>
            <h1>Prepositions of Time <br>(In/On/At/To)</h1>
            <div class="teacher-name">Level 2 - Giáo viên: Ms. Mai An </div>
            <p style="margin-top: 15px; color: #7f8c8d;">
                30 câu hỏi mới với ngữ cảnh đa dạng: Lịch sử, Khoa học & Đời sống.<br>
                Hãy xem kỹ giải thích để không mắc bẫy nhé!
            </p>
        </header>

        <div id="quiz-area">
            </div>

        <div class="footer-action">
            <button class="submit-btn" onclick="finishTest()">NỘP BÀI & XEM ĐIỂM</button>
        </div>
    </div>

    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--primary-purple); margin-top:0;">KẾT QUẢ BÀI LÀM</h2>
            <div style="font-size: 4rem; font-weight: 800; color: var(--primary-cyan); margin: 20px 0;" id="scoreText">0/30</div>
            <p id="commentText" style="font-size: 1.2rem; margin-bottom: 30px; line-height: 1.5;">...</p>
            <button class="submit-btn" onclick="location.reload()" style="font-size: 1.1rem; padding: 15px 40px;">Làm lại bài thi</button>
        </div>
    </div>

<script>
    // --- DỮ LIỆU ĐỀ BÀI (30 CÂU MỚI) ---
    const questionData = [
        {
            q: "William Shakespeare was born ______ 1564.",
            options: ["on", "at", "in", "to"],
            correct: 2,
            expl: {
                trans: "William Shakespeare được sinh ra vào năm 1564.",
                vocab: [
                    { w: "In", m: "Dùng cho năm, thế kỷ, giai đoạn dài" },
                    { w: "On", m: "Dùng cho ngày cụ thể" },
                    { w: "At", m: "Dùng cho giờ, thời điểm ngắn" }
                ],
                whyCorrect: "1564 là một năm (Year). Quy tắc: In + Năm.",
                whyWrong: "Không dùng 'On' hay 'At' cho năm."
            }
        },
        {
            q: "Humans first walked on the Moon ______ July 20th, 1969.",
            options: ["in", "at", "on", "of"],
            correct: 2,
            expl: {
                trans: "Con người lần đầu tiên đi bộ trên Mặt Trăng vào ngày 20 tháng 7 năm 1969.",
                vocab: [
                    { w: "On", m: "Vào ngày..." },
                    { w: "In", m: "Vào tháng/năm" }
                ],
                whyCorrect: "Dù có tháng và năm, nhưng có NGÀY (20th) nên bắt buộc dùng 'On'. (On + Date).",
                whyWrong: "Nếu chỉ có 'July 1969' thì dùng 'In'. Nhưng có ngày cụ thể thì 'In' là sai."
            }
        },
        {
            q: "Dinosaurs lived on Earth ______ the Mesozoic Era.",
            options: ["at", "on", "in", "to"],
            correct: 2,
            expl: {
                trans: "Khủng long sống trên Trái Đất vào Kỷ Nguyên Sinh.",
                vocab: [
                    { w: "Era", m: "Kỷ nguyên (khoảng thời gian rất dài)" }
                ],
                whyCorrect: "Dùng 'In' cho các khoảng thời gian dài, kỷ nguyên, thời đại (In the Ice Age, In the past).",
                whyWrong: "On/At dùng cho đơn vị thời gian ngắn hơn."
            }
        },
        {
            q: "What will happen ______ the future?",
            options: ["at", "on", "in", "to"],
            correct: 2,
            expl: {
                trans: "Điều gì sẽ xảy ra trong tương lai?",
                vocab: [
                    { w: "Future", m: "Tương lai" }
                ],
                whyCorrect: "Cụm cố định: 'In the future' (trong tương lai) và 'In the past' (trong quá khứ).",
                whyWrong: "Không nói 'on the future' hay 'at the future'."
            }
        },
        {
            q: "The rocket will launch ______ exactly 8:00 a.m.",
            options: ["on", "in", "at", "since"],
            correct: 2,
            expl: {
                trans: "Tên lửa sẽ phóng vào đúng lúc 8 giờ sáng.",
                vocab: [
                    { w: "Launch", m: "Phóng (tên lửa)" },
                    { w: "Exactly", m: "Chính xác" }
                ],
                whyCorrect: "8:00 a.m là giờ cụ thể -> Dùng 'At'.",
                whyWrong: "In/On không dùng cho giờ đồng hồ."
            }
        },
        {
            q: "We often visit our teachers ______ Teacher's Day.",
            options: ["in", "at", "on", "to"],
            correct: 2,
            expl: {
                trans: "Chúng tôi thường thăm thầy cô vào ngày Nhà giáo.",
                vocab: [
                    { w: "Teacher's Day", m: "Ngày nhà giáo (một ngày lễ cụ thể)" }
                ],
                whyCorrect: "Bất kỳ dịp lễ nào có chữ 'DAY' (Teacher's Day, Valentine's Day) đều dùng 'ON'.",
                whyWrong: "Chỉ dùng 'At' cho dịp lễ kéo dài không có chữ Day (At Christmas, At Tet)."
            }
        },
        {
            q: "He finished the test ______ 45 minutes.",
            options: ["at", "on", "in", "about"],
            correct: 2,
            expl: {
                trans: "Anh ấy đã hoàn thành bài kiểm tra trong 45 phút.",
                vocab: [
                    { w: "In + duration", m: "Trong khoảng thời gian (lượng thời gian để làm xong việc gì)" }
                ],
                whyCorrect: "Dùng 'In' để chỉ khoảng thời gian cần thiết để hoàn thành một việc gì đó.",
                whyWrong: "At/On không mang nghĩa 'trong vòng bao lâu'."
            }
        },
        {
            q: "We usually have a break ______ noon.",
            options: ["in", "on", "at", "to"],
            correct: 2,
            expl: {
                trans: "Chúng tôi thường nghỉ giải lao vào buổi trưa.",
                vocab: [
                    { w: "Noon", m: "Giữa trưa (12 giờ trưa)" }
                ],
                whyCorrect: "Noon là một mốc thời gian cụ thể (như Midnight) -> Dùng 'At noon'.",
                whyWrong: "Sai lầm phổ biến: 'In the noon' là sai. (Chỉ có In the afternoon)."
            }
        },
        {
            q: "I don't go to school ______ Sundays.",
            options: ["in", "at", "on", "from"],
            correct: 2,
            expl: {
                trans: "Tôi không đi học vào các ngày Chủ Nhật.",
                vocab: [
                    { w: "Sunday", m: "Thứ trong tuần" }
                ],
                whyCorrect: "Thứ trong tuần luôn đi với 'On' (On Sundays, On Mondays).",
                whyWrong: "In/At không dùng cho thứ."
            }
        },
        {
            q: "The weather is beautiful ______ spring.",
            options: ["at", "on", "in", "to"],
            correct: 2,
            expl: {
                trans: "Thời tiết rất đẹp vào mùa xuân.",
                vocab: [
                    { w: "Spring", m: "Mùa xuân" }
                ],
                whyCorrect: "Mùa (Spring, Summer, Autumn, Winter) dùng giới từ 'In'.",
                whyWrong: "On dùng cho ngày, At dùng cho giờ."
            }
        },
        {
            q: "My father often drinks tea ______ the morning.",
            options: ["at", "on", "in", "to"],
            correct: 2,
            expl: {
                trans: "Bố tôi thường uống trà vào buổi sáng.",
                vocab: [
                    { w: "The morning", m: "Buổi sáng" }
                ],
                whyCorrect: "Cụm cố định: In the morning / In the afternoon / In the evening.",
                whyWrong: "Tuyệt đối không dùng 'On the morning' trừ khi có thứ đi kèm (On Sunday morning)."
            }
        },
        {
            q: "We will meet ______ Tuesday afternoon.",
            options: ["in", "at", "on", "to"],
            correct: 2,
            expl: {
                trans: "Chúng ta sẽ gặp nhau vào chiều thứ Ba.",
                vocab: [
                    { w: "Tuesday", m: "Thứ Ba" },
                    { w: "Afternoon", m: "Buổi chiều" }
                ],
                whyCorrect: "Quy tắc ưu tiên: Có THỨ (Tuesday) là dùng ON. Dù phía sau có buổi (afternoon). -> 'On Tuesday afternoon'.",
                whyWrong: "Không dùng 'In Tuesday afternoon'."
            }
        },
        {
            q: "The train leaves ______ 10 minutes.",
            options: ["at", "on", "in", "by"],
            correct: 2,
            expl: {
                trans: "Tàu sẽ rời đi trong 10 phút nữa.",
                vocab: [
                    { w: "In + time (future)", m: "Trong bao lâu nữa (tính từ bây giờ)" }
                ],
                whyCorrect: "Khi nói về tương lai, 'In' có nghĩa là 'sau/trong vòng'. (In 10 minutes = 10 phút nữa).",
                whyWrong: "At 10 minutes là sai ngữ pháp (phải là At 10 o'clock)."
            }
        },
        {
            q: "Are you busy ______ the moment?",
            options: ["in", "on", "at", "to"],
            correct: 2,
            expl: {
                trans: "Bạn có bận ngay lúc này không?",
                vocab: [
                    { w: "At the moment", m: "Ngay bây giờ (= Now)" }
                ],
                whyCorrect: "Thành ngữ cố định: At the moment / At present.",
                whyWrong: "Không dùng in/on."
            }
        },
        {
            q: "We usually go back to our hometown ______ Tet.",
            options: ["on", "in", "at", "to"],
            correct: 2,
            expl: {
                trans: "Chúng tôi thường về quê vào dịp Tết.",
                vocab: [
                    { w: "Tet", m: "Tết (Dịp lễ hội kéo dài)" }
                ],
                whyCorrect: "Với các dịp lễ hội (Holiday periods) không có chữ 'Day', ta dùng 'At'. (At Tet, At Christmas, At Easter).",
                whyWrong: "Chỉ dùng 'On' nếu nói 'On the first day of Tet'."
            }
        },
        {
            q: "They got married ______ 14th February.",
            options: ["in", "at", "on", "of"],
            correct: 2,
            expl: {
                trans: "Họ kết hôn vào ngày 14 tháng 2.",
                vocab: [
                    { w: "14th February", m: "Ngày cụ thể" }
                ],
                whyCorrect: "Ngày tháng cụ thể -> Dùng 'On'.",
                whyWrong: "In dùng cho tháng (In February), nhưng có ngày 14 thì phải dùng On."
            }
        },
        {
            q: "I watched that movie ______ last night.",
            options: ["at", "on", "in", "no preposition"],
            correct: 3,
            expl: {
                trans: "Tôi đã xem bộ phim đó tối qua.",
                vocab: [
                    { w: "Last night", m: "Tối qua" }
                ],
                whyCorrect: "Trước 'last, next, this, every' KHÔNG dùng giới từ in/on/at.",
                whyWrong: "Nói 'on last night' hay 'at last night' là sai."
            }
        },
        {
            q: "Birds start singing ______ sunrise.",
            options: ["in", "on", "at", "to"],
            correct: 2,
            expl: {
                trans: "Chim bắt đầu hót lúc bình minh.",
                vocab: [
                    { w: "Sunrise", m: "Bình minh" },
                    { w: "Sunset", m: "Hoàng hôn" }
                ],
                whyCorrect: "Sunrise/Sunset là các thời điểm cụ thể trong ngày -> Dùng 'At'.",
                whyWrong: "In the morning thì đúng, nhưng Sunrise phải dùng At."
            }
        },
        {
            q: "We live ______ the 21st century.",
            options: ["on", "at", "in", "to"],
            correct: 2,
            expl: {
                trans: "Chúng ta sống ở thế kỷ 21.",
                vocab: [
                    { w: "Century", m: "Thế kỷ (100 năm)" }
                ],
                whyCorrect: "Khoảng thời gian dài (thế kỷ, thiên niên kỷ) luôn dùng 'In'.",
                whyWrong: "On/At dùng cho đơn vị nhỏ hơn."
            }
        },
        {

                    { w: "New Year's Eve", m: "Đêm giao thừa" }

                whyCorrect: "Như đã giải thích, Eve được tính là Ngày -> Dùng 'On'.",

    // --- GAME LOGIC ---
    let currentQ = 0;
    let score = 0;
    let shuffledQuestions = [];

    // Âm thanh (Base64 Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // Xáo trộn mảng
    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    // Render câu hỏi
    function initGame() {
        const quizArea = document.getElementById('quiz-area');
        shuffledQuestions = shuffle([...questionData]); // Clone và xáo trộn

        quizArea.innerHTML = shuffledQuestions.map((item, idx) => {
            const optionsHTML = item.options.map((opt, optIdx) => 
                `<button class="btn-option" onclick="checkAns(this, ${idx}, ${optIdx})">
                    ${String.fromCharCode(65 + optIdx)}. ${opt}
                 </button>`
            ).join('');

            return `
                <div class="quiz-card" id="q-card-${idx}">
                    <div class="q-badge">Câu ${idx + 1}</div>
                    <div class="question-content">
                        ${item.q.replace('______', '<span class="blank-space"></span>')}
                    </div>
                    <div class="options-wrapper">
                        ${optionsHTML}
                    </div>
                    <div class="expl-container" id="expl-${idx}">
                        <div class="expl-title">📝 Giải thích chi tiết:</div>
                        <div class="expl-body">
                            <p><strong>Dịch:</strong> <em>"${item.expl.trans}"</em></p>
                            <table class="vocab-table">
                                <thead><tr><th>Từ vựng/Cấu trúc</th><th>Nghĩa & Cách dùng</th></tr></thead>
                                <tbody>
                                    ${item.expl.vocab.map(v => `<tr><td>${v.w}</td><td>${v.m}</td></tr>`).join('')}
                                </tbody>
                            </table>
                            <div class="reason-box reason-correct">
                                <strong>✅ Tại sao ĐÚNG:</strong> ${item.expl.whyCorrect}
                            </div>
                            <div class="reason-box reason-wrong">
                                <strong>❌ Tại sao SAI:</strong> ${item.expl.whyWrong}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // Kiểm tra đáp án
    window.checkAns = function(btn, qIdx, optIdx) {
        const card = document.getElementById(`q-card-${qIdx}`);
        // Chặn click lại
        if (card.getAttribute('data-answered')) return;
        card.setAttribute('data-answered', 'true');

        const question = shuffledQuestions[qIdx];
        const buttons = card.querySelectorAll('.btn-option');
        const correctIdx = question.correct;

        if (optIdx === correctIdx) {
            btn.classList.add('correct');
            playSound('correct');
            fireConfetti(btn);
            score++;
        } else {
            btn.classList.add('wrong');
            playSound('wrong');
            // Hiện đáp án đúng
            buttons[correctIdx].classList.add('correct');
        }

        // Hiện giải thích
        document.getElementById(`expl-${qIdx}`).style.display = 'block';
    };

    // Nộp bài
    window.finishTest = function() {
        const modal = document.getElementById('resultModal');
        const scoreText = document.getElementById('scoreText');
        const comment = document.getElementById('commentText');

        scoreText.innerText = `${score} / 30`;
        
        if (score === 30) {
            comment.innerText = "Tuyệt đỉnh! Con đã làm chủ hoàn toàn các giới từ thời gian! 🏆";
            launchBigConfetti();
        } else if (score >= 25) {
            comment.innerText = "Rất tốt! Con chỉ sai một chút xíu thôi. Cố lên! 🌟";
        } else if (score >= 15) {
            comment.innerText = "Khá ổn! Hãy xem lại các câu sai để nhớ lâu hơn nhé. 💪";
        } else {
            comment.innerText = "Đừng buồn nhé! Hãy đọc kỹ phần giải thích của MS Chí Nên để làm lại tốt hơn! 📚";
        }

        modal.style.display = 'flex';
    };

    // Hiệu ứng pháo giấy nhỏ (khi chọn đúng)
    function fireConfetti(element) {
        const rect = element.getBoundingClientRect();
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Vẽ đơn giản vài hạt
        for(let i=0; i<30; i++) {
            const x = rect.left + rect.width/2;
            const y = rect.top;
            // (Phần này chỉ là placeholder logic, hiệu ứng thực tế nên dùng thư viện canvas-confetti nếu muốn xịn hơn,
            // nhưng để single-file đơn giản ta dùng CSS animation hoặc logic JS đơn giản ở đây)
        }
    }

    // Hiệu ứng pháo giấy lớn (khi thắng)
    function launchBigConfetti() {
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        let particles = [];
        const colors = ['#f1c40f', '#e74c3c', '#8e44ad', '#3498db', '#2ecc71'];

        for(let i=0; i<300; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                color: colors[Math.floor(Math.random() * colors.length)],
                size: Math.random() * 10 + 5,
                speedY: Math.random() * 3 + 2
            });
        }

        function animate() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            particles.forEach(p => {
                p.y += p.speedY;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            requestAnimationFrame(animate);
        }
        animate();
    }

    // Chạy game khi load
    initGame();

</script>

        if (typeof initAudio === 'function') { try { initAudio(); } catch(e){} }
    }

    if (document.readyState === 'loading') {
