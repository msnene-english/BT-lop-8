<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Giới Từ - MS Chí Nên</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-pink: #8854C0;
            --primary-teal: #00C9A7;
            --correct-color: #00D26A;
            --wrong-color: #FF4757;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #2d3436;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#8854C0 1px, transparent 1px), radial-gradient(#00C9A7 1px, transparent 1px);
            background-position: 0 0, 25px 25px;
            background-size: 50px 50px;
            margin: 0;
            padding: 20px;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: transparent;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 30px;
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            border: 2px solid var(--primary-pink);
        }

        h1 {
            font-family: 'Quicksand', sans-serif;
            color: var(--primary-pink);
            font-size: 1.5rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .teacher-name {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        /* Question Card */
        .quiz-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(136, 84, 192, 0.15);
            position: relative;
            transition: transform 0.3s ease;
            border: 1px solid #eee;
        }

        .question-number {
            display: inline-block;
            background: var(--primary-pink);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: 800;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 15px;
            font-family: 'Nunito', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #dcdcdc;
            text-align: left;
        }

        .option-btn:hover:not(:disabled) {
            transform: scale(1.02);
            border-color: var(--primary-teal);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(5px);
            box-shadow: 0 0 0 #dcdcdc;
        }

        /* States */
        .option-btn.correct {
            background-color: var(--correct-color);
            color: white;
            border-color: #00a352;
            box-shadow: 0 5px 0 #00a352;
        }

        .option-btn.wrong {
            background-color: var(--wrong-color);
            color: white;
            border-color: #d63031;
            box-shadow: 0 5px 0 #d63031;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }

        /* Explanation Box */
        .explanation-box {
            display: none; /* Hidden by default */
            margin-top: 25px;
            background: #f8f9fa;
            border-left: 5px solid var(--primary-pink);
            padding: 20px;
            border-radius: 10px;
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .exp-header {
            font-weight: 800;
            color: var(--primary-pink);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .exp-content p {
            margin: 8px 0;
            line-height: 1.6;
        }

        .vocab-list {
            background: white;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #ccc;
            margin-bottom: 10px;
        }
        
        .vocab-item {
            font-size: 0.95rem;
            color: #444;
        }

        .translation {
            font-style: italic;
            color: #0984e3;
            font-weight: 600;
        }

        .reason-correct {
            color: var(--correct-color);
            font-weight: 700;
        }

        .reason-wrong {
            color: #636e72;
            font-size: 0.9rem;
        }

        /* Special UI: Sale Sign */
        .sale-sign {
            background: #ff4757;
            color: white;
            padding: 15px;
            text-align: center;
            border: 4px dashed white;
            box-shadow: 0 0 0 4px #ff4757;
            border-radius: 10px;
            font-family: 'Arial Black', sans-serif;
            text-transform: uppercase;
            transform: rotate(-2deg);
            margin: 20px auto;
            width: 80%;
        }

        /* Special UI: Phone Message */
        .phone-msg {
            background: #e5e5ea;
            color: black;
            padding: 15px 20px;
            border-radius: 20px;
            border-bottom-left-radius: 5px;
            width: fit-content;
            margin: 20px 0;
            position: relative;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .phone-msg::before {
            content: "From: Mom";
            position: absolute;
            top: -20px;
            left: 5px;
            font-size: 0.8rem;
            color: #888;
        }

        /* Footer / Submit */
        .footer-controls {
            text-align: center;
            margin-top: 40px;
            padding-bottom: 40px;
        }

        .submit-btn {
            background: var(--primary-teal);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            box-shadow: 0 8px 0 #009e82;
            cursor: pointer;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #009e82;
        }
        
        .submit-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #009e82;
        }

        /* Score Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            animation: zoomIn 0.3s;
        }

        @keyframes zoomIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-pink);
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>BÀI KIỂM TRA GIỚI TỪ: IN - ON - AT - TO</h1>
        <div class="teacher-name"><i class="fas fa-chalkboard-teacher"></i> Giáo viên tạo: MS Chí Nên</div>
    </header>

    <div id="quiz-area">
        </div>

    <div class="footer-controls">
        <button class="submit-btn" onclick="submitQuiz()">NỘP BÀI & XEM ĐIỂM</button>
    </div>
</div>

<div id="scoreModal" class="modal">
    <div class="modal-content">
        <h2>KẾT QUẢ CỦA CON</h2>
        <div class="score-display" id="finalScore">0/30</div>
        <p id="feedbackMessage" style="font-size: 1.2rem; margin-bottom: 20px;"></p>
        <button class="submit-btn" onclick="location.reload()">LÀM LẠI BÀI</button>
    </div>
</div>

<script>
    // DATA SOURCE
    const questionData = [
        {
            q: "We often go swimming ______ the summer.",
            a: "in", b: "on", c: "at", d: "to", correct: "a",
            vocab: "A. in (trong - dùng cho mùa); B. on (trên - dùng cho ngày); C. at (tại - dùng cho giờ); D. to (đến - dùng cho chuyển động)",
            trans: "Chúng tôi thường đi bơi vào mùa hè.",
            why_true: "Dùng 'in' trước các mùa trong năm (in spring, in summer, in autumn, in winter).",
            why_false: "Sai vì 'summer' là mùa, không dùng on, at hay to."
        },
        {
            q: "My father usually wakes up ______ 6 o'clock.",
            a: "in", b: "on", c: "at", d: "to", correct: "c",
            vocab: "A. in; B. on; C. at (lúc - dùng cho giờ cụ thể); D. to",
            trans: "Bố tôi thường thức dậy lúc 6 giờ.",
            why_true: "Dùng 'at' trước giờ cụ thể (at 6 o'clock, at 7 p.m.).",
            why_false: "In/On không dùng cho giờ đồng hồ."
        },
        {
            q: "Are you free ______ Sunday morning?",
            a: "in", b: "on", c: "at", d: "of", correct: "b",
            vocab: "A. in; B. on (vào); C. at; D. of (của)",
            trans: "Bạn có rảnh vào sáng Chủ nhật không?",
            why_true: "Dùng 'on' khi cụm từ chỉ thời gian có chứa Thứ (Sunday) dù có buổi (morning) đi kèm.",
            why_false: "Nếu chỉ có 'morning' thì dùng 'in', nhưng có 'Sunday' phải ưu tiên dùng 'on'."
        },
        {
            q: "I was born ______ 2015.",
            a: "at", b: "on", c: "in", d: "to", correct: "c",
            vocab: "A. at; B. on; C. in (trong/vào); D. to",
            trans: "Tôi sinh năm 2015.",
            why_true: "Dùng 'in' trước năm (in 1990, in 2020, in 2015).",
            why_false: "On dùng cho ngày cụ thể; At dùng cho giờ."
        },
        {
            q: "We give each other gifts ______ Christmas Day.",
            a: "in", b: "on", c: "at", d: "for", correct: "b",
            vocab: "A. in; B. on; C. at; D. for (cho)",
            trans: "Chúng tôi tặng quà cho nhau vào ngày Giáng sinh.",
            why_true: "Có chữ 'Day' trong ngày lễ thì bắt buộc dùng 'on' (On Christmas Day).",
            why_false: "Nếu chỉ nói 'Christmas' (dịp lễ) thì dùng 'at', nhưng có 'Day' phải dùng 'on'."
        },
        {
            q: "My family stays at home ______ Christmas.",
            a: "in", b: "on", c: "at", d: "to", correct: "c",
            vocab: "A. in; B. on; C. at (vào dịp); D. to",
            trans: "Gia đình tôi ở nhà vào dịp Giáng sinh.",
            why_true: "Dùng 'at' cho các dịp lễ hội nói chung không có chữ 'Day' (at Christmas, at Easter).",
            why_false: "Sai vì đây là dịp lễ, không phải ngày cụ thể."
        },
        {
            q: "The stars shine brightly ______ night.",
            a: "in", b: "on", c: "at", d: "to", correct: "c",
            vocab: "A. in; B. on; C. at; D. to",
            trans: "Những ngôi sao tỏa sáng rực rỡ vào ban đêm.",
            why_true: "Cụm cố định: 'at night' (vào ban đêm).",
            why_false: "Ta nói 'in the morning/afternoon/evening' nhưng phải là 'at night'."
        },
        {
            q: "She walks ______ the park every afternoon.",
            a: "in", b: "at", c: "to", d: "on", correct: "c",
            vocab: "A. in (trong); B. at (tại); C. to (đến); D. on (trên)",
            trans: "Cô ấy đi bộ đến công viên mỗi buổi chiều.",
            why_true: "Động từ 'walk' (đi bộ) chỉ sự chuyển động đến một địa điểm -> dùng 'to'.",
            why_false: "'Walk in the park' nghĩa là đi dạo loanh quanh bên trong công viên. Nhưng ngữ cảnh đi từ chỗ khác 'đến' công viên thì 'to' tự nhiên hơn với động từ chuyển động hướng đích."
        },
        {
            q: "The bus will arrive ______ a minute.",
            a: "in", b: "on", c: "at", d: "about", correct: "a",
            vocab: "A. in (trong vòng); B. on; C. at; D. about (khoảng)",
            trans: "Xe buýt sẽ đến trong 1 phút nữa.",
            why_true: "Dùng 'in' + khoảng thời gian để chỉ tương lai (trong bao lâu nữa việc gì sẽ xảy ra).",
            why_false: "At/On không dùng cho khoảng thời gian theo nghĩa này."
        },
        {
            q: "Ho Chi Minh was born ______ May 19th, 1890.",
            a: "in", b: "on", c: "at", d: "of", correct: "b",
            vocab: "A. in; B. on; C. at; D. of",
            trans: "Hồ Chí Minh sinh ngày 19 tháng 5 năm 1890.",
            why_true: "Dùng 'on' trước ngày tháng năm cụ thể.",
            why_false: "Dù có tháng và năm, nhưng vì có 'ngày 19' (Specific Day) nên 'on' là mạnh nhất."
        },
        {
            q: "Someone is knocking ______ the door.",
            a: "in", b: "on", c: "at", d: "to", correct: "c",
            vocab: "A. in; B. on; C. at (tại); D. to",
            trans: "Ai đó đang gõ cửa (đứng tại cửa).",
            why_true: "Cụm từ chỉ vị trí cụ thể: 'at the door' (tại cánh cửa).",
            why_false: "'On the door' nghĩa là dán cái gì lên mặt cửa. Người đứng thì dùng 'at'."
        },
        {
            q: "I am busy ______ the moment.",
            a: "in", b: "on", c: "at", d: "with", correct: "c",
            vocab: "A. in; B. on; C. at; D. with",
            trans: "Lúc này tôi đang bận.",
            why_true: "Cụm cố định: 'at the moment' = now (ngay lúc này).",
            why_false: "Không dùng in/on the moment."
        },
        {
            q: "We are flying to Da Nang ______ tomorrow morning.",
            a: "in", b: "on", c: "at", d: "X (no word)", correct: "d",
            vocab: "A. in; B. on; C. at; D. X (không điền gì)",
            trans: "Chúng tôi sẽ bay đến Đà Nẵng vào sáng mai.",
            why_true: "Không dùng giới từ trước 'tomorrow', 'yesterday', 'tonight'.",
            why_false: "'On tomorrow morning' là sai ngữ pháp."
        },
        {
            q: "The picture is ______ the wall.",
            a: "in", b: "on", c: "at", d: "to", correct: "b",
            vocab: "A. in; B. on (trên bề mặt); C. at; D. to",
            trans: "Bức tranh ở trên tường.",
            why_true: "Dùng 'on' khi vật nằm trên bề mặt của vật khác (on the wall, on the table).",
            why_false: "'In the wall' là nằm trong khối tường."
        },
        {
            q: "He goes ______ school by bike.",
            a: "in", b: "on", c: "at", d: "to", correct: "d",
            vocab: "A. in; B. on; C. at; D. to (đến)",
            trans: "Cậu ấy đi đến trường bằng xe đạp.",
            why_true: "Cấu trúc 'go to [place]' (đi đến đâu).",
            why_false: "Go in/on/at school là sai ngữ pháp với động từ 'go'."
        },
        {
            q: "We have lunch ______ noon.",
            a: "in", b: "on", c: "at", d: "to", correct: "c",
            vocab: "A. in; B. on; C. at; D. to",
            trans: "Chúng tôi ăn trưa vào buổi trưa.",
            why_true: "Cụm cố định: 'at noon' (lúc 12 giờ trưa).",
            why_false: "In the noon (Sai) -> Phải là In the afternoon."
        },
        {
            q: "Dinosaurs lived ______ the 19th century.",
            a: "in", b: "on", c: "at", d: "to", correct: "a",
            vocab: "A. in (trong); B. on; C. at; D. to",
            trans: "Khủng long (ví dụ) sống trong thế kỷ 19.",
            why_true: "Dùng 'in' trước thế kỷ (in the 19th century).",
            why_false: "Thế kỷ là khoảng thời gian dài, dùng 'in'."
        },
        {
            q: "I received many flowers ______ my birthday.",
            a: "in", b: "on", c: "at", d: "to", correct: "b",
            vocab: "A. in; B. on; C. at; D. to",
            trans: "Tôi nhận được nhiều hoa vào ngày sinh nhật của mình.",
            why_true: "Birthday là một ngày cụ thể -> Dùng 'on'.",
            why_false: "Các đáp án khác không dùng cho ngày."
        },
        {
            q: "Look! There is a bird ______ the top of the tree.",
            a: "in", b: "on", c: "at", d: "to", correct: "c",
            vocab: "A. in; B. on; C. at; D. to",
            trans: "Nhìn kìa! Có một con chim ở trên ngọn cây.",
            why_true: "Cụm cố định: 'at the top of' (ở đỉnh/ngọn) hoặc 'at the bottom of' (ở dưới đáy).",
            why_false: "On the top cũng dùng được nhưng 'at the top' chỉ vị trí điểm chính xác hơn trong ngữ cảnh này theo lý thuyết."
        },
        {
            q: "Turn left! The bank is ______ the right.",
            a: "in", b: "on", c: "at", d: "to", correct: "b",
            vocab: "A. in; B. on; C. at; D. to",
            trans: "Rẽ trái đi! Ngân hàng ở bên tay phải.",
            why_true: "Cụm cố định: 'on the left' / 'on the right'.",
            why_false: "At/in the right là sai."
        },
        {
            q: "My dad is sitting ______ the armchair.",
            a: "in", b: "on", c: "at", d: "to", correct: "a",
            vocab: "A. in (trong); B. on (trên); C. at; D. to",
            trans: "Bố tôi đang ngồi trong ghế bành.",
            why_true: "Với ghế bành (armchair) có tay vịn bao quanh, ta dùng 'in'. Với ghế đẩu/ghế thường (chair) ta dùng 'on'.",
            why_false: "On the armchair (ít dùng hơn, chỉ ngồi lên tay vịn hoặc không ngồi lọt thỏm)."
        },
        {
            q: "Please write your name ______ the bottom of the page.",
            a: "in", b: "on", c: "at", d: "to", correct: "c",
            vocab: "A. in; B. on; C. at; D. to",
            trans: "Làm ơn viết tên bạn ở cuối trang giấy.",
            why_true: "Cụm cố định: 'at the bottom of...' (ở dưới cùng/đáy).",
            why_false: "In/On không đi với bottom trong ngữ cảnh này."
        },
        {
            q: "It often rains ______ May.",
            a: "in", b: "on", c: "at", d: "to", correct: "a",
            vocab: "A. in; B. on; C. at; D. to",
            trans: "Trời thường mưa vào tháng 5.",
            why_true: "Dùng 'in' trước tháng (in May, in June).",
            why_false: "Tháng dùng In, Ngày dùng On, Giờ dùng At."
        },
        {
            q: "Don't sit ______ the floor! It's dirty.",
            a: "in", b: "on", c: "at", d: "to", correct: "b",
            vocab: "A. in; B. on; C. at; D. to",
            trans: "Đừng ngồi trên sàn nhà! Nó bẩn lắm.",
            why_true: "Sàn nhà là bề mặt -> Dùng 'on'.",
            why_false: "In the floor là chui xuống dưới sàn."
        },
        {
            q: "She arrived home ______ yesterday afternoon.",
            a: "in", b: "on", c: "at", d: "X (no word)", correct: "d",
            vocab: "A. in; B. on; C. at; D. X",
            trans: "Cô ấy về nhà vào chiều hôm qua.",
            why_true: "Không dùng giới từ trước 'yesterday' + buổi.",
            why_false: "In yesterday afternoon là lỗi sai phổ biến."
        },
        {
            q: "We usually visit our grandparents ______ the weekend.",
            a: "in", b: "on", c: "at", d: "to", correct: "c",
            vocab: "A. in; B. on; C. at; D. to",
            trans: "Chúng tôi thường thăm ông bà vào cuối tuần.",
            why_true: "Theo Anh-Anh: 'at the weekend'. (Anh-Mỹ dùng On, nhưng At phổ biến trong giáo trình chuẩn Cambridge/Oxford).",
            why_false: "In the weekend là sai."
        },
        {
            q: "There is a big tree ______ front of my house.",
            a: "in", b: "on", c: "at", d: "to", correct: "a",
            vocab: "A. in; B. on; C. at; D. to",
            trans: "Có một cái cây lớn ở phía trước nhà tôi.",
            why_true: "Cụm cố định: 'in front of' (ở phía trước).",
            why_false: "On/At front of là sai giới từ."
        },
        {
            q: "Come ______ my house and we will study together.",
            a: "in", b: "on", c: "at", d: "to", correct: "d",
            vocab: "A. in; B. on; C. at; D. to",
            trans: "Hãy đến nhà tớ và chúng ta sẽ học cùng nhau.",
            why_true: "Come (động từ chuyển động) + to + địa điểm.",
            why_false: "Come in my house (vào trong nhà - ít dùng hơn 'đến nhà'), Come at là sai."
        },
        // Visual Question 1: Sale Sign
        {
            q: "Sale ends ______ Friday!",
            type: "visual-sign",
            a: "in", b: "on", c: "at", d: "to", correct: "b",
            vocab: "A. in; B. on; C. at; D. to",
            trans: "Đợt giảm giá kết thúc vào thứ Sáu!",
            why_true: "Friday là ngày trong tuần -> Dùng 'on'.",
            why_false: "Ngày dùng On."
        },
        // Visual Question 2: Phone Msg
        {
            q: "Are you coming ______ the party tonight?",
            type: "visual-phone",
            a: "in", b: "on", c: "at", d: "to", correct: "d",
            vocab: "A. in; B. on; C. at; D. to",
            trans: "Tối nay bạn có đến bữa tiệc không?",
            why_true: "Come (chuyển động) + to + địa điểm (the party).",
            why_false: "Come at/in là sai ngữ cảnh này."
        }
    ];

    // AUDIO
    const audioCorrect = new Audio('https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg');
    const audioWrong = new Audio('https://actions.google.com/sounds/v1/cartoon/clown_horn.ogg'); // Funny wrong sound

    // UTILS
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    // STATE
    let score = 0;
    
    // INIT
    window.onload = function() {
        shuffleArray(questionData);
        renderQuiz();
    }

    function renderQuiz() {
        const area = document.getElementById('quiz-area');
        area.innerHTML = '';

        questionData.forEach((item, index) => {
            let questionHTML = '';
            
            // Special UI Check
            if (item.type === 'visual-sign') {
                questionHTML = `<div class="sale-sign">${item.q}</div>`;
            } else if (item.type === 'visual-phone') {
                questionHTML = `<div class="phone-msg">${item.q}</div>`;
            } else {
                questionHTML = `<div class="question-text">${item.q}</div>`;
            }

            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.innerHTML = `
                <span class="question-number">Question ${index + 1}</span>
                ${questionHTML}
                <div class="options-grid">
                    <button class="option-btn" onclick="checkAnswer(this, '${item.correct}', ${index}, 'a')">A. ${item.a}</button>
                    <button class="option-btn" onclick="checkAnswer(this, '${item.correct}', ${index}, 'b')">B. ${item.b}</button>
                    <button class="option-btn" onclick="checkAnswer(this, '${item.correct}', ${index}, 'c')">C. ${item.c}</button>
                    <button class="option-btn" onclick="checkAnswer(this, '${item.correct}', ${index}, 'd')">D. ${item.d}</button>
                </div>
                <div class="explanation-box" id="exp-${index}">
                    <div class="exp-header"><i class="fas fa-glasses"></i> MS Chí Nên giải thích:</div>
                    <div class="vocab-list">
                        <div class="vocab-item"><strong>Phân tích từ vựng:</strong> ${item.vocab}</div>
                    </div>
                    <div class="exp-content">
                        <p class="translation">👉 Dịch: "${item.trans}"</p>
                        <p>✅ <span class="reason-correct">Tại sao ĐÚNG:</span> ${item.why_true}</p>
                        <p>❌ <span class="reason-wrong">Tại sao SAI:</span> ${item.why_false}</p>
                    </div>
                </div>
            `;
            area.appendChild(card);
        });
    }

    function checkAnswer(btn, correctVal, index, userChoice) {
        const parent = btn.parentElement;
        const buttons = parent.getElementsByClassName('option-btn');
        
        // Disable all buttons in this card
        for (let b of buttons) {
            b.disabled = true;
            if (b.innerText.toLowerCase().startsWith(correctVal + ".")) {
                b.classList.add('correct');
            }
        }

        const expBox = document.getElementById(`exp-${index}`);
        expBox.style.display = "block";

        if (userChoice === correctVal) {
            // Correct
            btn.classList.add('correct');
            score++;
            audioCorrect.currentTime = 0;
            audioCorrect.play();
            fireConfetti();
        } else {
            // Wrong
            btn.classList.add('wrong');
            audioWrong.currentTime = 0;
            audioWrong.play();
        }
    }

    function fireConfetti() {
        confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#8854C0', '#00C9A7', '#FF4757']
        });
    }

    function submitQuiz() {
        const modal = document.getElementById('scoreModal');
        const scoreText = document.getElementById('finalScore');
        const msg = document.getElementById('feedbackMessage');
        
        scoreText.innerText = `${score}/30`;
        
        if (score === 30) {
            msg.innerText = "🏆 TUYỆT VỜI! Con là thiên tài giới từ! MS Chí Nên rất tự hào!";
        } else if (score >= 20) {
            msg.innerText = "🎉 Rất tốt! Con nắm chắc bài rồi đấy, cố gắng thêm xíu nữa nhé!";
        } else {
            msg.innerText = "💪 Cố lên nhé! Hãy xem lại phần giải thích chi tiết bên dưới để hiểu bài hơn.";
        }
        
        modal.style.display = "flex";
        fireConfetti();
    }
</script>

<script>
// Remove password lock completely - direct quiz access
(function() {
    function unlockNow() {
        var pwIds = [
            'passwordModal', 'password-modal', 'pwModal', 'pw-modal', 'pw-overlay', 
            'lockModal', 'passModal', 'authModal', 'auth-modal', 'nameModal', 'name-modal', 'nameInputModal'
        ];
        pwIds.forEach(function(id) {
            var el = document.getElementById(id);
            if (el) {
                el.style.setProperty('display', 'none', 'important');
                try { el.remove(); } catch(e) {}
            }
        });

        var modalEls = document.querySelectorAll('.password-modal, .lock-modal, .lock-overlay, #lockOverlay, #auth-modal, .modal-overlay');
        modalEls.forEach(function(el) {
            if (el.id !== 'resultModal' && el.id !== 'result-modal' && el.id !== 'scoreModal') {
                el.style.setProperty('display', 'none', 'important');
                try { el.remove(); } catch(e) {}
            }
        });

        var mainIds = [
            'mainContent', 'main-content', 'mainHeader', 'main-header', 
            'app-container', 'app', 'quiz-wrapper', 'quizContainer', 'quiz-container', 'reading-content'
        ];
        mainIds.forEach(function(id) {
            var el = document.getElementById(id);
            if (el) {
                if (id === 'main-content' || id.toLowerCase().includes('header') || el.classList.contains('main-container')) {
                    el.style.setProperty('display', 'flex', 'important');
                } else {
                    el.style.setProperty('display', 'block', 'important');
                }
            }
        });

        if (typeof buildQuiz === 'function') { try { buildQuiz(); } catch(e){} }
        if (typeof initQuiz === 'function') { try { initQuiz(); } catch(e){} }
        if (typeof renderApp === 'function') { try { renderApp(); } catch(e){} }
        if (typeof renderQuiz === 'function') { try { renderQuiz(); } catch(e){} }
        if (typeof startQuiz === 'function') { try { startQuiz(); } catch(e){} }
        if (typeof renderAllQuestions === 'function') { try { renderAllQuestions(); } catch(e){} }
        if (typeof renderAll === 'function') { try { renderAll(); } catch(e){} }
        if (typeof startApp === 'function') { try { startApp(); } catch(e){} }
        if (typeof buildStarfield === 'function') { try { buildStarfield(); } catch(e){} }
        if (typeof spawnFloats === 'function') { try { spawnFloats(); } catch(e){} }
        if (typeof spawnFloaters === 'function') { try { spawnFloaters(); } catch(e){} }
        if (typeof createFloatingBubbles === 'function') { try { createFloatingBubbles(); } catch(e){} }
        if (typeof initAudio === 'function') { try { initAudio(); } catch(e){} }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', unlockNow);
    } else {
        unlockNow();
    }
    setTimeout(unlockNow, 50);
    setTimeout(unlockNow, 200);
    setTimeout(unlockNow, 600);
})();
</script>
