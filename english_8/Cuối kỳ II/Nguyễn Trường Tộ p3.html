<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Gamified Practice | Sunrise Theme</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

        :root {
            /* NEW THEME: Sunrise Oasis (Mint, Peach, Pastel Yellow, Soft Green) */
            --bg-gradient-1: #a8e6cf; /* Mint */
            --bg-gradient-2: #dcedc1; /* Soft Green */
            --bg-gradient-3: #ffd3b6; /* Peach */
            --bg-gradient-4: #ffaaa5; /* Pastel Coral */
            
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            
            /* Text Colors for Master Explanation */
            --c-word: #007bff; /* Xanh dương */
            --c-mean: #d2691e; /* Đất nung */
            --c-grammar: #dc3545; /* Đỏ */
            --c-green: #28a745; /* Xanh lá */
            --c-red: #c82333; /* Đỏ sậm */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3), var(--bg-gradient-4));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: #2d3436;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Background Emojis */
        .bg-shapes {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .shape {
            position: absolute;
            font-size: 3.5rem;
            opacity: 0.35;
            animation: float 12s infinite ease-in-out alternate;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.9));
        }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-60px) rotate(25deg); }
        }

        header {
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        header h1 {
            font-size: 1.3rem;
            color: #2e8b57;
            text-shadow: 1px 1px 2px #fff;
            font-weight: 800;
        }
        
        header .teacher {
            font-weight: 800;
            color: #ff6b6b;
            background: rgba(255,255,255,0.9);
            padding: 5px 15px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            font-size: 0.9rem;
        }

        .split-screen {
            display: flex;
            flex: 1;
            overflow: hidden;
            z-index: 10;
            padding: 15px;
            gap: 15px;
        }

        .panel {
            flex: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            padding: 25px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #ffaaa5 transparent;
        }

        .panel::-webkit-scrollbar { width: 8px; }
        .panel::-webkit-scrollbar-thumb { background: #ffaaa5; border-radius: 10px; }

        /* Reading Passage Styles */
        .passage-box {
            background: rgba(255,255,255,0.7);
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            border: 1px solid white;
        }
        .passage-title {
            font-size: 1.5rem;
            color: #2f3542;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #10ac84, #1dd1a1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .paragraph {
            font-size: 1.15rem;
            line-height: 1.8;
            margin-bottom: 12px;
            color: #2d3436;
            text-align: justify;
        }
        .btn-translate {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            border: none;
            padding: 6px 15px;
            border-radius: 12px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 800;
            color: #fff;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
            margin-bottom: 15px;
            display: inline-block;
        }
        .btn-translate:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 12px rgba(253, 160, 133, 0.4);
        }
        .translation-text {
            display: none;
            background: rgba(255, 255, 255, 0.85);
            padding: 15px;
            border-left: 5px solid #10ac84;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 1.05rem;
            color: #444;
            line-height: 1.6;
        }

        /* Glossary Styles */
        .glossary-box {
            background: rgba(255,255,255,0.9);
            border-radius: 16px;
            padding: 15px;
            margin-top: 20px;
            border: 2px dashed #1dd1a1;
            box-shadow: inset 0 0 10px rgba(29, 209, 161, 0.1);
        }
        .glossary-box h4 {
            color: #10ac84;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.2rem;
        }
        .glossary-table {
            width: 100%;
            border-collapse: collapse;
        }
        .glossary-table th, .glossary-table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            text-align: left;
            font-size: 1rem;
        }
        .glossary-table th { background: rgba(29, 209, 161, 0.15); color: #2d3436; font-weight: 800; }
        .glossary-table td:nth-child(1) { font-weight: bold; color: var(--c-word); }
        .glossary-table td:nth-child(2) { font-style: italic; color: #7f8fa6; }
        .glossary-table td:nth-child(3) { color: var(--c-mean); font-weight: 700;}

        /* Question Styles */
        .question-block {
            background: rgba(255,255,255,0.8);
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 25px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .question-block:hover {
            border-color: rgba(255, 170, 165, 0.5);
            transform: translateY(-2px);
        }
        .question-text {
            font-size: 1.25rem;
            font-weight: 800;
            color: #2f3640;
            margin-bottom: 18px;
            line-height: 1.5;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn-option {
            background: white;
            border: 2px solid #dcdde1;
            padding: 16px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #353b48;
            box-shadow: 0 4px 6px rgba(0,0,0,0.03);
            text-align: center;
        }
        .btn-option:hover {
            transform: translateY(-4px);
            border-color: #ffaaa5;
            box-shadow: 0 8px 15px rgba(255, 170, 165, 0.3);
            background: #fffcfc;
        }
        .btn-option.correct {
            background: #1dd1a1;
            color: white;
            border-color: #1dd1a1;
            box-shadow: 0 0 20px rgba(29, 209, 161, 0.5);
            transform: scale(1.05);
        }
        .btn-option.wrong {
            background: #ff6b6b;
            color: white;
            border-color: #ff6b6b;
        }
        .btn-option:disabled { cursor: not-allowed; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        /* Explanation Box */
        .explanation {
            display: none;
            margin-top: 20px;
            background: #fdfaf6;
            border-radius: 15px;
            padding: 18px;
            border-left: 6px solid #ff9f43;
            font-size: 1.05rem;
            line-height: 1.7;
            animation: fadeIn 0.5s ease-in-out;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.02);
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .explanation h5 { color: #2d3436; margin-bottom: 10px; font-size: 1.15rem; font-weight: 800;}
        
        /* Master Teacher Colored Spans */
        .p-word { color: var(--c-word); font-weight: 800; }
        .p-mean { color: var(--c-mean); font-weight: 700; }
        .p-grammar { color: var(--c-grammar); font-weight: 800; text-decoration: underline; text-decoration-style: wavy; }
        .hl-green { color: var(--c-green); font-weight: 800; }
        .hl-red { color: var(--c-red); font-weight: 800; text-decoration: line-through; }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 20px;
            background: linear-gradient(45deg, #1dd1a1 0%, #10ac84 100%);
            border: none;
            border-radius: 20px;
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(29, 209, 161, 0.4);
            transition: all 0.3s;
            text-transform: uppercase;
            margin-top: 25px;
            letter-spacing: 1px;
        }
        .btn-submit:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 15px 25px rgba(29, 209, 161, 0.6); }

        /* Modal Scorecard */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: white; border-radius: 25px; padding: 35px; width: 90%; max-width: 480px;
            text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            position: relative; overflow: hidden;
            border: 4px solid #a8e6cf;
            animation: modalPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes modalPop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-content input {
            width: 100%; padding: 15px; margin: 20px 0; border: 2px solid #dcedc1; border-radius: 15px; font-size: 1.2rem;
            outline: none; text-align: center; font-weight: 700; background: #fafafa;
        }
        .modal-content input:focus { border-color: #10ac84; background: #fff; }
        .modal-content img { width: 100%; max-height: 220px; object-fit: contain; border-radius: 15px; margin: 15px 0; }
        .score-text { font-size: 3.5rem; font-weight: 900; color: #ff6b6b; margin: 10px 0; text-shadow: 2px 2px 0 #ffeaa7;}
        .feedback-msg { font-size: 1.3rem; font-weight: 800; color: #10ac84; margin-bottom: 20px;}

        /* Confetti */
        .confetti { position: fixed; width: 12px; height: 12px; z-index: 9999; pointer-events: none; animation: fall linear forwards; border-radius: 3px; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }

        @media (max-width: 800px) {
            .split-screen { flex-direction: column; overflow-y: auto; }
            .panel { overflow-y: visible; }
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="bg-shapes">
        <div class="shape" style="top: 5%; left: 5%;">🚲</div>
        <div class="shape" style="top: 65%; left: 85%;">💻</div>
        <div class="shape" style="top: 25%; left: 75%;">🌊</div>
        <div class="shape" style="top: 85%; left: 15%;">🌧️</div>
        <div class="shape" style="top: 45%; left: 45%;">📱</div>
        <div class="shape" style="top: 55%; left: 10%;">🌪️</div>
    </div>

    <header>
        <h1>English Gamified Challenge 🌅</h1>
        <div class="teacher">Giáo viên tạo: MS Chí Nên</div>
    </header>

    <div class="split-screen">
        <div class="panel" id="left-panel">
            </div>
        
        <div class="panel" id="right-panel">
            <h2 style="text-align:center; color:#2f3542; margin-bottom:20px; font-weight: 900; text-shadow: 1px 1px 0 #fff;">🎮 BÀI TẬP TRẮC NGHIỆM 🎮</h2>
            <div id="questions-container"></div>
            <button class="btn-submit" onclick="showSubmitModal()">🎯 NỘP BÀI TÍNH ĐIỂM & XEM KẾT QUẢ</button>
        </div>
    </div>

    <div class="modal-overlay" id="scoreModal">
        <div class="modal-content" id="modalInner">
            <h2 style="color: #2d3436; font-weight: 800;">Nhập tên của bạn để nộp bài!</h2>
            <input type="text" id="studentName" placeholder="Ví dụ: Lisa Blackpink 🌸">
            <button class="btn-translate" style="font-size:1.3rem; padding: 12px 25px; width: 100%; border-radius: 15px;" onclick="calculateScore()">Xác nhận nộp bài 🚀</button>
        </div>
    </div>

    <script>
        // AUDIO CONTEXT (Tự sinh âm thanh)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.1); // C6
                gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                
                setTimeout(() => {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.connect(gain2); gain2.connect(audioCtx.destination);
                    osc2.type = 'triangle';
                    osc2.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc2.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.2);
                    gain2.gain.setValueAtTime(0.6, audioCtx.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc2.start(); osc2.stop(audioCtx.currentTime + 0.3);
                }, 150);
            }
        }

        function fireConfetti() {
            const colors = ['#1dd1a1', '#ff6b6b', '#feca57', '#54a0ff', '#ff9ff3'];
            for(let i=0; i<60; i++){
                let conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
                conf.style.top = '-15px';
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), 3500);
            }
        }

        // DATABASE ĐỀ BÀI (Full 100% Data từ Ảnh)
        const data = [
            {
                title: "Ex 8: BICYCLES",
                content: [
                    {
                        en: "The bicycle is one of the simplest yet most useful inventions in the world. What is most surprising is that it was not (1) ______ earlier, although the great inventor Leonardo da Vinci had drawn pictures for bicycles and also for flying machines and some other things. Those things were not produced (2) ______ long after he died.",
                        vi: "Xe đạp là một trong những phát minh đơn giản nhất nhưng hữu ích nhất trên thế giới. Điều đáng ngạc nhiên nhất là nó đã không được phát minh sớm hơn, mặc dù nhà phát minh vĩ đại Leonardo da Vinci đã vẽ những bức tranh về xe đạp và cả máy bay cùng một số thứ khác. Những thứ đó đã không được sản xuất cho đến tận rất lâu sau khi ông qua đời."
                    },
                    {
                        en: "A person riding a bicycle use (3) ______ energy to make the bicycle move, and there is no pollution at all when you are riding. Even so in developed (4) ______, most people don't travel to work by bicycle. It is not because bicycles are expensive or people feel (5) ______ if they ride to work. It's because (6) ______ cars on the roads becomes larger. It certainly becomes (7) ______ to ride a bicycle. As a result, more people put their bicycles away and go to work (8) ______ their cars, and in this way, the situation is made more serious.",
                        vi: "Một người đi xe đạp sử dụng rất ít năng lượng để làm cho chiếc xe di chuyển, và hoàn toàn không có sự ô nhiễm nào khi bạn đạp xe. Mặc dù vậy ở các quốc gia phát triển, hầu hết mọi người không đi làm bằng xe đạp. Đó không phải vì xe đạp đắt tiền hay do mọi người cảm thấy mệt mỏi nếu đạp xe đi làm. Đó là bởi vì số lượng ô tô trên đường phố ngày càng lớn hơn. Nó chắc chắn trở nên nguy hiểm hơn khi đi xe đạp. Kết quả là, nhiều người cất xe đạp đi và đi làm bằng ô tô của họ, và theo cách này, tình hình càng trở nên nghiêm trọng hơn."
                    },
                    {
                        en: "(9) ______ the best way to make riding safer and more popular is to create paths only for bicycle and to make (10) ______ so difficult and expensive for drivers to take their cars into the city that they will go back to use their bicycles.",
                        vi: "Có lẽ cách tốt nhất để làm cho việc đạp xe an toàn và phổ biến hơn là tạo ra những con đường chỉ dành riêng cho xe đạp và làm cho việc những người lái xe mang ô tô của họ vào thành phố trở nên quá khó khăn và đắt đỏ đến mức họ sẽ quay lại sử dụng xe đạp của mình."
                    }
                ],
                glossary: [
                    ["Invention", "Noun", "Sự phát minh, sáng chế"],
                    ["Surprising", "Adjective", "Đáng ngạc nhiên"],
                    ["Produce", "Verb", "Sản xuất"],
                    ["Energy", "Noun", "Năng lượng"],
                    ["Pollution", "Noun", "Sự ô nhiễm"],
                    ["Developed", "Adjective", "Phát triển (nước)"],
                    ["Serious", "Adjective", "Nghiêm trọng"],
                    ["Popular", "Adjective", "Phổ biến"],
                    ["Path", "Noun", "Con đường, lối đi"],
                    ["Expensive", "Adjective", "Đắt đỏ"]
                ],
                questions: [
                    {
                        id: 'e8_q1', text: "Question 1: What is most surprising is that it was not (1) ______ earlier...",
                        correct: "invented", options: ["had", "used", "invented", "ridden"],
                        explanation: `<h5>Dịch câu hỏi:</h5> Điều đáng ngạc nhiên nhất là nó đã không được (1) ______ sớm hơn...<br>
                        <h5>Phân tích 4 đáp án:</h5>
                        A. had (<span class='p-mean'>có</span>) <span class='hl-red'>❌ Sai nghĩa và sai cấu trúc bị động.</span><br>
                        B. used (<span class='p-mean'>sử dụng</span>) <span class='hl-red'>❌ Sai vì vế sau nhắc đến Leonardo da Vinci đã "vẽ tranh thiết kế", tức là nói về nguồn gốc ra đời của xe đạp chứ không phải việc sử dụng.</span><br>
                        C. invented (<span class='p-mean'>phát minh</span>) <span class='hl-green'>✅ Đúng. <span class='p-grammar'>Cấu trúc bị động quá khứ đơn (was + V-ed/P2). Xe đạp (it) không được 'phát minh' sớm hơn.</span></span><br>
                        D. ridden (<span class='p-mean'>cưỡi/đạp xe</span>) <span class='hl-red'>❌ Sai logic đoạn văn.</span><br>
                        🔍 <b>Dẫn chứng:</b> "...although the great <span class='p-word'>inventor</span> Leonardo da Vinci had drawn pictures..." 👉 Dịch: "...mặc dù <b><span style='color:red'>nhà phát minh</span></b> vĩ đại Leonardo da Vinci đã vẽ những bức tranh..."`
                    },
                    {
                        id: 'e8_q2', text: "Question 2: Those things were not produced (2) ______ long after he died.",
                        correct: "until", options: ["before", "when", "since", "until"],
                        explanation: `<h5>Dịch câu hỏi:</h5> Những thứ đó đã không được sản xuất (2) ______ rất lâu sau khi ông qua đời.<br>
                        <h5>Phân tích 4 đáp án:</h5>

        let userAnswers = {};
        const totalQuestions = 20; // 10 + 5 + 5

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function toggleTranslation(btn) {
            const transText = btn.nextElementSibling;
            if (transText.style.display === "block") {
                transText.style.display = "none";
                btn.innerHTML = "Mở dịch đoạn này 🌟";
                btn.style.background = "linear-gradient(135deg, #f6d365 0%, #fda085 100%)";
            } else {
                transText.style.display = "block";
                btn.innerHTML = "Ẩn dịch đoạn này 🙈";
                btn.style.background = "linear-gradient(135deg, #a8e6cf 0%, #1dd1a1 100%)";
            }
        }

        function renderApp() {
            const leftPanel = document.getElementById('left-panel');
            const questionsContainer = document.getElementById('questions-container');

            data.forEach((section, index) => {
                // Render Passage
                let htmlPassage = `<div class="passage-box"><h3 class="passage-title">${section.title}</h3>`;
                
                section.content.forEach(para => {
                    htmlPassage += `<div class="paragraph">${para.en}</div>
                                    <button class="btn-translate" onclick="toggleTranslation(this)">Mở dịch đoạn này 🌟</button>
                                    <div class="translation-text">${para.vi}</div>`;
                });

                // Render Glossary
                htmlPassage += `<div class="glossary-box">
                                    <h4>📚 Bảng Từ Vựng Học Thuật (Glossary)</h4>
                                    <table class="glossary-table">
                                        <tr><th>Từ vựng</th><th>Loại từ</th><th>Nghĩa Tiếng Việt</th></tr>`;
                section.glossary.forEach(word => {
                    htmlPassage += `<tr><td>${word[0]}</td><td>${word[1]}</td><td>${word[2]}</td></tr>`;
                });
                htmlPassage += `</table></div></div>`;
                leftPanel.innerHTML += htmlPassage;

                // Render Questions
                section.questions.forEach(q => {
                    let shuffledOptions = shuffle([...q.options]);
                    let htmlQ = `<div class="question-block" id="block-${q.id}">
                                    <div class="question-text">${q.text}</div>
                                    <div class="options-grid">`;
                    shuffledOptions.forEach(opt => {
                        let safeOpt = opt.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                        let safeCorrect = q.correct.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                        htmlQ += `<button class="btn-option" onclick="handleAnswer('${q.id}', '${safeOpt}', '${safeCorrect}', this)">${opt}</button>`;
                    });
                    htmlQ += `</div>
                              <div class="explanation" id="expl-${q.id}">${q.explanation}</div>
                              </div>`;
                    questionsContainer.innerHTML += htmlQ;
                });
            });
        }

        function handleAnswer(qId, selected, correct, btn) {
            const block = document.getElementById(`block-${qId}`);
            const buttons = block.querySelectorAll('.btn-option');
            // Prevent multiple clicks
            buttons.forEach(b => b.disabled = true);

            userAnswers[qId] = (selected === correct);

            if (selected === correct) {
                btn.classList.add('correct');
                playSound('correct');
                fireConfetti();
            } else {
                btn.classList.add('wrong');
                btn.classList.add('shake');
                playSound('wrong');
                // Auto highlight correct
                buttons.forEach(b => {
                    if (b.innerText === correct) {
                        b.classList.add('correct');
                    }
                });
            }

            // Show explanation
            document.getElementById(`expl-${qId}`).style.display = 'block';
        }

        function showSubmitModal() {
            document.getElementById('scoreModal').style.display = 'flex';
        }

        function calculateScore() {
            const name = document.getElementById('studentName').value.trim();
            if (!name) {
                alert("Bạn phải nhập tên trước khi nộp bài nhé! 📝");
                return;
            }

            let score = 0;
            for(let key in userAnswers) {
                if(userAnswers[key]) score++;
            }

            const modalInner = document.getElementById('modalInner');
            const percent = (score / totalQuestions) * 100;
            
            let gifUrl, msg, comment;
            if (percent === 100) {
                gifUrl = "https://media.giphy.com/media/xT0xezQGU5xCDJuCPe/giphy.gif"; // Smart/Einstein

            hideEl(document.getElementById(id), true);
        });

        var modalEls = document.querySelectorAll('.password-modal, .lock-modal, .lock-overlay, #lockOverlay, #auth-modal');
        modalEls.forEach(function(el) {
            if (el.id !== 'resultModal' && el.id !== 'result-modal' && el.id !== 'scoreModal') {
                hideEl(el, true);
            }
        });

        // Hide name-modal/nameModal only during page initialization (without deleting from DOM)
        ['nameModal', 'name-modal', 'nameInputModal'].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) {
                hideEl(el, false);
            }
        });

        var qo = document.getElementById('quiz-overlay');
        if (qo && (typeof isStarted === 'undefined' || !isStarted)) {
            qo.style.display = 'none';
        }

        var mainIds = [
            'mainContent', 'main-content', 'mainHeader', 'main-header',
            'app-container', 'app', 'quiz-wrapper', 'quizContainer', 'quiz-container', 'reading-content'
        ];
        mainIds.forEach(function(id) {
            var el = document.getElementById(id);
            if (el) {
                el.classList.remove('hidden', 'blur', 'blurred', 'locked');
                if (id === 'main-content' || id.toLowerCase().includes('header') || el.classList.contains('main-container')) {
                    el.style.setProperty('display', 'flex', 'important');
                } else {
                    el.style.setProperty('display', 'block', 'important');
                }
            }
        });

        var qs = document.getElementById('quiz-screen');
        if (qs) {
            qs.classList.remove('hidden');
            if (qs.classList.contains('flex-col')) {
                qs.classList.add('flex');
                qs.style.display = 'flex';
            } else {
                qs.style.display = 'block';
            }
        }

        if (!initDone) {
            initDone = true;

            if (document.getElementById('start-overlay') && typeof startGame === 'function') {
                var sn = document.getElementById('student-name') || document.getElementById('studentName');
                if (sn && !sn.value.trim()) sn.value = 'Học sinh';
            }
            if (document.getElementById('name-modal') && typeof startQuiz === 'function') {
                var sn2 = document.getElementById('student-name');
                if (sn2 && !sn2.value.trim()) sn2.value = 'Học sinh';
            }

            if (typeof buildQuiz === 'function') { try { buildQuiz(); } catch(e){} }
            if (typeof initQuiz === 'function') { try { initQuiz(); } catch(e){} }
            if (typeof renderApp === 'function') { try { renderApp(); } catch(e){} }
            if (typeof renderQuiz === 'function') { try { renderQuiz(); } catch(e){} }
            if (typeof renderQuestions === 'function') {
                try {
                    var qc = document.getElementById('quiz-container') || document.getElementById('questions-container');
                    if (!qc || qc.children.length === 0) renderQuestions();
                } catch(e){}
            }
            if (typeof startQuiz === 'function' && (typeof isStarted === 'undefined' || !isStarted)) { try { startQuiz(); } catch(e){} }
            if (typeof startGame === 'function') { try { startGame(); } catch(e){} }
            if (typeof startTest === 'function') { try { startTest(); } catch(e){} }
            if (typeof renderAllQuestions === 'function') { try { renderAllQuestions(); } catch(e){} }
            if (typeof renderAll === 'function') { try { renderAll(); } catch(e){} }
            if (typeof startApp === 'function') { try { startApp(); } catch(e){} }
            if (typeof buildStarfield === 'function') { try { buildStarfield(); } catch(e){} }
            if (typeof spawnFloats === 'function') { try { spawnFloats(); } catch(e){} }
            if (typeof spawnFloaters === 'function') { try { spawnFloaters(); } catch(e){} }
            if (typeof createFloatingBubbles === 'function') { try { createFloatingBubbles(); } catch(e){} }
            if (typeof initAudio === 'function') { try { initAudio(); } catch(e){} }
        } else {
            // If window.onload cleared or didn't populate quiz-container earlier, ensure questions are rendered
            if (typeof renderQuestions === 'function') {
                try {
                    var qc2 = document.getElementById('quiz-container') || document.getElementById('questions-container');
                    if (qc2 && qc2.children.length === 0) renderQuestions();
                } catch(e){}
            }
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', unlockNow);
    } else {
        unlockNow();
    }
    window.addEventListener('load', function() {
        setTimeout(unlockNow, 20);
        setTimeout(unlockNow, 200);
        setTimeout(unlockNow, 600);
    });
    setTimeout(unlockNow, 50);
    setTimeout(unlockNow, 200);
    setTimeout(unlockNow, 600);
    setTimeout(unlockNow, 1100);
})();
</script>
</body>
</html>
