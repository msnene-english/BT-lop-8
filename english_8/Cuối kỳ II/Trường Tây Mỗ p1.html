<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài Kiểm Tra Tiếng Anh – Khối 8 HK2</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --c1: #8bdeda; --c2: #43add0; --c3: #998ee0; --c4: #e17dc2; --c5: #ef9393;
  --glass: rgba(255,255,255,0.22);
  --glass-border: rgba(255,255,255,0.45);
  --correct: #00D26A; --wrong: #FF4757;
  --text-dark: #2d2550;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Nunito',sans-serif;
  min-height:100vh;
  background:linear-gradient(-45deg,#8bdeda,#43add0,#998ee0,#e17dc2,#ef9393,#8bdeda);
  background-size:500% 500%;
  animation:gradFlow 18s ease infinite;
  overflow-x:hidden;
  color:var(--text-dark);
}
@keyframes gradFlow{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* ====== FLOATING SHAPES ====== */
.bg-shapes{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden;}
.shape{position:absolute;opacity:.55;animation:floatUp linear infinite;}
@keyframes floatUp{
  0%{transform:translateY(110vh) rotate(0deg);opacity:0;}
  10%{opacity:.55;}
  90%{opacity:.55;}
  100%{transform:translateY(-15vh) rotate(720deg);opacity:0;}
}

/* ====== GIAO DIỆN MÀN HÌNH KHÓA (TÔNG XUYỆT TÔNG) ====== */
#passwordModal {
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  background: rgba(255, 255, 255, 0.2); 
  backdrop-filter: blur(15px);
}
.pw-card {
  background: var(--glass);
  backdrop-filter: blur(14px);
  border: 1.5px solid var(--glass-border);
  border-radius: 24px; padding: 48px 40px 40px; 
  max-width: 440px; width: 93%; text-align: center; position: relative;
  box-shadow: 0 10px 40px rgba(80,50,150,0.15);
}
.pw-crest { font-size:4rem; margin-bottom:8px; display:block; }
.pw-title { font-family:'Nunito', sans-serif; font-size:1.6rem; font-weight:900; color:#2d2550; margin-bottom:6px; }
.pw-sub   { font-size:.95rem; color:#555; margin-bottom:24px; font-weight:700; }
.pw-input {
  width:100%; padding:13px 20px; border-radius:12px;
  border:2.5px solid #c9b8f0; background:rgba(255,255,255,0.8);
  color:#2d2550; font-size:1.1rem; font-family:'Nunito', sans-serif; font-weight:800;
  outline:none; text-align:center; transition:all .3s;
}
.pw-input:focus { border-color:var(--c3); box-shadow:0 0 0 3px rgba(153,142,224,0.2); }
.pw-input.error { border-color:#FF4757; box-shadow:0 0 0 3px rgba(255,71,87,0.2); animation:shake .4s ease; }
.pw-input::placeholder { color:#aaa; font-weight:600; }
.pw-btn {
  width:100%; padding:14px; margin-top:14px; border-radius:12px; border:none;
  background:linear-gradient(135deg, var(--c3), var(--c4));
  color:#fff; font-size:1.1rem; font-weight:900; font-family:'Nunito', sans-serif;
  cursor:pointer; transition:transform .2s, box-shadow .2s;
}
.pw-btn:hover { transform:scale(1.03); box-shadow:0 8px 25px rgba(153,142,224,0.5); }
.pw-err { color:#FF4757; font-size:.9rem; margin-top:10px; display:none; font-weight:800; }

/* ====== HEADER ====== */
header{
  position:relative;z-index:10;
  text-align:center;
  padding:14px 20px 10px;
  background:rgba(255,255,255,0.28);
  backdrop-filter:blur(12px);
  border-bottom:1.5px solid var(--glass-border);
  box-shadow:0 4px 20px rgba(0,0,0,0.08);
}
header h1{font-size:1.35rem;font-weight:900;color:#2d2550;letter-spacing:0.3px;}
header p{font-size:.78rem;font-weight:600;color:#555;margin-top:2px;}

/* ====== MAIN CONTAINER ====== */
.container{position:relative;z-index:5;max-width:860px;margin:0 auto;padding:22px 16px 100px;}

/* ====== SECTION TITLE ====== */
.section-banner{
  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(10px);
  border:1.5px solid rgba(255,255,255,0.6);
  border-radius:16px;
  padding:12px 20px;
  margin:26px 0 14px;
  font-size:1rem;font-weight:800;color:#2d2550;
  box-shadow:0 4px 18px rgba(0,0,0,0.07);
}

/* ====== QUESTION CARD ====== */
.q-card{
  background:var(--glass);
  backdrop-filter:blur(14px);
  border:1.5px solid var(--glass-border);
  border-radius:20px;
  padding:22px 22px 16px;
  margin-bottom:18px;
  box-shadow:0 6px 28px rgba(80,50,150,0.12);
  transition:transform .2s;
}
.q-card:hover{transform:translateY(-2px);}
.q-num{
  display:inline-block;
  background:linear-gradient(135deg,var(--c3),var(--c4));
  color:#fff;font-weight:900;font-size:.82rem;
  padding:3px 11px;border-radius:20px;margin-bottom:10px;
}
.q-text{font-size:1.15rem;font-weight:700;color:#2d2550;line-height:1.6;margin-bottom:14px;}
.q-text u{text-decoration:underline;text-decoration-color:#e17dc2;text-decoration-thickness:2px;}

/* ====== OPTIONS GRID ====== */
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:540px){.options{grid-template-columns:1fr;}}
.opt-btn{
  background:rgba(255,255,255,0.55);
  border:2px solid rgba(255,255,255,0.75);
  border-radius:16px;
  padding:11px 16px;
  font-family:'Nunito',sans-serif;
  font-size:1.08rem;font-weight:700;
  color:#2d2550;cursor:pointer;
  box-shadow:0 5px 15px rgba(100,60,200,0.13),0 2px 0 rgba(255,255,255,0.8) inset;
  transition:transform .15s,box-shadow .15s,background .2s;
  text-align:left;
  user-select:none;
}
.opt-btn:hover:not(:disabled){
  transform:scale(1.04);
  box-shadow:0 8px 22px rgba(100,60,200,0.2);
  background:rgba(255,255,255,0.78);
}
.opt-btn.correct{
  background:linear-gradient(135deg,#00D26A,#00b35a)!important;
  color:#fff!important;border-color:#00D26A!important;
  box-shadow:0 6px 18px rgba(0,210,106,0.4)!important;
}
.opt-btn.wrong{
  background:linear-gradient(135deg,#FF4757,#d93848)!important;
  color:#fff!important;border-color:#FF4757!important;
  animation:shake .4s ease;
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}
.opt-btn:disabled{cursor:not-allowed;}

/* ====== EXPLANATION BOX ====== */
.expl-box{
  display:none;
  margin-top:14px;
  background:rgba(255,255,255,0.68);
  backdrop-filter:blur(8px);
  border-left:5px solid var(--c3);
  border-radius:0 14px 14px 0;
  padding:14px 16px;
  font-size:1rem;line-height:1.75;
  animation:slideDown .35s ease;
}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.expl-box.show{display:block;}

/* Explanation highlight classes */
.p-word{color:#1565C0;font-weight:700;}
.p-phonetic{background:#ede7f6;color:#6a1b9a;font-weight:700;padding:1px 5px;border-radius:5px;font-size:.95em;}
.p-mean{color:#bf360c;font-weight:600;}
.p-grammar{border-bottom:2px solid #e53935;color:#c62828;font-weight:700;}
.hl-green{color:#2e7d32;font-weight:800;}
.hl-red{color:#c62828;text-decoration:line-through;font-weight:700;}
.viet-trans{
  background:rgba(255,220,150,0.45);
  border-left:4px solid #f39c12;
  padding:7px 12px;
  border-radius:0 10px 10px 0;
  margin:8px 0;
  font-weight:700;color:#6d4c00;
  font-size:.97rem;
}

/* ====== SUBMIT BUTTON ====== */
.submit-wrap{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:20;
}
.submit-btn{
  background:linear-gradient(135deg,var(--c3),var(--c4));
  color:#fff;border:none;
  padding:14px 44px;border-radius:50px;
  font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:900;
  cursor:pointer;
  box-shadow:0 6px 28px rgba(153,142,224,0.55);
  transition:transform .2s,box-shadow .2s;
}
.submit-btn:hover{transform:scale(1.06);box-shadow:0 10px 35px rgba(153,142,224,0.7);}

/* ====== MODAL ====== */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(30,20,60,0.55);backdrop-filter:blur(6px);
  z-index:100;align-items:center;justify-content:center;
}
.modal-overlay.show{display:flex;}
.modal{
  background:rgba(255,255,255,0.92);backdrop-filter:blur(16px);
  border-radius:24px;padding:34px 30px;
  max-width:480px;width:92%;
  box-shadow:0 20px 60px rgba(80,50,150,0.25);
  animation:popIn .35s cubic-bezier(.34,1.56,.64,1);
  text-align:center;
}
@keyframes popIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.modal h2{font-size:1.4rem;font-weight:900;color:#2d2550;margin-bottom:12px;}
.modal input{
  width:100%;padding:12px 16px;
  border:2.5px solid #c9b8f0;border-radius:14px;
  font-family:'Nunito',sans-serif;font-size:1.05rem;font-weight:700;
  outline:none;margin:10px 0;color:#2d2550;
  transition:border-color .2s;
}
.modal input:focus{border-color:var(--c3);}
.modal input.err{border-color:#FF4757;animation:shake .3s;}
.modal-btn{
  background:linear-gradient(135deg,var(--c3),var(--c4));
  color:#fff;border:none;padding:12px 36px;
  border-radius:50px;font-family:'Nunito',sans-serif;
  font-size:1rem;font-weight:900;cursor:pointer;margin-top:10px;
  box-shadow:0 4px 18px rgba(153,142,224,0.4);
  transition:transform .15s;
}
.modal-btn:hover{transform:scale(1.05);}
.result-score{font-size:2.8rem;font-weight:900;color:var(--c3);margin:10px 0;}
.result-msg{font-size:1.1rem;font-weight:700;color:#2d2550;margin-bottom:14px;}
.meme-img{width:200px;height:180px;object-fit:cover;border-radius:16px;margin:10px auto;display:block;}
.redo-btn{
  background:linear-gradient(135deg,var(--c1),var(--c2));
  color:#fff;border:none;padding:10px 28px;
  border-radius:50px;font-family:'Nunito',sans-serif;
  font-size:.95rem;font-weight:800;cursor:pointer;margin-top:12px;
}

/* ====== CONFETTI ====== */
.confetti-piece{
  position:fixed;width:10px;height:10px;
  border-radius:2px;z-index:9999;
  animation:confettiFall linear forwards;
  pointer-events:none;
}
@keyframes confettiFall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1;}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0;}
}
</style>
</head>
<body>

<div class="bg-shapes" id="bgShapes"></div>

<div id="passwordModal">
  <div class="pw-card">
    <span class="pw-crest">🔒</span>
    <div class="pw-title">BẢO MẬT</div>
    <div class="pw-sub">Vui lòng nhập mật khẩu để làm bài</div>
    <input type="password" class="pw-input" id="pwInput" placeholder="Nhập mật khẩu..." autocomplete="off" />
    <button class="pw-btn" onclick="checkPassword()">XÁC NHẬN</button>
    <div class="pw-err" id="pwErr">Mật khẩu không đúng! Vui lòng thử lại.</div>
  </div>
</div>

<div id="mainContent" style="display: none;">
  <header>
    <h1>🎯 Đề Cương Ôn Tập HK2 – Tiếng Anh Lớp 8</h1>
    <p>Giáo viên tạo: <strong>MS Chí Nên – ULIS</strong> &nbsp;|&nbsp; Trường THCS Tây Mỗ</p>
  </header>

  <div class="container" id="quizContainer"></div>

  <div class="submit-wrap">
    <button class="submit-btn" onclick="openSubmit()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
  </div>
</div>

<div class="modal-overlay" id="nameModal">
  <div class="modal">
    <h2>📝 Nhập Tên Của Bạn</h2>
    <p style="color:#555;font-size:.95rem;">Để xem kết quả cá nhân hóa, hãy nhập tên đầy đủ nhé!</p>
    <input type="text" id="studentName" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50">
    <div id="nameErr" style="color:#FF4757;font-size:.88rem;display:none;">⚠️ Bạn chưa nhập tên!</div>
    <button class="modal-btn" onclick="submitQuiz()">✅ XEM KẾT QUẢ</button>
  </div>
</div>

<div class="modal-overlay" id="resultModal">
  <div class="modal">
    <div id="resultContent"></div>
    <button class="redo-btn" onclick="location.reload()">🔄 Làm Lại Bài</button>
  </div>
</div>

<script>
// ============================
//  PASSWORD LOGIC & AUDIO
// ============================
const _k  = [49, 54, 49, 49]; 
const _pw = _k.map(c => String.fromCharCode(c)).join('');

// Khởi tạo file âm thanh
const introAudio = new Audio('https://hoctienganhcungcoMS Chí Nên.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/export_2rUjepgpwpTxnU6YGv6kmq.mp3');
const wrongAudio = new Audio('https://hoctienganhcungcoMS Chí Nên.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/Am_thanh_meme_Oi_doi_oi_huan_hoa_hong-www_tiengdong_com.mp3');

function checkPassword() {
  const inp = document.getElementById('pwInput');
  const err = document.getElementById('pwErr');
  if (inp.value === _pw) {
    document.getElementById('passwordModal').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    
    // Phát âm thanh dặn dò khi mở khóa thành công
    introAudio.play().catch(e => console.log("Lỗi phát âm thanh mở màn: ", e));
  } else {
    inp.classList.remove('error'); void inp.offsetWidth; inp.classList.add('error');
    err.style.display = 'block'; setTimeout(() => inp.classList.remove('error'), 500);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const pwInput = document.getElementById('pwInput');
  if(pwInput) pwInput.addEventListener('keydown', e => { if (e.key==='Enter') checkPassword(); });
});

// ============================
//  QUESTION DATA
// ============================
const sections = [
  { id:"ex1", title:"🔤 Exercise 1: Choose the word whose UNDERLINED part is pronounced DIFFERENTLY from that of the others." },
  { id:"ex2", title:"🔊 Exercise 2: Choose the word whose MAIN STRESSED SYLLABLE is placed DIFFERENTLY from that of the others." },
  { id:"ex3", title:"📝 Exercise 3: Choose the BEST ANSWER to complete each sentence." }
];

const questions = [
// ===== EX1 =====
{s:"ex1",n:1,
 q:"Chọn từ có phần <u>gạch chân</u> phát âm KHÁC với các từ còn lại:",
 opts:[
   {l:"A",t:"spee<u>ch</u>"},
   {l:"B",t:"<u>ch</u>atting"},
   {l:"C",t:"<u>ch</u>eer"},
   {l:"D",t:"<u>ch</u>emistry"}
 ],
 ans:"D",
 expl:`<div class="viet-trans">📌 Nhận biết cách đọc phụ âm "<u>ch</u>" trong tiếng Anh.</div>
<b>Phân tích phần gạch chân <span class='p-word'>"ch"</span>:</b><br>
• A. <span class='p-word'>speech</span> <span class='p-phonetic'>/spiːtʃ/</span> → <span class='p-grammar'>"ch" = /tʃ/</span><br>
• B. <span class='p-word'>chatting</span> <span class='p-phonetic'>/ˈtʃætɪŋ/</span> → <span class='p-grammar'>"ch" = /tʃ/</span><br>
• C. <span class='p-word'>cheer</span> <span class='p-phonetic'>/tʃɪər/</span> → <span class='p-grammar'>"ch" = /tʃ/</span><br>
• D. <span class='p-word'>chemistry</span> <span class='p-phonetic'>/ˈkemɪstri/</span> → <span class='p-grammar'>"ch" = /k/</span><br>
<span class='hl-green'>✓ Đáp án D: <b>chemistry</b></span> — "<u>ch</u>" có nguồn gốc Latin/Hy Lạp, đọc là <span class='p-phonetic'>/k/</span>.<br>
<span class='hl-red'>A, B, C</span>: "ch" trong speech, chatting, cheer đều đọc <span class='p-phonetic'>/tʃ/</span>.`
},
{s:"ex1",n:2,
 q:"Chọn từ có phần <u>gạch chân</u> phát âm KHÁC với các từ còn lại:",
 opts:[
   {l:"A",t:"distan<u>c</u>e"},
   {l:"B",t:"conferen<u>c</u>e"},
   {l:"C",t:"<u>c</u>omment"},
   {l:"D",t:"fa<u>c</u>e"}
 ],
 ans:"C",
 expl:`<div class="viet-trans">📌 Nhận biết cách đọc chữ "<u>c</u>" trong các vị trí khác nhau.</div>
<b>Phân tích phần gạch chân <span class='p-word'>"c"</span>:</b><br>
• A. <span class='p-word'>distance</span> <span class='p-phonetic'>/ˈdɪstəns/</span> → <span class='p-grammar'>c = /s/</span><br>
• B. <span class='p-word'>conference</span> <span class='p-phonetic'>/ˈkɒnfərəns/</span> → <span class='p-grammar'>c = /s/</span><br>
• C. <span class='p-word'>comment</span> <span class='p-phonetic'>/ˈkɒment/</span> → <span class='p-grammar'>c = /k/</span><br>
• D. <span class='p-word'>face</span> <span class='p-phonetic'>/feɪs/</span> → <span class='p-grammar'>c = /s/</span><br>
<span class='hl-green'>✓ Đáp án C: <b>comment</b></span> — "c" đứng trước "o" đọc là <span class='p-phonetic'>/k/</span>.<br>
<span class='hl-red'>A, B, D</span>: "c" trong distance, conference, face đọc là <span class='p-phonetic'>/s/</span> (trước e, a).`
},
{s:"ex1",n:3,
 q:"Chọn từ có phần <u>gạch chân</u> phát âm KHÁC với các từ còn lại:",
 opts:[
   {l:"A",t:"c<u>o</u>me"},
   {l:"B",t:"w<u>o</u>nder"},
   {l:"C",t:"g<u>o</u>lden"},
   {l:"D",t:"disc<u>o</u>ver"}
 ],
 ans:"C",
 expl:`<div class="viet-trans">📌 Nhận biết cách đọc nguyên âm "<u>o</u>" trong các từ khác nhau.</div>
<b>Phân tích phần gạch chân <span class='p-word'>"o"</span>:</b><br>
• A. <span class='p-word'>come</span> <span class='p-phonetic'>/kʌm/</span> → <span class='p-grammar'>o = /ʌ/</span><br>
• B. <span class='p-word'>wonder</span> <span class='p-phonetic'>/ˈwʌndər/</span> → <span class='p-grammar'>o = /ʌ/</span><br>
• C. <span class='p-word'>golden</span> <span class='p-phonetic'>/ˈɡəʊldən/</span> → <span class='p-grammar'>o = /əʊ/</span><br>
• D. <span class='p-word'>discover</span> <span class='p-phonetic'>/dɪˈskʌvər/</span> → <span class='p-grammar'>o = /ʌ/</span><br>
<span class='hl-green'>✓ Đáp án C: <b>golden</b></span> — "o" đọc là <span class='p-phonetic'>/əʊ/</span> (âm đôi dài).<br>
<span class='hl-red'>A, B, D</span>: "o" trong come, wonder, discover đọc là <span class='p-phonetic'>/ʌ/</span> (âm ngắn).`
},
{s:"ex1",n:4,
 q:"Chọn từ có phần <u>gạch chân</u> phát âm KHÁC với các từ còn lại:",
 opts:[
   {l:"A",t:"n<u>a</u>tive"},
   {l:"B",t:"n<u>a</u>tural"},
   {l:"C",t:"n<u>a</u>tion"},
   {l:"D",t:"n<u>a</u>me"}
 ],
 ans:"B",
 expl:`<div class="viet-trans">📌 Nhận biết cách đọc nguyên âm "<u>a</u>" trong các từ bắt đầu bằng "na-".</div>
<b>Phân tích phần gạch chân <span class='p-word'>"a"</span>:</b><br>
• A. <span class='p-word'>native</span> <span class='p-phonetic'>/ˈneɪtɪv/</span> → <span class='p-grammar'>a = /eɪ/</span><br>
• B. <span class='p-word'>natural</span> <span class='p-phonetic'>/ˈnætʃərəl/</span> → <span class='p-grammar'>a = /æ/</span><br>

// ============================
//  SHUFFLE
// ============================
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

// ============================
//  BUILD BACKGROUND SHAPES
// ============================
(function buildShapes(){
  const colors=['#8bdeda','#43add0','#998ee0','#e17dc2','#ef9393'];
  const shapes=['★','✦','♦','●','▲','♥','✿','◈'];
  const container=document.getElementById('bgShapes');
  for(let i=0;i<38;i++){
    const el=document.createElement('span');
    el.className='shape';
    const c=colors[i%colors.length];
    const s=shapes[i%shapes.length];
    const size=16+Math.random()*28;
    const left=Math.random()*100;
    const dur=12+Math.random()*18;
    const delay=Math.random()*18;
    el.textContent=s;
    el.style.cssText=`left:${left}%;font-size:${size}px;color:${c};animation-duration:${dur}s;animation-delay:${delay}s;filter:drop-shadow(0 0 6px ${c}88);`;
    container.appendChild(el);
  }
})();

// ============================
//  RENDER QUIZ
// ============================
let userAnswers={};
let shuffledOpts={};

function renderQuiz(){
  const container=document.getElementById('quizContainer');
  let html='';
  let curSection='';

  questions.forEach((q,idx)=>{
    // Section banner
    if(q.s!==curSection){
      curSection=q.s;
      const sec=sections.find(s=>s.id===curSection);
      html+=`<div class="section-banner">📚 ${sec.title}</div>`;
    }

    // Shuffle options
    const opts=shuffle([...q.opts]);
    shuffledOpts[idx]=opts;

    // Build option buttons
    let optHtml='';
    opts.forEach(o=>{
      optHtml+=`<button class="opt-btn" onclick="selectAnswer(${idx},'${o.l}')" id="opt-${idx}-${o.l}" data-val="${o.l}">${o.t}</button>`;
    });

    html+=`
    <div class="q-card" id="card-${idx}">
      <span class="q-num">Câu ${q.n}</span>
      <div class="q-text">${q.q}</div>
      <div class="options" id="opts-${idx}">${optHtml}</div>
      <div class="expl-box" id="expl-${idx}">${q.expl}</div>
    </div>`;
  });

  container.innerHTML=html;
}

// ============================
//  SELECT ANSWER
// ============================
function selectAnswer(qIdx,chosen){
  if(userAnswers[qIdx]!==undefined) return; // already answered
  userAnswers[qIdx]=chosen;
  const q=questions[qIdx];
  const correct=q.ans;

  // Disable all buttons
  const opts=document.querySelectorAll(`#opts-${qIdx} .opt-btn`);
  opts.forEach(btn=>{
    btn.disabled=true;
    const val=btn.getAttribute('data-val');
    if(val===correct){btn.classList.add('correct');}
    else if(val===chosen){btn.classList.add('wrong');}
  });

  // Show explanation
  document.getElementById(`expl-${qIdx}`).classList.add('show');

  if(chosen===correct){
    playDing();
    spawnConfetti(document.getElementById(`card-${qIdx}`));
  } else {
    playBuzz();
  }
}

// ============================
//  WEB AUDIO / MEME AUDIO
// ============================
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let audioCtx;
function getCtx(){if(!audioCtx)audioCtx=new AudioCtx();return audioCtx;}

function playDing(){
  try{
    const ctx=getCtx();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.type='sine';
    osc.frequency.setValueAtTime(880,ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1320,ctx.currentTime+0.12);
    gain.gain.setValueAtTime(0.4,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);
    osc.start();osc.stop(ctx.currentTime+0.5);
  }catch(e){}
}

function playBuzz(){
  // Chơi hiệu ứng âm thanh ối dồi ôi khi sai
  wrongAudio.currentTime = 0;
  wrongAudio.play().catch(e => console.log("Lỗi âm thanh: ", e));
}

// ============================
//  CONFETTI
// ============================
function spawnConfetti(cardEl){
  const colors=['#8bdeda','#43add0','#998ee0','#e17dc2','#ef9393','#ffdd57','#ff6b81'];
  const rect=cardEl.getBoundingClientRect();
  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;
  for(let i=0;i<22;i++){
    const piece=document.createElement('div');
    piece.className='confetti-piece';
    const c=colors[Math.floor(Math.random()*colors.length)];
    const x=cx+(-60+Math.random()*120);
    const dur=0.8+Math.random()*0.7;
    piece.style.cssText=`left:${x}px;top:${cy}px;background:${c};transform:rotate(${Math.random()*360}deg);animation-duration:${dur}s;`;
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(),dur*1000+100);
  }
}

// ============================
//  SUBMIT LOGIC
// ============================
function openSubmit(){
  document.getElementById('nameModal').classList.add('show');
  document.getElementById('studentName').focus();
}

document.getElementById('studentName').addEventListener('keydown',e=>{
  if(e.key==='Enter') submitQuiz();
});

function submitQuiz(){
  const nameInput=document.getElementById('studentName');
  const name=nameInput.value.trim();
  if(!name){
    nameInput.classList.add('err');
    document.getElementById('nameErr').style.display='block';
    setTimeout(()=>{nameInput.classList.remove('err');},400);
    return;
  }
  document.getElementById('nameModal').classList.remove('show');
  showResult(name);
}

function showResult(name){
  const total=questions.length;
  let correct=0;
  questions.forEach((q,i)=>{
    if(userAnswers[i]===q.ans) correct++;
  });
  const pct=Math.round(correct/total*100);

  let msg,meme;
  if(pct===100){
    msg=`🌟 THIÊN TÀI TUYỆT ĐỐI! <b>${name}</b> đã chinh phục 100%!`;
    meme='https://media.giphy.com/media/g9582DNuQppxC/giphy.gif';
  } else if(pct>=60){
    msg=`🎉 Xuất sắc lắm, <b>${name}</b>! Tiếp tục cố gắng nhé!`;
    meme='https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif';
  } else {
    msg=`💪 Cố lên, <b>${name}</b>! Ôn thêm là sẽ thành công thôi!`;
    meme='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';
  }

  document.getElementById('resultContent').innerHTML=`
    <div style="font-size:1.5rem;font-weight:900;color:#2d2550;margin-bottom:6px;">🏆 KẾT QUẢ</div>
    <div class="result-score">${correct} / ${total}</div>
    <div style="font-size:1.1rem;color:#555;margin-bottom:6px;">${pct}% chính xác</div>
    <div class="result-msg">${msg}</div>
    <img class="meme-img" src="${meme}" alt="result meme" onerror="this.style.display='none'">
    <div style="font-size:.9rem;color:#888;margin-top:8px;">Giáo viên: MS Chí Nên – ULIS</div>
  `;
  document.getElementById('resultModal').classList.add('show');

  // Fireworks if high score
  if(pct>=80){
    for(let i=0;i<5;i++){
      setTimeout(()=>{
        const fake=document.createElement('div');
        fake.style.cssText=`position:fixed;left:${10+Math.random()*80}%;top:${10+Math.random()*60}%;`;
        document.body.appendChild(fake);
        spawnConfetti(fake);
        setTimeout(()=>fake.remove(),200);
      },i*300);
    }
  }
}

renderQuiz();
