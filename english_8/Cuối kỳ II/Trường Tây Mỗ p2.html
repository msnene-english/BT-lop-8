<head>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            --text-main: #1e272e;
            --btn-hover: rgba(255, 255, 255, 0.3);
            --correct-color: #00b894;
            --incorrect-color: #ff4757;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #00f260, #0575e6, #8e2de2, #4a00e0);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* SVG Emoji Background Pattern */
        .bg-pattern {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            opacity: 0.15; pointer-events: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><text x='20' y='40' font-size='30'>🌪️</text><text x='100' y='80' font-size='30'>🏪</text><text x='30' y='120' font-size='30'>💻</text><text x='110' y='140' font-size='30'>🌧️</text></svg>");
        }

        /* HEADER */
        header {
            position: fixed; top: 0; left: 0; width: 100%; height: 50px;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border); z-index: 100;
            display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
        }
        .header-title { font-weight: 800; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .header-author { font-size: 0.9rem; font-weight: 600; color: #fff; background: rgba(0,0,0,0.2); padding: 4px 12px; border-radius: 20px; }

        /* SPLIT SCREEN LAYOUT */
        .container {
            display: flex; width: 100%; height: calc(100vh - 50px); margin-top: 50px;
        }

        .pane {
            flex: 1; padding: 20px; overflow-y: auto; scroll-behavior: smooth;
        }

        .pane::-webkit-scrollbar { width: 8px; }
        .pane::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); }
        .pane::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.4); border-radius: 4px; }

        .left-pane { border-right: 1px solid var(--glass-border); }
        .right-pane { padding-bottom: 100px; }

        /* GLASSMORPHISM CARDS */
        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
            border-radius: 20px; padding: 25px; margin-bottom: 30px;
            color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }

        /* READING STYLES */
        .passage-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 15px; color: #fff; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        .passage-text { font-size: 1.2rem; line-height: 1.8; margin-bottom: 15px; background: rgba(0,0,0,0.1); padding: 15px; border-radius: 12px; }
        .blank { display: inline-block; min-width: 40px; border-bottom: 2px dashed #fff; text-align: center; font-weight: bold; color: #ffeaa7; margin: 0 5px; }
        
        .btn-translate {
            background: linear-gradient(135deg, #ff9ff3, #feca57); border: none; padding: 8px 15px;
            border-radius: 15px; cursor: pointer; font-weight: bold; color: #2d3436;
            margin-top: 10px; display: inline-block; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-translate:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .translation-box {
            display: none; background: rgba(255, 255, 255, 0.9); color: #2d3436;
            padding: 15px; border-radius: 12px; margin-top: 10px; font-size: 1.1rem;
            border-left: 5px solid #00b894; text-shadow: none;
        }

        /* GLOSSARY */
        .glossary-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .glossary-table th, .glossary-table td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .glossary-table th { background: rgba(0,0,0,0.2); font-weight: 800; color: #feca57; }
        .glossary-table tr:last-child td { border-bottom: none; }
        .g-word { font-weight: bold; color: #81ecec; }

        /* QUESTION STYLES */
        .question-block { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px dashed rgba(255,255,255,0.3); }
        .q-number { font-weight: 800; font-size: 1.2rem; margin-bottom: 10px; color: #ffeaa7; background: rgba(0,0,0,0.2); display: inline-block; padding: 6px 15px; border-radius: 12px;}
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .option-btn {
            background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.4);
            color: #fff; padding: 15px; border-radius: 15px; font-size: 1.1rem; font-weight: 700;
            cursor: pointer; transition: all 0.3s; backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center;
        }
        .option-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.4); transform: scale(1.02); }
        .option-btn.correct { background: var(--correct-color); border-color: #fff; box-shadow: 0 0 15px var(--correct-color); }
        .option-btn.incorrect { background: var(--incorrect-color); border-color: #fff; animation: shake 0.4s ease; }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.8; }

        /* MASTER EXPLANATION STYLES (STRICT) */
        .explanation-box {
            display: none; background: rgba(255, 255, 255, 0.95); border-radius: 15px;
            padding: 20px; margin-top: 15px; color: #2d3436; text-shadow: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); border-left: 6px solid #e17055;
            font-size: 1.05rem; line-height: 1.6;
        }
        .explanation-box ul { list-style: none; padding-left: 10px; margin: 10px 0; }
        .explanation-box li { margin-bottom: 8px; }
        
        /* REQUIRED SPANS */
        .p-word { color: #0984e3; font-weight: 800; }
        .p-mean { color: #d35400; font-style: italic; font-weight: 600;}
        .p-grammar { text-decoration: underline red 2px; font-weight: 800; color: #2c3e50;}
        .hl-green { color: #00b894; font-weight: 900; background: rgba(0, 184, 148, 0.15); padding: 2px 6px; border-radius: 4px; text-transform: uppercase;}
        .hl-red { color: #d63031; text-decoration: line-through; font-weight: 600;}
        
        /* BẢN DỊCH HIGHLIGHT MỚI SIÊU NỔI BẬT */
        .highlight-box { 
            background: linear-gradient(135deg, #fff9c4 0%, #ffecb3 100%); 
            padding: 12px 18px; 
            border-radius: 12px; 
            border-left: 6px solid #ff9f00; 
            margin-top: 15px; 
            font-size: 1.15rem; 
            color: #1e272e; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* SUBMIT BUTTON */
        .submit-btn {
            display: block; width: 100%; max-width: 400px; margin: 30px auto; padding: 18px;
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #d63031; border: none; border-radius: 30px; font-size: 1.5rem; font-weight: 900;
            cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.2); transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .submit-btn:hover { transform: scale(1.05); filter: brightness(1.05); }

        /* MODALS */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .score-card {
            background: #fff; padding: 40px; border-radius: 30px; text-align: center;
            max-width: 500px; width: 90%; color: #2d3436; position: relative;
        }
        .score-card h2 { font-size: 2.5rem; color: #0984e3; margin-bottom: 10px; }
        .score-card .points { font-size: 4rem; font-weight: 900; color: #00b894; margin: 20px 0; }
        .score-card img { max-width: 100%; border-radius: 15px; margin: 15px 0; height: 250px; object-fit: cover;}
        #studentNameInput { width: 80%; padding: 15px; font-size: 1.2rem; border: 2px solid #0984e3; border-radius: 15px; margin-bottom: 20px; outline: none; text-align: center;}
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .left-pane { border-right: none; border-bottom: 2px dashed var(--glass-border); min-height: 50vh; }
            .options-grid { grid-template-columns: 1fr; }
        }

        /* GIAO DIỆN MÀN HÌNH KHÓA TỪ YÊU CẦU */
        #passwordModal {
            position:fixed; inset:0; z-index:9999;
            display:flex; align-items:center; justify-content:center;
            background:rgba(5,2,15,0.92); backdrop-filter:blur(20px);
        }
        .pw-card {
            background:linear-gradient(160deg, rgba(40,10,70,0.95) 0%, rgba(15,5,30,0.98) 100%);
            border:1.5px solid rgba(240,192,64,0.4); border-radius:24px; padding:48px 40px 40px; 
            max-width:440px; width:93%; text-align:center; position:relative; overflow:hidden;
            box-shadow:0 0 60px rgba(106,5,114,0.6), 0 0 120px rgba(240,192,64,0.1), inset 0 1px 0 rgba(240,192,64,0.15);
        }
        .pw-card::before {
            content:''; position:absolute; top:0; left:0; right:0; height:3px;
            background:linear-gradient(90deg, #6A0572, #F0C040, #6A0572);
        }
        .pw-crest { font-size:4rem; margin-bottom:8px; display:block; }
        .pw-title { font-family:'Cinzel', serif; font-size:1.4rem; font-weight:700; color:#F0C040; margin-bottom:6px; letter-spacing:1px; }
        .pw-sub   { font-size:.87rem; color:rgba(200,200,212,0.6); margin-bottom:24px; }
        .pw-input {
            width:100%; padding:13px 20px; border-radius:12px;
            border:1.5px solid rgba(240,192,64,0.3); background:rgba(255,255,255,0.05);
            color:#FFE082; font-size:1rem; font-family:'Nunito', sans-serif;
            outline:none; letter-spacing:3px; text-align:center; transition:all .3s;
        }
        .pw-input:focus { border-color:#F0C040; box-shadow:0 0 0 3px rgba(240,192,64,0.15); }
        .pw-input.error { border-color:#FF4757; box-shadow:0 0 0 3px rgba(255,71,87,0.25); animation:shake .4s ease; }
        .pw-input::placeholder { color:rgba(200,200,212,0.3); letter-spacing:1px; }
        .pw-btn {
            width:100%; padding:14px; margin-top:14px; border-radius:12px; border:none;
            background:linear-gradient(135deg, #6A0572 0%, #9B1FA8 40%, #F0C040 100%);
            color:#fff; font-size:1rem; font-weight:700; font-family:'Cinzel', serif;
            cursor:pointer; letter-spacing:.5px; transition:transform .2s;
        }
        .pw-btn:hover { transform:translateY(-2px); box-shadow:0 8px 32px rgba(106,5,114,0.7); }
        .pw-err { color:#ff8a9a; font-size:.84rem; margin-top:10px; display:none; font-weight:700; }
    </style>
</head>

<script>
// --- AUDIO CONTEXT ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playDing() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
}

function playWrong() {
    const w = document.getElementById('wrongAudio');
    w.currentTime = 0;
    w.play().catch(() => { /* fallback if blocked */ });
}

            { en: "Especially", type: "(adv)", vi: "Đặc biệt là" },

// --- UTILS ---
function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

    const readingPane = document.getElementById('readingPane');

        readingHTML += `<div class="glass-card" id="passage-${pIndex}">`;

        passage.paragraphs.forEach((para, idx) => {
            readingHTML += `
                <div class="passage-text">${para.text}</div>
                <button class="btn-translate" onclick="toggleTranslate('trans-${pIndex}-${idx}')">Mở dịch đoạn này 🌟</button>

        });

        if (passage.glossary && passage.glossary.length > 0) {
            readingHTML += `
                <h3 style="color:#feca57; margin-top: 20px; font-weight:800;">📚 Glossary (Bảng từ vựng):</h3>
                <table class="glossary-table">
                    <tr><th>Từ vựng</th><th>Loại từ</th><th>Nghĩa Tiếng Việt</th></tr>
            `;
            passage.glossary.forEach(g => {
                readingHTML += `<tr><td class="g-word">${g.en}</td><td>${g.type}</td><td>${g.vi}</td></tr>`;
            });
            readingHTML += `</table>`;
        }
        readingHTML += `</div>`;

        // Rendering Question Side
        questionHTML += `<div class="glass-card">`;
        questionHTML += `<h2 class="passage-title">EXERCISES: ${passage.title}</h2>`;
        
        passage.questions.forEach((q, qIndex) => {
            totalQuestions++;
            answersState[q.id] = { answered: false, isCorrect: false };
            
            // Shuffle options logic
            let shuffledOptions = shuffleArray([...q.options]);

            questionHTML += `
                <div class="question-block" id="block-${q.id}">
                    <div class="q-number">${q.text}</div>
                    <div class="options-grid" id="grid-${q.id}">
            `;
            
            shuffledOptions.forEach((opt, oIndex) => {
                const isCorr = opt.correct ? 'true' : 'false';
                questionHTML += `
                    <button class="option-btn" onclick="handleAnswer(this, '${q.id}', ${isCorr}, '${opt.text}')">
                        ${opt.text}
                    </button>
                `;
            });

            questionHTML += `
                    </div>
                    <div class="explanation-box" id="expl-${q.id}">${q.expl}</div>
                </div>
            `;
        });
        questionHTML += `</div>`;
    });

    questionHTML += `<button class="submit-btn" onclick="openSubmitModal()">🎯 NỘP BÀI TÍNH ĐIỂM 🎯</button>`;

    readingPane.innerHTML = readingHTML;
    questionPane.innerHTML = questionHTML;
}

// --- INTERACTIONS ---
function toggleTranslate(id) {
    const el = document.getElementById(id);
    if (el.style.display === 'block') {
        el.style.display = 'none';
    } else {
        el.style.display = 'block';
    }
}

function handleAnswer(btn, qId, isCorrect, textStr) {
    if (answersState[qId].answered) return; 

    const grid = document.getElementById(`grid-${qId}`);
    const buttons = grid.querySelectorAll('.option-btn');
    
    // Disable all buttons in this question
    buttons.forEach(b => b.disabled = true);
    
    answersState[qId].answered = true;
    answersState[qId].isCorrect = isCorrect;
    answeredCount++;

    // Update Blank in text
    const blankId = `b-${qId.replace('q-','')}`; // Maps q-p1-0 to b-p1-0
    const blankEl = document.getElementById(blankId);
    if(blankEl) {
        blankEl.innerText = textStr;
        blankEl.style.color = isCorrect ? '#00b894' : '#ff4757';
        blankEl.style.borderBottom = isCorrect ? '2px solid #00b894' : '2px solid #ff4757';
    }

    if (isCorrect) {
        btn.classList.add('correct');
        playDing();
        confetti({ particleCount: 60, spread: 60, origin: { y: 0.8 }, colors: ['#00b894', '#feca57', '#0984e3'] });
    } else {
        btn.classList.add('incorrect');
        playWrong();
        // Highlight the correct one
        buttons.forEach(b => {
            if (b.getAttribute('onclick').includes('true')) {
                b.classList.add('correct');
            }
        });
    }

    // Show Explanation
    document.getElementById(`expl-${qId}`).style.display = 'block';
}

// --- SUBMIT LOGIC ---
function openSubmitModal() {
    if(answeredCount < totalQuestions) {
        alert(`Bạn mới làm ${answeredCount}/${totalQuestions} câu. Vui lòng làm hết để nộp bài!`);
        return;
    }
    document.getElementById('nameModal').style.display = 'flex';
}

function processSubmit() {
    const nameInput = document.getElementById('studentNameInput').value.trim();
    if (!nameInput) {
        alert("Chiến binh chưa nhập tên kìa!");
        return;
    }
    
    document.getElementById('nameModal').style.display = 'none';
    
    let score = 0;
    for (const key in answersState) {
        if (answersState[key].isCorrect) score++;
    }
    
    const percentage = score / totalQuestions;
    let feedback = "";
    let gifSrc = "";

    if (percentage === 1) {
        feedback = "MS Chí Nên: Tuyệt cú mèo! Con là thiên tài ngoại ngữ! 🌟🏆";
        gifSrc = "https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif"; // Celebrate
    } else if (percentage >= 0.6) {
        feedback = "MS Chí Nên: Rất tốt! Cố gắng chút nữa là đạt điểm tối đa nha! 👏🔥";
        gifSrc = "https://media.giphy.com/media/fsQbx1hX7hPBBpIM5b/giphy.gif"; // High five
    } else {
        feedback = "MS Chí Nên: Chà... Có vẻ bài này hơi khoai. Đừng nản, đọc kỹ lại giải thích nhé! 💪❤️";
        gifSrc = "https://media.giphy.com/media/L95W4wv8nnb9K/giphy.gif"; // Crying/Cute
    }

    document.getElementById('resultName').innerText = `Chúc mừng, ${nameInput}!`;
    document.getElementById('resultScore').innerText = `${score} / ${totalQuestions}`;
    document.getElementById('resultFeedback').innerText = feedback;
    document.getElementById('resultGif').src = gifSrc;
    
    document.getElementById('resultModal').style.display = 'flex';
    if(percentage === 1) {
         confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 } });
    }
}

// --- PASSWORD MÀN HÌNH KHÓA ---
const _k  = [49, 54, 49, 49]; // "1611"
const _pw = _k.map(c => String.fromCharCode(c)).join('');

function checkPassword() {
    const inp = document.getElementById('pwInput');
    const err = document.getElementById('pwErr');
    if (inp.value === _pw) {
        document.getElementById('passwordModal').style.display = 'none';
        document.getElementById('mainContent').style.display = 'flex';
        renderApp();
        
        // Phát âm thanh chào mừng
        const greetingAudio = document.getElementById('greetingAudio');
        if(greetingAudio) {
            greetingAudio.currentTime = 0;
            greetingAudio.play().catch(e=>console.log("Autoplay blocked"));
        }
    } else {
        inp.classList.remove('error'); 
        void inp.offsetWidth; // Trigger reflow
        inp.classList.add('error');
        err.style.display = 'block'; 
        setTimeout(() => inp.classList.remove('error'), 500);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const pwInput = document.getElementById('pwInput');
    if(pwInput) pwInput.addEventListener('keydown', e => { if (e.key==='Enter') checkPassword(); });
});
</script>
