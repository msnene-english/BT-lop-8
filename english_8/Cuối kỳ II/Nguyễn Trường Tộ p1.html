<body>

<script>
// ==================== BẢO MẬT & AUDIO ====================
const _k  = [99, 111, 103, 97, 110, 103, 100, 97, 116, 100, 105, 101, 109, 99, 97, 111]; 
const _pw = _k.map(c => String.fromCharCode(c)).join('');

// Khởi tạo các file âm thanh
const reminderAudio = new Audio('https://hoctienganhcungcomaianulis.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/export_7wcKV5pKUrQYWyi7XgktJM.mp3');
const wrongAudio = new Audio('https://hoctienganhcungcomaianulis.github.io/homework/%E1%BA%A2nh_File%20nghe/File%20nghe%20Ket%20A2/huh_sound_effect-www_tiengdong_com.mp3');

function checkPassword() {
    const inp = document.getElementById('pwInput');
    const err = document.getElementById('pwErr');
    
    if (inp.value === _pw) {
        document.getElementById('passwordModal').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        
        // Phát đoạn đọc nhắc nhở học sinh ngay khi mở khóa thành công
        reminderAudio.play().catch(e => console.log('Không thể phát âm thanh:', e));
    } else {
        inp.classList.remove('error'); void inp.offsetWidth; inp.classList.add('error');
        err.style.display = 'block'; setTimeout(() => inp.classList.remove('error'), 500);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const pwInput = document.getElementById('pwInput');
    if(pwInput) pwInput.addEventListener('keydown', e => { if (e.key==='Enter') checkPassword(); });
});

// WEB AUDIO API (Dành riêng cho hiệu ứng ĐÚNG)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playDing() {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1);
    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.connect(gainNode); gainNode.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}

// Hàm chạy âm thanh SAI (Dùng MP3 link được cung cấp)
function playBuzz() {
    wrongAudio.currentTime = 0;
    wrongAudio.play().catch(e => console.log('Không thể phát âm thanh sai:', e));
}

// ==================== CONFETTI & UI ====================
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth; canvas.height = window.innerHeight;
let particles = [];
function fireConfetti(x, y) {
    const colors = ['#00D26A', '#FFD700', '#FF4757', '#0984e3', '#fdcb6e'];
    for (let i = 0; i < 50; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 18, vy: (Math.random() - 1) * 18,
            size: Math.random() * 8 + 5, color: colors[Math.floor(Math.random() * colors.length)],
            life: 1, lifeDecay: Math.random() * 0.02 + 0.01
        });
    }
}
function loopConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < particles.length; i++) {
        let p = particles[i]; p.vy += 0.5; p.x += p.vx; p.y += p.vy; p.life -= p.lifeDecay;
        if (p.life <= 0) { particles.splice(i, 1); i--; continue; }
        ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(loopConfetti);
}
loopConfetti();

const emojis = ['🌱', '🌍', '🦋', '♻️', '☀️', '💧', '🍃', '🌼', '🦜', '🌲'];
const bgContainer = document.getElementById('bg-elements');
for(let i=0; i<20; i++) {
    let el = document.createElement('div'); el.className = 'float-item';
    el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (Math.random() * 12 + 10) + 's';
    el.style.animationDelay = (Math.random() * 5) + 's';
    bgContainer.appendChild(el);
}

// ==================== DỮ LIỆU CÂU HỎI ====================
const rawQS = [
    // === EX 1: PHONETICS (1-10) ===
    {sec:"A. PHONETICS", ex:"Ex1. Choose the word which has a different sound in the underlined part in each line.", q:"1. ", opts:["pl<u>a</u>tform","sc<u>a</u>nner","f<u>a</u>rmer","tr<u>a</u>nslation"], ans:2, expl:`<div class='vi-translation'>Dịch đề bài: Chọn từ có phần gạch chân phát âm KHÁC với các từ còn lại.</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>platform</span> <span class='p-phonetic'>/ˈplætfɔːm/</span>: <span class='p-mean'>nền tảng</span></li>
            <li>• <span class='p-word'>scanner</span> <span class='p-phonetic'>/ˈskænə(r)/</span>: <span class='p-mean'>máy quét</span></li>
            <li>• <span class='p-word'>farmer</span> <span class='p-phonetic'>/ˈfɑːmə(r)/</span>: <span class='p-mean'>nông dân</span></li>
            <li>• <span class='p-word'>translation</span> <span class='p-phonetic'>/trænsˈleɪʃn/</span>: <span class='p-mean'>sự dịch thuật</span></li>
        </ul>
        <b>2. Dịch nghĩa toàn câu:</b> (Dạng bài phát âm không có câu cụ thể).<br>

    // === EX 3: VOCAB & GRAMMAR (1-15) ===
    {sec:"B. VOCABULARY & GRAMMAR", ex:"Ex3. Choose the best answer A, B, C, or D.", q:"1. My brother said via the phone that he _______ Sydney for a tour of the world.", opts:["is leaving","would leave","leaves","may leave"], ans:1, expl:`<div class='vi-translation'>Dịch: Anh trai tôi nói qua điện thoại rằng anh ấy sẽ rời Sydney để đi một vòng thế giới.</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>is leaving</span>: thì hiện tại tiếp diễn.</li>
            <li>• <span class='p-word'>would leave</span>: tương lai trong quá khứ (lùi thì từ 'will leave').</li>
            <li>• <span class='p-word'>leaves</span>: thì hiện tại đơn.</li>
            <li>• <span class='p-word'>may leave</span>: động từ khuyết thiếu (hiện tại).</li>
        </ul>
        <b>2. Dịch nghĩa toàn câu:</b> Như trên.<br>
        <b>3. Tại sao chọn "would leave"?</b><br>
        Dựa vào <span class='p-grammar'>Cấu trúc Câu tường thuật gián tiếp (Reported Speech)</span> với động từ giới thiệu "said" ở quá khứ, ta BẮT BUỘC phải lùi thì. -> Chọn <span class='hl-green'>would leave</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        Các đáp án còn lại chưa được lùi thì về quá khứ nên <span class='hl-red'>sai ngữ pháp</span>.
    </div>`},

    {q:"2. _______ disasters can force people to leave their homes.", opts:["Nature","Natures","Natural","Naturally"], ans:2, expl:`<div class='vi-translation'>Dịch: Các thảm họa thiên nhiên có thể buộc mọi người phải rời bỏ nhà cửa.</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>Nature</span> (n): <span class='p-mean'>thiên nhiên</span>.</li>
            <li>• <span class='p-word'>Natures</span> (n): <span class='p-mean'>thiên nhiên (số nhiều - hiếm dùng)</span>.</li>
            <li>• <span class='p-word'>Natural</span> (adj): <span class='p-mean'>thuộc về thiên nhiên</span>.</li>
            <li>• <span class='p-word'>Naturally</span> (adv): <span class='p-mean'>một cách tự nhiên</span>.</li>
        </ul>
        <b>2. Dịch nghĩa toàn câu:</b> Như trên.<br>
        <b>3. Tại sao chọn "Natural"?</b><br>
        Dựa vào <span class='p-grammar'>Vị trí từ loại</span>: Trước danh từ "disasters" (thảm họa) cần một Tính từ bổ nghĩa. Hơn nữa, ta có cụm từ cố định "Natural disasters" (thảm họa thiên nhiên). -> Chọn <span class='hl-green'>Natural</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        Sai từ loại. Chỗ trống không cần danh từ hay trạng từ <span class='hl-red'>đứng trước một danh từ khác</span>.
    </div>`},

    {q:"3. Natural disasters can cause serious _______ to human life.", opts:["benefit","damage","excitement","improvement"], ans:1, expl:`<div class='vi-translation'>Dịch: Thảm họa thiên nhiên có thể gây ra thiệt hại nghiêm trọng cho cuộc sống con người.</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>benefit</span> (n): <span class='p-mean'>lợi ích</span></li>
            <li>• <span class='p-word'>damage</span> (n): <span class='p-mean'>sự thiệt hại</span></li>
            <li>• <span class='p-word'>excitement</span> (n): <span class='p-mean'>sự hào hứng</span></li>
            <li>• <span class='p-word'>improvement</span> (n): <span class='p-mean'>sự cải thiện</span></li>
        </ul>
        <b>2. Dịch nghĩa toàn câu:</b> Như trên.<br>
        <b>3. Tại sao chọn "damage"?</b><br>
        Dựa vào <span class='p-grammar'>Collocation (cụm từ cố định)</span>: "cause damage to..." (gây thiệt hại cho ai/cái gì). Phù hợp với ngữ cảnh thảm họa thiên nhiên. -> Chọn <span class='hl-green'>damage</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        Các từ còn lại đều mang nghĩa tích cực, <span class='hl-red'>hoàn toàn sai ngữ cảnh</span> về thảm họa.
    </div>`},

    {q:"4. All the items at Timan shop are _______ for two days. Some of them are 50 % off.", opts:["online","on sale","out of stock","expensive"], ans:1, expl:`<div class='vi-translation'>Dịch: Mọi mặt hàng ở cửa hàng Timan đều đang giảm giá trong 2 ngày. Một vài món giảm tới 50%.</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>online</span> (adj/adv): <span class='p-mean'>trực tuyến</span></li>
            <li>• <span class='p-word'>on sale</span> (idiom): <span class='p-mean'>đang giảm giá / khuyến mãi</span></li>
            <li>• <span class='p-word'>out of stock</span> (idiom): <span class='p-mean'>hết hàng</span></li>
            <li>• <span class='p-word'>expensive</span> (adj): <span class='p-mean'>đắt đỏ</span></li>
        </ul>
        <b>2. Dịch nghĩa toàn câu:</b> Như trên.<br>
        <b>3. Tại sao chọn "on sale"?</b><br>
        Dấu hiệu nhận biết là câu sau có chữ <span class='p-grammar'>"50% off" (giảm giá 50%)</span>. Điều này chứng tỏ cửa hàng đang có đợt khuyến mãi. -> Chọn <span class='hl-green'>on sale</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        Các đáp án khác <span class='hl-red'>không logic với vế sau</span> (nếu đắt hoặc hết hàng thì không thể giảm giá 50%).
    </div>`},

    {q:"5. The teacher said that their school _______ new computers in the library.", opts:["equips","is equipping","has equipped","would equip"], ans:3, expl:`<div class='vi-translation'>Dịch: Giáo viên nói rằng trường của họ sẽ trang bị máy tính mới trong thư viện.</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>equips</span>: hiện tại đơn</li>
            <li>• <span class='p-word'>is equipping</span>: hiện tại tiếp diễn</li>
            <li>• <span class='p-word'>has equipped</span>: hiện tại hoàn thành</li>
            <li>• <span class='p-word'>would equip</span>: tương lai trong quá khứ</li>
        </ul>
        <b>2. Dịch nghĩa toàn câu:</b> Như trên.<br>
        <b>3. Tại sao chọn "would equip"?</b><br>
        Tương tự câu 1, đây là <span class='p-grammar'>Câu gián tiếp (Reported Speech)</span> với động từ tường thuật "said" (quá khứ). Nguyên tắc bắt buộc là phải Lùi Thì. -> Chọn <span class='hl-green'>would equip</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        Tất cả các đáp án A, B, C đều đang ở các thì HIỆN TẠI nên <span class='hl-red'>vi phạm quy tắc lùi thì</span>.
    </div>`},

    {q:"6. He said that his computer was downloading a big file _______.", opts:["at this moment","at that moment","at the moment","at moment"], ans:1, expl:`<div class='vi-translation'>Dịch: Anh ấy nói rằng máy tính của anh ấy đang tải một tệp lớn vào lúc đó.</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án (Cụm trạng ngữ chỉ thời gian):</b>
        <ul>
            <li>• <span class='p-word'>at this moment</span>: <span class='p-mean'>vào lúc này (dùng trong câu trực tiếp)</span></li>
            <li>• <span class='p-word'>at that moment</span>: <span class='p-mean'>vào lúc đó (đã lùi từ 'now/at this moment')</span></li>
            <li>• <span class='p-word'>at the moment</span> = now: <span class='p-mean'>bây giờ</span></li>
            <li>• <span class='p-word'>at moment</span>: <span class='p-mean'>sai ngữ pháp (thiếu mạo từ)</span></li>
        </ul>
        <b>2. Dịch nghĩa toàn câu:</b> Như trên.<br>
        <b>3. Tại sao chọn "at that moment"?</b><br>
        Trong <span class='p-grammar'>Câu tường thuật</span>, không chỉ động từ phải lùi thì, mà các Trạng từ chỉ thời gian cũng phải đổi. "now" / "at the moment" chuyển thành "then" / "at that moment". -> Chọn <span class='hl-green'>at that moment</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        Vì chúng <span class='hl-red'>chưa được biến đổi</span> theo quy tắc câu gián tiếp.
    </div>`},

    {q:"7. People rushed into public shelters as soon as the volcano _______.", opts:["erupted","raged","collapsed","buried"], ans:0, expl:`<div class='vi-translation'>Dịch: Mọi người đổ xô vào các hầm trú ẩn công cộng ngay khi núi lửa phun trào.</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>erupted</span> (v): <span class='p-mean'>phun trào</span></li>
            <li>• <span class='p-word'>raged</span> (v): <span class='p-mean'>nổi giận / hoành hành</span></li>
            <li>• <span class='p-word'>collapsed</span> (v): <span class='p-mean'>sụp đổ</span></li>
            <li>• <span class='p-word'>buried</span> (v): <span class='p-mean'>chôn vùi</span></li>
        </ul>
        <b>2. Dịch nghĩa toàn câu:</b> Như trên.<br>
        <b>3. Tại sao chọn "erupted"?</b><br>
        Dựa vào <span class='p-grammar'>Collocation</span>. Chủ ngữ là "the volcano" (núi lửa) thì động từ chuyên dụng đi kèm luôn là "erupt" (phun trào). -> Chọn <span class='hl-green'>erupted</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        Sai ngữ nghĩa. Núi lửa thì không sụp đổ hay tự chôn vùi trong ngữ cảnh này <span class='hl-red'>mà phải là phun trào nham thạch</span>.
    </div>`},

    {q:"8. Shaking hands is an ancient manner of greeting each other in a _______ meeting.", opts:["holography","multimedia","video-conferencing","face-to-face"], ans:3, expl:`<div class='vi-translation'>Dịch: Bắt tay là một cách chào hỏi cổ xưa khi gặp mặt trực tiếp.</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>holography</span> (n): <span class='p-mean'>ảnh ba chiều (hologram)</span></li>
            <li>• <span class='p-word'>multimedia</span> (n): <span class='p-mean'>đa phương tiện</span></li>
            <li>• <span class='p-word'>video-conferencing</span> (n): <span class='p-mean'>họp qua video trực tuyến</span></li>
            <li>• <span class='p-word'>face-to-face</span> (adj): <span class='p-mean'>trực tiếp / đối mặt</span></li>
        </ul>
        <b>2. Dịch nghĩa toàn câu:</b> Như trên.<br>
        <b>3. Tại sao chọn "face-to-face"?</b><br>
        Hành động "Shaking hands" (bắt tay) đòi hỏi sự tiếp xúc vật lý. Do đó, cuộc gặp mặt này phải diễn ra <span class='p-grammar'>trực tiếp ngoài đời thực</span>. -> Chọn <span class='hl-green'>face-to-face</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        Gặp qua mạng, qua video hay ảo ảnh (hologram) thì <span class='hl-red'>không thể chạm tay vào nhau được</span>.
    </div>`},

    {q:"9. The ground began to _______ when the earthquake occurred.", opts:["shake","litter","parade","dump"], ans:0, expl:`<div class='vi-translation'>Dịch: Mặt đất bắt đầu rung lắc khi trận động đất xảy ra.</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>shake</span> (v): <span class='p-mean'>rung, lắc</span></li>
            <li>• <span class='p-word'>litter</span> (v): <span class='p-mean'>vứt rác bừa bãi</span></li>
            <li>• <span class='p-word'>parade</span> (v): <span class='p-mean'>diễu hành</span></li>
            <li>• <span class='p-word'>dump</span> (v): <span class='p-mean'>đổ (rác)</span></li>
        </ul>
        <b>2. Dịch nghĩa toàn câu:</b> Như trên.<br>
        <b>3. Tại sao chọn "shake"?</b><br>
        Khi có "earthquake" (động đất), hiện tượng vật lý hiển nhiên là mặt đất (ground) sẽ bị <span class='p-grammar'>rung chuyển</span>. -> Chọn <span class='hl-green'>shake</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        Các động từ còn lại mang nghĩa vứt rác hay diễu hành <span class='hl-red'>vô nghĩa trong câu miêu tả thảm họa</span>.
    </div>`},

    {q:"10. Virtual Reality (VR) is the technology that places the user in a(n) _______ environment through a head-mounted device.", opts:["real","virtual","instant","private"], ans:1, expl:`<div class='vi-translation'>Dịch: Thực tế ảo (VR) là công nghệ đặt người dùng vào một môi trường ảo thông qua một thiết bị đeo trên đầu.</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>real</span> (adj): <span class='p-mean'>có thật</span></li>
            <li>• <span class='p-word'>virtual</span> (adj): <span class='p-mean'>ảo (mô phỏng bằng máy tính)</span></li>
            <li>• <span class='p-word'>instant</span> (adj): <span class='p-mean'>ngay lập tức</span></li>
            <li>• <span class='p-word'>private</span> (adj): <span class='p-mean'>riêng tư</span></li>
        </ul>
        <b>2. Dịch nghĩa toàn câu:</b> Như trên.<br>
        <b>3. Tại sao chọn "virtual"?</b><br>
        Ngay từ khoá chủ ngữ đã có "Virtual Reality" (Thực tế Ảo). Nhiệm vụ của công nghệ này là tạo ra một môi trường <span class='p-grammar'>không có thật (ảo)</span>. -> Chọn <span class='hl-green'>virtual</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        Nếu tạo ra môi trường thật (real) thì <span class='hl-red'>trái ngược hoàn toàn với định nghĩa VR</span>.
    </div>`},

    {q:"11. These are the children’s shoes. They’re _______.", opts:["their","they","theirs","them"], ans:2, expl:`<div class='vi-translation'>Dịch: Đây là những đôi giày của bọn trẻ. Chúng là của chúng.</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>their</span> (Tính từ sở hữu): <span class='p-mean'>của họ (phải cộng Noun)</span></li>
            <li>• <span class='p-word'>they</span> (Đại từ nhân xưng): <span class='p-mean'>họ (làm Chủ ngữ)</span></li>
            <li>• <span class='p-word'>theirs</span> (Đại từ sở hữu): <span class='p-mean'>của họ (= their + Noun)</span></li>
            <li>• <span class='p-word'>them</span> (Đại từ tân ngữ): <span class='p-mean'>họ (làm Tân ngữ)</span></li>
        </ul>
        <b>2. Dịch nghĩa toàn câu:</b> Như trên.<br>
        <b>3. Tại sao chọn "theirs"?</b><br>
        Để tránh lặp lại cụm "their shoes", ta dùng <span class='p-grammar'>Đại từ sở hữu (Possessive Pronouns)</span> "theirs" đứng độc lập cuối câu. -> Chọn <span class='hl-green'>theirs</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        Dùng "their" là <span class='hl-red'>sai vì thiếu danh từ phía sau</span>.
    </div>`},

    {q:"12. They were picking up rubbish on the road _______ I arrived.", opts:["before","while","after","when"], ans:3, expl:`<div class='vi-translation'>Dịch: Họ đang nhặt rác trên đường THÌ tôi đến.</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>before</span>: <span class='p-mean'>trước khi</span></li>
            <li>• <span class='p-word'>while</span>: <span class='p-mean'>trong khi (+ Quá khứ tiếp diễn)</span></li>
            <li>• <span class='p-word'>after</span>: <span class='p-mean'>sau khi</span></li>
            <li>• <span class='p-word'>when</span>: <span class='p-mean'>khi (+ Quá khứ đơn)</span></li>
        </ul>
        <b>2. Dịch nghĩa toàn câu:</b> Như trên.<br>
        <b>3. Tại sao chọn "when"?</b><br>
        Dựa vào <span class='p-grammar'>Sự phối hợp thì</span>: Một hành động đang xảy ra (were picking up - QK Tiếp diễn) thì bị một hành động khác xen vào (arrived - QK Đơn). Từ nối vế xen vào luôn là "when". -> Chọn <span class='hl-green'>when</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        "While" thường cộng với vế đang xảy ra (V-ing), <span class='hl-red'>không đi với V-ed ở vế này</span>.
    </div>`},

    {q:"13. Alex and Fiona are my new neighbours. _______ house is opposite _______.", opts:["Their/ mine","They/ mine","Theirs/ mine","Their/ my"], ans:0, expl:`<div class='vi-translation'>Dịch: Alex và Fiona là hàng xóm mới của tôi. Nhà CỦA HỌ đối diện nhà CỦA TÔI.</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• Chỗ trống 1 cần Tính từ sở hữu + Noun (house).</li>
            <li>• Chỗ trống 2 cần Đại từ sở hữu đứng độc lập (thay cho my house).</li>
        </ul>
        <b>2. Dịch nghĩa toàn câu:</b> Như trên.<br>
        <b>3. Tại sao chọn "Their/ mine"?</b><br>
        - Chỗ 1: Trước chữ "house" phải dùng <span class='p-grammar'>Tính từ sở hữu</span> "Their".<br>
        - Chỗ 2: Đứng cuối câu không có danh từ theo sau, thay thế cho "my house", ta dùng <span class='p-grammar'>Đại từ sở hữu</span> "mine". -> Chọn <span class='hl-green'>Their/ mine</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        Sai loại từ. Không thể dùng "Theirs house" hay dùng "my" <span class='hl-red'>mà thiếu danh từ phía sau</span>.
    </div>`},

    {q:"14. _______ online is more convenient than other kinds of shopping.", opts:["Shops","Shopper","Shopping","Shop"], ans:2, expl:`<div class='vi-translation'>Dịch: Việc mua sắm trực tuyến thì tiện lợi hơn các hình thức mua sắm khác.</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>Shops</span> (n): <span class='p-mean'>cửa hàng (số nhiều)</span></li>
            <li>• <span class='p-word'>Shopper</span> (n): <span class='p-mean'>người mua sắm</span></li>
            <li>• <span class='p-word'>Shopping</span> (Gerund): <span class='p-mean'>việc mua sắm</span></li>
            <li>• <span class='p-word'>Shop</span> (n/v): <span class='p-mean'>cửa hàng / đi mua sắm</span></li>
        </ul>
        <b>2. Dịch nghĩa toàn câu:</b> Như trên.<br>
        <b>3. Tại sao chọn "Shopping"?</b><br>
        Vị trí này đang đóng vai trò làm Chủ ngữ chỉ Hành động. Ta dùng <span class='p-grammar'>Danh động từ (Gerund - V-ing)</span>. "Shopping online" = Việc mua sắm qua mạng. -> Chọn <span class='hl-green'>Shopping</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        Dùng "Shops online" (Các cửa hàng trực tuyến) sẽ <span class='hl-red'>sai vì động từ to-be là "is" (số ít)</span>.
    </div>`},

    {q:"15. There is an interesting programme _______ television tonight.", opts:["in","next to","on","at"], ans:2, expl:`<div class='vi-translation'>Dịch: Có một chương trình thú vị TRÊN truyền hình tối nay.</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>in</span>: <span class='p-mean'>ở trong</span></li>
            <li>• <span class='p-word'>next to</span>: <span class='p-mean'>bên cạnh</span></li>
            <li>• <span class='p-word'>on</span>: <span class='p-mean'>ở trên (bề mặt / sóng truyền hình)</span></li>
            <li>• <span class='p-word'>at</span>: <span class='p-mean'>tại (địa điểm nhỏ)</span></li>
        </ul>
        <b>2. Dịch nghĩa toàn câu:</b> Như trên.<br>
        <b>3. Tại sao chọn "on"?</b><br>
        Dựa vào <span class='p-grammar'>Giới từ đi với phương tiện truyền thông</span>: "on television/ TV" (chiếu trên tivi), "on the radio" (phát trên đài), "on the internet" (trên mạng). -> Chọn <span class='hl-green'>on</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        Người Việt hay nói "trong tivi" nhưng tiếng Anh <span class='hl-red'>không dùng "in television"</span>.
    </div>`},

    // === EXCHANGES (16-18) ===
    {sec:"COMMUNICATION EXCHANGES", ex:"Mark the letter A, B, C or D to indicate the most suitable response.", q:"16. Tom: “Would you like to join our Greener Club?” - Nam: “_______”", opts:["You’re welcome.","No, I won’t.","Yes, I do too.","Yes, I’d love too."], ans:3, expl:`<div class='vi-translation'>Dịch: Tom: Bạn có muốn tham gia câu lạc bộ Greener của chúng mình không? - Nam: Có, mình rất thích.</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>You're welcome.</span>: <span class='p-mean'>Không có chi (Dùng để đáp lại lời cảm ơn).</span></li>
            <li>• <span class='p-word'>No, I won't.</span>: <span class='p-mean'>Từ chối thô lỗ, sai cấu trúc.</span></li>
            <li>• <span class='p-word'>Yes, I do too.</span>: <span class='p-mean'>Sai cấu trúc (đang hỏi would like).</span></li>
            <li>• <span class='p-word'>Yes, I'd love too.</span>: <span class='p-mean'>Có, mình rất muốn tham gia.</span></li>
        </ul>
        <b>2. Dịch nghĩa:</b> Như trên.<br>
        <b>3. Tại sao chọn "Yes, I'd love too"?</b><br>
        Để đáp lại lời mời lịch sự <span class='p-grammar'>"Would you like to...?"</span>, cách trả lời chuẩn và thân thiện nhất là "Yes, I'd love to". (Lưu ý: chữ 'too' trong đề gốc là lỗi đánh máy nhỏ, đúng ra là 'to', nhưng đây vẫn là đáp án đúng nhất). -> Chọn <span class='hl-green'>Yes, I'd love too.</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        <span class='hl-red'>Không phù hợp chức năng giao tiếp</span> của một lời mời.
    </div>`},

    {q:"17. A: The earthquake yesterday destroyed their house. B: _______", opts:["Yes, I know it.","Yes, I don’t like it.","That’s awful.","They should stay inside."], ans:2, expl:`<div class='vi-translation'>Dịch: A: Trận động đất hôm qua đã phá hủy nhà của họ. B: Điều đó thật tồi tệ.</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>Yes, I know it.</span>: <span class='p-mean'>Vâng, tôi biết điều đó (Quá vô cảm).</span></li>
            <li>• <span class='p-word'>Yes, I don't like it.</span>: <span class='p-mean'>Vâng, tôi không thích (Không liên quan).</span></li>
            <li>• <span class='p-word'>That's awful.</span>: <span class='p-mean'>Thật là tồi tệ / Đáng tiếc quá.</span></li>
            <li>• <span class='p-word'>They should stay inside.</span>: <span class='p-mean'>Họ nên ở trong nhà (Nhà sập rồi còn ở gì nữa).</span></li>
        </ul>
        <b>2. Dịch nghĩa:</b> Như trên.<br>
        <b>3. Tại sao chọn "That's awful"?</b><br>
        Khi một người chia sẻ <span class='p-grammar'>một tin buồn, tin xấu</span> (nhà bị sập), phép lịch sự giao tiếp là phải thể hiện sự đồng cảm, xót xa. -> Chọn <span class='hl-green'>That's awful.</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        Các câu còn lại <span class='hl-red'>thiếu sự thấu cảm, thậm chí là vô duyên</span> trong hoàn cảnh này.
    </div>`},

    {q:"18. A: Now, about the video conference ... Everyone must be here at 9:30 a.m., and ...<br>B: _______, but I think we should meet at 9:00 a.m.", opts:["Sorry for interrupting","I’m sorry","Sorry to interrupting","Excuse me"], ans:0, expl:`<div class='vi-translation'>Dịch: A: Bây giờ, về cuộc họp trực tuyến... Mọi người phải có mặt lúc 9:30 sáng, và...<br>B: XIN LỖI VÌ ĐÃ NGẮT LỜI, nhưng tôi nghĩ chúng ta nên gặp lúc 9:00 sáng.</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>Sorry for interrupting</span>: <span class='p-mean'>Xin lỗi vì đã ngắt lời.</span></li>
            <li>• <span class='p-word'>I'm sorry</span>: <span class='p-mean'>Tôi xin lỗi (quá chung chung).</span></li>
            <li>• <span class='p-word'>Sorry to interrupting</span>: <span class='p-mean'>Sai ngữ pháp (to + V-ing).</span></li>
            <li>• <span class='p-word'>Excuse me</span>: <span class='p-mean'>Xin lỗi (dùng để hỏi đường/thu hút chú ý).</span></li>
        </ul>
        <b>2. Dịch nghĩa:</b> Như trên.<br>
        <b>3. Tại sao chọn "Sorry for interrupting"?</b><br>
        Người A đang nói dở (có dấu ...) thì B xen ngang. Cấu trúc chuẩn để <span class='p-grammar'>cắt ngang lời ai đó lịch sự</span> là "Sorry for interrupting" (hoặc Sorry to interrupt). -> Chọn <span class='hl-green'>Sorry for interrupting</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        Đáp án C sai vì sau "to" phải là Verb nguyên thể, <span class='hl-red'>không đi với V-ing</span>.
    </div>`},

    // === CLOSEST IN MEANING (19-21) ===
    {sec:"CLOSEST IN MEANING", ex:"Choose the word CLOSEST in meaning to the underlined word.", q:"19. She can do telepathy? <u>You're kidding!</u> It's impossible.", opts:["I don't believe it.","You're a kid.","She can do telepathy.","It doesn't work."], ans:0, expl:`<div class='vi-translation'>Dịch: Cô ấy biết thần giao cách cảm á? BẠN ĐÙA À! Điều đó là không thể nào. (Tìm từ ĐỒNG NGHĨA)</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>I don't believe it.</span>: <span class='p-mean'>Tôi không thể tin được.</span></li>
            <li>• <span class='p-word'>You're a kid.</span>: <span class='p-mean'>Bạn là một đứa trẻ (dịch word-by-word sai nghĩa).</span></li>
            <li>• <span class='p-word'>She can do telepathy.</span>: <span class='p-mean'>Lặp lại câu trước.</span></li>
            <li>• <span class='p-word'>It doesn't work.</span>: <span class='p-mean'>Nó không hoạt động.</span></li>
        </ul>
        <b>2. Dịch nghĩa:</b> Như trên.<br>
        <b>3. Tại sao chọn "I don't believe it."?</b><br>
        Câu cảm thán <span class='p-grammar'>"You're kidding!" (Bạn đang đùa/giỡn mặt tôi hả)</span> dùng để diễn tả sự ngạc nhiên tột độ, hoàn toàn KHÔNG TIN vào những gì mình vừa nghe. Do đó nó đồng nghĩa với "I don't believe it". -> Chọn <span class='hl-green'>I don't believe it.</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        Không truyền tải được <span class='hl-red'>cảm xúc ngạc nhiên, nghi ngờ</span> của người nói.
    </div>`},

    {q:"20. Learning to speak English is not <u>a piece of cake</u>. It requires lots of practice and hard work.", opts:["delicious","easy","fun","hard"], ans:1, expl:`<div class='vi-translation'>Dịch: Học nói Tiếng Anh không phải là DỄ DÀNG. Nó đòi hỏi luyện tập và chăm chỉ. (Tìm từ ĐỒNG NGHĨA)</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>delicious</span> (adj): <span class='p-mean'>ngon miệng</span></li>
            <li>• <span class='p-word'>easy</span> (adj): <span class='p-mean'>dễ dàng</span></li>
            <li>• <span class='p-word'>fun</span> (adj): <span class='p-mean'>vui vẻ</span></li>
            <li>• <span class='p-word'>hard</span> (adj): <span class='p-mean'>khó khăn</span></li>
        </ul>
        <b>2. Dịch nghĩa:</b> Như trên.<br>
        <b>3. Tại sao chọn "easy"?</b><br>
        Thành ngữ <span class='p-grammar'>"a piece of cake" (dễ như ăn bánh)</span> có nghĩa là rất dễ dàng. Từ đồng nghĩa hoàn hảo là "easy". -> Chọn <span class='hl-green'>easy</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        Nhiều bạn nhầm "cake" (bánh) nên chọn "delicious" là <span class='hl-red'>mắc bẫy nghĩa đen của idiom</span>.
    </div>`},

    {q:"21. <u>Hold on!</u> I think this isn't the right road. Let's turn back.", opts:["Continue","Move back","Keep to the right","Wait"], ans:3, expl:`<div class='vi-translation'>Dịch: ĐỢI CHÚT! Mình nghĩ đây không phải đúng đường rồi. Quay lại thôi. (Tìm từ ĐỒNG NGHĨA)</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>Continue</span> (v): <span class='p-mean'>tiếp tục</span></li>
            <li>• <span class='p-word'>Move back</span> (v): <span class='p-mean'>lùi lại</span></li>
            <li>• <span class='p-word'>Keep to the right</span> (v): <span class='p-mean'>đi sát lề phải</span></li>
            <li>• <span class='p-word'>Wait</span> (v): <span class='p-mean'>chờ đợi</span></li>
        </ul>
        <b>2. Dịch nghĩa:</b> Như trên.<br>
        <b>3. Tại sao chọn "Wait"?</b><br>
        Cụm động từ <span class='p-grammar'>"Hold on"</span> mang nghĩa là hãy dừng lại một chút, chờ đợi một chút. Nó tương đương với "Wait". -> Chọn <span class='hl-green'>Wait</span>.<br>
        <b>4. Tại sao các đáp án khác sai?</b><br>
        <span class='hl-red'>Trái ngược hoàn toàn</span> ngữ cảnh (đang nhầm đường nên phải dừng lại suy nghĩ chứ không thể "Continue" tiếp tục đi).
    </div>`},

    // === OPPOSITE IN MEANING (22-24) ===
    {sec:"OPPOSITE IN MEANING", ex:"Choose the word OPPOSITE in meaning to the underlined word.", q:"22. Remember to <u>turn off</u> lights and electronic devices when they are not in use to conserve energy.", opts:["switch on","turn down","go over","go away"], ans:0, expl:`<div class='vi-translation'>Dịch: Hãy nhớ TẮT đèn và thiết bị điện khi không dùng... (Tìm từ TRÁI NGHĨA)</div>
    <div class='expl-details'>
        <b>1. Phân tích 4 đáp án:</b>
        <ul>
            <li>• <span class='p-word'>switch on</span>: <span class='p-mean'>bật lên (= turn on)</span></li>
            <li>• <span class='p-word'>turn down</span>: <span class='p-mean'>vặn nhỏ (âm lượng) / từ chối</span></li>
            <li>• <span class='p-word'>go over</span>: <span class='p-mean'>kiểm tra lại</span></li>
            <li>• <span class='p-word'>go away</span>: <span class='p-mean'>đi xa</span></li>

// XÁO TRỘN ĐÁP ÁN
const QS = JSON.parse(JSON.stringify(rawQS));
QS.forEach(q => {
    let correctText = q.opts[q.ans];
    for (let i = q.opts.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [q.opts[i], q.opts[j]] = [q.opts[j], q.opts[i]];
    }
    q.ans = q.opts.indexOf(correctText);
});

let userAnswers = new Array(QS.length).fill(null);
let isSubmitted = false;

document.addEventListener('DOMContentLoaded', () => {
    renderQuiz();

    document.getElementById('quiz-wrap').addEventListener('click', (e) => {
        const btn = e.target.closest('.opt-btn');
        if (!btn || isSubmitted) return;

        const qIdx = parseInt(btn.getAttribute('data-qidx'));
        const optIdx = parseInt(btn.getAttribute('data-optidx'));
        
        if (userAnswers[qIdx] !== null) return;

        userAnswers[qIdx] = optIdx;
        const cAns = QS[qIdx].ans;
        const card = document.getElementById(`q-${qIdx}`);
        const btns = card.querySelectorAll('.opt-btn');
        
        btns.forEach(b => {
            b.disabled = true;
            b.style.cursor = 'default';
        });

        if(optIdx === cAns) {
            btn.classList.add('correct');
            playDing();
            let rect = btn.getBoundingClientRect();
            fireConfetti(rect.left + rect.width/2, rect.top);
        } else {
            btn.classList.add('wrong');
            btns[cAns].classList.add('correct');
            playBuzz();
        }

        document.getElementById(`expl-${qIdx}`).classList.add('show');
        updateProg();
    });

    document.getElementById('btnOpenSubmit').addEventListener('click', openSubmit);
    document.getElementById('btnDoSubmit').addEventListener('click', doSubmit);
    document.getElementById('btnReload').addEventListener('click', () => location.reload());
    
    document.getElementById('nameInp').addEventListener('input', () => {
        document.getElementById('nameErr').style.display = 'none';
    });
});

function renderQuiz() {
    const container = document.getElementById('quiz-wrap');
    let html = '';
    let currSec = '', currEx = '';

    QS.forEach((q, idx) => {
        if(q.sec && q.sec !== currSec) {
            html += `<div class="sec-title">🎯 ${q.sec}</div><br>`;
            currSec = q.sec;
        }
        if(q.ex && q.ex !== currEx) {
            html += `<div class="ex-title">📖 ${q.ex}</div>`;
            currEx = q.ex;
        }

        html += `
        <div class="q-card" id="q-${idx}">
            <div class="q-text">${q.q}</div>
            <div class="options-grid">
                ${q.opts.map((opt, optIdx) => `
                    <button type="button" class="opt-btn" data-qidx="${idx}" data-optidx="${optIdx}">
                        ${opt}
                    </button>
                `).join('')}
            </div>
            <div class="expl-box" id="expl-${idx}">
                ${q.expl}
            </div>
        </div>`;
    });
    container.innerHTML = html;
    
    document.getElementById('progText').innerText = `Năng lượng: 0 / ${QS.length} ⚡`;
}

function updateProg() {
    const answered = userAnswers.filter(a => a !== null).length;
    document.getElementById('progText').innerText = `Năng lượng: ${answered} / ${QS.length} ⚡`;
    document.getElementById('progFill').style.width = `${(answered / QS.length) * 100}%`;
}

function openSubmit() {
    const answered = userAnswers.filter(a => a !== null).length;
    if(answered < QS.length) {
        if(!confirm(`Úi! Bạn mới làm ${answered}/${QS.length} câu. Bạn có chắc chắn muốn nộp bài sớm không?`)) return;
    }
    document.getElementById('nameModal').classList.add('active');
    document.getElementById('nameInp').focus();
}

function doSubmit() {
    const name = document.getElementById('nameInp').value.trim();
    if(!name) {
        document.getElementById('nameErr').style.display = 'block';
        const box = document.querySelector('#nameModal .modal-content');
        box.style.animation = 'none'; box.offsetHeight; box.style.animation = 'shake 0.4s';
        
        // Tái sử dụng âm thanh sai khi không nhập tên
        wrongAudio.currentTime = 0;
        wrongAudio.play().catch(e => console.log(e));
        return;
    }
    
    document.getElementById('nameModal').classList.remove('active');
    isSubmitted = true;
    
    let score = 0;
    QS.forEach((q, i) => {
        if(userAnswers[i] === q.ans) score++;
        
        const btns = document.getElementById(`q-${i}`).querySelectorAll('.opt-btn');
        btns.forEach(b => { b.disabled = true; b.style.cursor = 'default'; });
        
        if(userAnswers[i] === null) {
            btns[q.ans].classList.add('correct');
            document.getElementById(`expl-${i}`).classList.add('show');
        }
    });
    
    document.getElementById('subArea').style.display = 'none';
    showResult(name, score);
    playDing();
    setTimeout(() => { playDing(); fireConfetti(window.innerWidth/2, window.innerHeight/2); }, 300);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showResult(name, score) {
    const modal = document.getElementById('resModal');
    document.getElementById('resName').innerText = `Tuyệt vời, ${name}! 🌟`;
    document.getElementById('resScore').innerText = `${score} / ${QS.length}`;
    
    const pct = score / QS.length;
    let cmt = "", gif = "";
    if(pct === 1) { 
        cmt = "THIÊN TÀI! XUẤT SẮC TUYỆT ĐỐI! 👑"; 
        gif = "https://media.giphy.com/media/xT0GqssRweIhlz209i/giphy.gif"; 
    }
    else if(pct >= 0.8) { 
        cmt = "Quá giỏi! Gần như hoàn hảo luôn! 🔥"; 
        gif = "https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif"; 
    }
    else if(pct >= 0.6) { 
        cmt = "Khá tốt! Đập tay cái nào! ✋😉"; 
        gif = "https://media.giphy.com/media/3o7TKRwpztlIADD2tO/giphy.gif"; 
    }
    else { 
        cmt = "Hơi tiếc một chút! Hãy đọc kĩ giải thích và làm lại nhé! 💪🥺"; 
        gif = "https://media.giphy.com/media/l41YkxvU8c7J7Bba0/giphy.gif"; 
    }
    
    document.getElementById('resCmt').innerText = cmt;
    document.getElementById('resGif').src = gif;
    modal.classList.add('active');
}
</script>

<script>
// Remove password lock completely - direct quiz access
(function() {
    function unlockNow() {
        // 1. Remove all password modals
        var pwIds = ['passwordModal', 'password-modal', 'pwModal', 'lockModal', 'passModal', 'authModal'];
        pwIds.forEach(function(id) {
            var el = document.getElementById(id);
            if (el) {
                el.style.setProperty('display', 'none', 'important');
                try { el.remove(); } catch(e) {}
            }
        });
        
        // Also remove any elements with class containing password-modal or lock-overlay
        var modalEls = document.querySelectorAll('.password-modal, .lock-modal, .lock-overlay, #lockOverlay');
        modalEls.forEach(function(el) {
            el.style.setProperty('display', 'none', 'important');
            try { el.remove(); } catch(e) {}
        });

        // 2. Display main content containers
        var mainIds = ['mainContent', 'main-content', 'mainHeader', 'main-header', 'quizContainer', 'quiz-container', 'app', 'container'];
        mainIds.forEach(function(id) {
            var el = document.getElementById(id);
            if (el) {
                // If it was hidden, show it
                if (window.getComputedStyle(el).display === 'none' || el.style.display === 'none') {
                    // Try flex if header or mainContent in some themes, else block
                    if (id.toLowerCase().includes('header') || el.classList.contains('app-container')) {
                        el.style.setProperty('display', 'flex', 'important');
                    } else {
                        el.style.setProperty('display', 'block', 'important');
                    }
                }
            }
        });

        // Specific fix for Reading Mastery theme (Tay Mo p2, p7, etc.)
        var tayMoMain = document.getElementById('mainContent');
        if (tayMoMain && tayMoMain.classList.contains('main-container')) {
            tayMoMain.style.setProperty('display', 'flex', 'important');
        }

        // 3. Trigger render / init functions if not yet rendered
        if (typeof renderApp === 'function') { try { renderApp(); } catch(e){} }
        if (typeof renderQuiz === 'function') { try { renderQuiz(); } catch(e){} }
        if (typeof initQuiz === 'function') { try { initQuiz(); } catch(e){} }
        if (typeof startQuiz === 'function') { try { startQuiz(); } catch(e){} }
        if (typeof renderAllQuestions === 'function') { try { renderAllQuestions(); } catch(e){} }
        if (typeof renderAll === 'function') { try { renderAll(); } catch(e){} }
        if (typeof startApp === 'function') { try { startApp(); } catch(e){} }
        if (typeof createUnicorns === 'function') { try { createUnicorns(); } catch(e){} }
        if (typeof initAudio === 'function') { try { initAudio(); } catch(e){} }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', unlockNow);
    } else {
        unlockNow();
    }
    setTimeout(unlockNow, 50);
    setTimeout(unlockNow, 200);
    setTimeout(unlockNow, 600);
})();
</script>
