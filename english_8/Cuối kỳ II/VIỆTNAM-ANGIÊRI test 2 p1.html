<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMPLE TEST 2 – MS Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --ocean: #00C9A7;
  --sand: #FDCB6E;
  --coral: #FF7675;
  --sky: #74B9FF;
  --shell: #FD79A8;
  --sun: #F9CA24;
  --deep: #0984E3;
  --foam: rgba(255,255,255,0.25);
  --glass: rgba(255,255,255,0.18);
  --glass-border: rgba(255,255,255,0.4);
  --correct: #00D26A;
  --wrong: #FF4757;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #00C9A7, #74B9FF, #FD79A8, #FDCB6E, #00C9A7);
  background-size: 400% 400%;
  animation: bgShift 12s ease infinite;
  overflow-x: hidden;
}
@keyframes bgShift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* SVG Beach Pattern Layer */
.beach-pattern {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
.float-item {
  position: absolute;
  animation: floatUp linear infinite;
  opacity: 0.18;
  user-select: none;
}
@keyframes floatUp {
  0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
  10%  { opacity: 0.18; }
  90%  { opacity: 0.18; }
  100% { transform: translateY(-15vh) rotate(360deg); opacity: 0; }
}

/* HEADER */
.header {
  position: relative; z-index: 10;
  text-align: center;
  padding: 14px 20px 10px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(12px);
  border-bottom: 2px solid rgba(255,255,255,0.35);
}
.header h1 {
  font-size: 1.25rem; font-weight: 900;
  color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.25);
  letter-spacing: 1px;
}
.header p {
  font-size: 0.78rem; font-weight: 700;
  color: rgba(255,255,255,0.9);
  margin-top: 2px;
}

/* CONTAINER */
.container {
  position: relative; z-index: 5;
  max-width: 820px;
  margin: 0 auto;
  padding: 22px 16px 100px;
}

/* QUESTION CARD */
.q-card {
  background: rgba(255,255,255,0.22);
  backdrop-filter: blur(16px);
  border: 1.5px solid rgba(255,255,255,0.45);
  border-radius: 22px;
  padding: 24px 22px 20px;
  margin-bottom: 24px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08);
  transition: transform 0.2s;
}
.q-card:hover { transform: translateY(-2px); }

.q-num {
  display: inline-block;
  background: linear-gradient(135deg, #00C9A7, #0984E3);
  color: #fff;
  font-size: 0.75rem; font-weight: 900;
  padding: 3px 12px; border-radius: 20px;
  margin-bottom: 10px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.q-text {
  font-size: 1.15rem; font-weight: 700;
  color: #1a1a2e;
  line-height: 1.6;
  margin-bottom: 16px;
}

/* Phonetics underline */
.q-text u { text-decoration-color: #FF4757; text-decoration-thickness: 2px; }

/* Sign Box */
.sign-box {
  display: flex; gap: 16px; align-items: center;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.sign-visual {
  flex-shrink: 0;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}
/* No Running Sign */
.no-run-sign {
  width: 120px; height: 120px;
  background: #fff;
  border: 3px solid #333;
  border-radius: 14px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 6px;
  font-family: 'Nunito', sans-serif;
}
.no-run-sign .circle-x {
  position: relative; width: 60px; height: 60px; margin-bottom: 4px;
}
.no-run-sign .circle-x svg { width: 60px; height: 60px; }
.no-run-sign .sign-txt {
  font-size: 0.5rem; font-weight: 900;
  color: #1a1a2e; text-align: center; line-height: 1.3;
  text-transform: uppercase; letter-spacing: 0.3px;
}

/* Keep Off Grass Sign */
.grass-sign {
  width: 130px; height: 110px;
  background: #f8fff8;
  border: 4px solid #27ae60;
  border-radius: 12px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 8px 6px 4px;
  position: relative; overflow: hidden;
}
.grass-sign .gs-please {
  font-size: 0.55rem; font-weight: 800;
  color: #27ae60; font-style: italic; margin-bottom: 1px;
}
.grass-sign .gs-main {
  font-size: 0.7rem; font-weight: 900;
  color: #1a1a2e; text-align: center; line-height: 1.2;
  text-transform: uppercase;
}
.grass-icon { font-size: 1.4rem; margin-top: 4px; }

/* ANSWER OPTIONS */
.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media(max-width:520px){ .options-grid { grid-template-columns: 1fr; } }

.opt-btn {
  background: rgba(255,255,255,0.55);
  border: 2px solid rgba(255,255,255,0.7);
  border-radius: 16px;
  padding: 13px 16px;
  font-family: 'Nunito', sans-serif;
  font-size: 1.02rem; font-weight: 700;
  color: #1a1a2e;
  cursor: pointer;
  text-align: left;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1), 0 2px 4px rgba(0,0,0,0.08);
  transition: transform 0.18s, box-shadow 0.18s, background 0.2s;
  position: relative;
  overflow: hidden;
  line-height: 1.4;
}
.opt-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.4), transparent);
  pointer-events: none;
}
.opt-btn:hover:not(:disabled) {
  transform: scale(1.04) translateY(-2px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.15), 0 4px 8px rgba(0,0,0,0.1);
  background: rgba(255,255,255,0.75);
}
.opt-btn.correct {
  background: linear-gradient(135deg, #00D26A, #00b359) !important;
  border-color: #00D26A !important;
  color: #fff !important;
  box-shadow: 0 6px 20px rgba(0,210,106,0.45) !important;
}
.opt-btn.wrong {
  background: linear-gradient(135deg, #FF4757, #e03040) !important;
  border-color: #FF4757 !important;
  color: #fff !important;
  box-shadow: 0 6px 20px rgba(255,71,87,0.45) !important;
  animation: shake 0.5s;
}
.opt-btn:disabled { cursor: default; }

@keyframes shake {
  0%,100%{ transform: translateX(0); }
  20%    { transform: translateX(-8px); }
  40%    { transform: translateX(8px); }
  60%    { transform: translateX(-6px); }
  80%    { transform: translateX(6px); }
}

/* EXPLANATION BOX */
.explain-box {
  display: none;
  margin-top: 16px;
  background: rgba(255,248,220,0.7);
  backdrop-filter: blur(8px);
  border: 1.5px solid rgba(255,200,100,0.5);
  border-radius: 16px;
  padding: 16px 18px;
  font-size: 1rem;
  color: #2d2d2d;
  line-height: 1.75;
  animation: slideDown 0.3s ease;
}
.explain-box.show { display: block; }
@keyframes slideDown {
  from { opacity:0; transform: translateY(-10px); }
  to   { opacity:1; transform: translateY(0); }
}
.explain-box h4 {
  font-size: 1rem; font-weight: 900;
  color: #0984E3; margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.explain-box .viet-line {
  background: rgba(255,140,0,0.15);
  border-left: 4px solid #FDCB6E;
  border-radius: 0 10px 10px 0;
  padding: 8px 12px;
  margin: 8px 0;
  font-weight: 700;
  color: #7d4e00;
  font-size: 1rem;
}
.explain-box .step { margin: 8px 0; }
.explain-box .step-title { font-weight: 900; color: #6c5ce7; font-size: 0.95rem; }

/* Color classes for explanations */
span.p-word     { color: #0984E3; font-weight: 800; }
span.p-phonetic { color: #6c5ce7; background: rgba(108,92,231,0.12); border-radius:4px; padding: 0 4px; font-style: italic; }
span.p-mean     { color: #d35400; font-weight: 700; }
span.p-grammar  { text-decoration: underline; text-decoration-color: #e74c3c; text-decoration-thickness: 2px; font-weight: 700; color: #c0392b; }
span.hl-green   { color: #00b359; font-weight: 900; }
span.hl-red     { color: #c0392b; text-decoration: line-through; font-weight: 700; }
span.pos-tag    { background: rgba(0,201,167,0.18); color: #006b5a; border-radius: 6px; padding: 0 5px; font-size: 0.85rem; font-weight: 800; }

/* SUBMIT BUTTON */
.submit-wrap { text-align: center; padding: 20px 0 10px; }
.submit-btn {
  background: linear-gradient(135deg, #F9CA24, #F0932B);
  color: #fff;
  font-family: 'Nunito', sans-serif;
  font-size: 1.2rem; font-weight: 900;
  border: none; border-radius: 50px;
  padding: 16px 44px;
  cursor: pointer;
  box-shadow: 0 8px 25px rgba(240,147,43,0.45), 0 0 0 4px rgba(249,202,36,0.3);
  transition: transform 0.2s, box-shadow 0.2s;
  letter-spacing: 0.5px;
}
.submit-btn:hover {
  transform: scale(1.06) translateY(-3px);
  box-shadow: 0 14px 35px rgba(240,147,43,0.55), 0 0 0 6px rgba(249,202,36,0.35);
}

/* MODAL OVERLAY */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(6px);
  z-index: 100;
  align-items: center; justify-content: center;
  padding: 16px;
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px);
  border-radius: 28px;
  padding: 36px 32px;
  max-width: 460px; width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  text-align: center;
  animation: popIn 0.35s cubic-bezier(.175,.885,.32,1.275);
}
@keyframes popIn {
  from { transform: scale(0.6); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
.modal-box h2 { font-size: 1.5rem; font-weight: 900; color: #1a1a2e; margin-bottom: 8px; }
.modal-box p  { color: #555; margin-bottom: 20px; font-size: 1rem; }
.name-input {
  width: 100%; padding: 14px 18px;
  font-family: 'Nunito', sans-serif; font-size: 1rem; font-weight: 700;
  border: 2.5px solid #ddd; border-radius: 14px;
  outline: none; transition: border 0.2s;
  margin-bottom: 8px;
}
.name-input:focus { border-color: #00C9A7; }
.name-input.error { border-color: #FF4757; animation: shake 0.4s; }
.err-msg { color: #FF4757; font-size: 0.85rem; font-weight: 700; min-height: 20px; margin-bottom: 12px; }
.confirm-btn {
  background: linear-gradient(135deg, #00C9A7, #0984E3);
  color: #fff; font-family: 'Nunito', sans-serif;
  font-size: 1.05rem; font-weight: 900;
  border: none; border-radius: 14px;
  padding: 14px 36px; cursor: pointer;
  box-shadow: 0 6px 20px rgba(0,201,167,0.4);
  transition: transform 0.2s;
}
.confirm-btn:hover { transform: scale(1.05); }

/* RESULT MODAL */
.result-title { font-size: 1.6rem; font-weight: 900; margin-bottom: 6px; }
.result-score {
  font-size: 3.2rem; font-weight: 900;
  background: linear-gradient(135deg, #00C9A7, #0984E3);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin: 10px 0;
}
.result-gif {
  width: 180px; height: 180px; border-radius: 16px;
  object-fit: cover; margin: 14px auto;
  display: block;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.retry-btn {
  background: linear-gradient(135deg, #FD79A8, #e84393);
  color: #fff; font-family: 'Nunito', sans-serif;
  font-size: 1rem; font-weight: 900;
  border: none; border-radius: 14px;
  padding: 12px 30px; cursor: pointer;
  margin-top: 14px;
  box-shadow: 0 6px 20px rgba(253,121,168,0.4);
  transition: transform 0.2s;
}
.retry-btn:hover { transform: scale(1.05); }

/* CONFETTI CANVAS */
#confetti-canvas {
  position: fixed; inset: 0; pointer-events: none; z-index: 200;
}

/* Progress bar */
.progress-wrap {
  position: sticky; top: 0; z-index: 20;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  padding: 8px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.25);
}
.progress-bar-bg {
  height: 8px; background: rgba(255,255,255,0.3);
  border-radius: 8px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #00C9A7, #0984E3);
  border-radius: 8px;
  transition: width 0.4s ease;
  width: 0%;
}
.progress-txt {
  font-size: 0.78rem; font-weight: 800;
  color: #fff; text-align: right;
  margin-bottom: 4px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.2);
}

/* Section label */
.section-label {
  background: rgba(255,255,255,0.3);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.5);
  border-radius: 14px;
  padding: 10px 18px;
  margin-bottom: 18px;
  font-size: 0.88rem; font-weight: 800;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.2);
  letter-spacing: 0.3px;
}
</style>
</head>
<body>

<!-- Floating beach elements -->
<div class="beach-pattern" id="beachPattern"></div>

<!-- Canvas for confetti -->
<canvas id="confetti-canvas"></canvas>

<!-- HEADER -->
<div class="header">
  <h1>🏖️ SAMPLE TEST 2</h1>
  <p>✏️ Giáo viên tạo: MS Chí Nên – ULIS</p>
</div>

<!-- PROGRESS BAR -->
<div class="progress-wrap">
  <div class="progress-txt" id="progressTxt">0 / 20 câu đã trả lời</div>
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
</div>

<div class="container" id="quizContainer"></div>

<!-- SUBMIT BUTTON -->
<div class="submit-wrap">
  <button class="submit-btn" onclick="openSubmit()">🎯 NỘP BÀI &amp; XEM KẾT QUẢ</button>
</div>

<!-- NAME MODAL -->
<div class="modal-overlay" id="nameModal">
  <div class="modal-box">
    <h2>📝 Nhập tên của bạn</h2>
    <p>Điền tên để nhận kết quả cá nhân hoá nhé!</p>
    <input class="name-input" id="nameInput" placeholder="Ví dụ: Nguyễn Văn A..." maxlength="50" onkeydown="if(event.key==='Enter')confirmName()">
    <div class="err-msg" id="nameErr"></div>
    <button class="confirm-btn" onclick="confirmName()">🚀 Xem kết quả!</button>
  </div>
</div>

<!-- RESULT MODAL -->
<div class="modal-overlay" id="resultModal">
  <div class="modal-box">
    <div class="result-title" id="resultTitle"></div>
    <div id="resultMsg" style="font-size:1.05rem;color:#555;margin-bottom:6px;"></div>
    <div class="result-score" id="resultScore"></div>
    <img class="result-gif" id="resultGif" src="" alt="result gif">
    <div style="font-size:0.95rem;color:#666;margin-top:4px;" id="resultSub"></div>
    <br>
    <button class="retry-btn" onclick="location.reload()">🔄 Làm lại bài</button>
  </div>
</div>

<script>
// ============================================================
//  QUIZ DATA
// ============================================================
const quizData = [
  {
    num: 1,
    section: "Mark the letter A, B, C, or D to indicate the word whose underlined part differs from the others in PRONUNCIATION.",
    question: "Chọn từ có phần được gạch chân phát âm KHÁC với các từ còn lại:",
    display: `<u>i</u>nvent &nbsp;|&nbsp; prom<u>i</u>sing &nbsp;|&nbsp; mach<u>i</u>ne &nbsp;|&nbsp; fingerpr<u>i</u>nt`,
    type: "phonetic",
    options: [
      { text: "<u>i</u>nvent", val: "A" },
      { text: "prom<u>i</u>sing", val: "B" },
      { text: "mach<u>i</u>ne", val: "C" },
      { text: "fingerpr<u>i</u>nt", val: "D" }
    ],
    correct: "C",
    explanation: `
      <div class="step"><span class="step-title">① Phân tích phát âm 4 đáp án (chữ "i" được gạch chân):</span><br>
      • <span class="p-word">invent</span> <span class="pos-tag">v</span> <span class="p-phonetic">/ɪnˈvent/</span> → chữ <b>i</b> đọc là <span class="p-phonetic">/ɪ/</span> – <span class="p-mean">phát minh</span><br>
      • <span class="p-word">promising</span> <span class="pos-tag">adj</span> <span class="p-phonetic">/ˈprɒmɪsɪŋ/</span> → chữ <b>i</b> đọc là <span class="p-phonetic">/ɪ/</span> – <span class="p-mean">đầy hứa hẹn</span><br>
      • <span class="p-word">machine</span> <span class="pos-tag">n</span> <span class="p-phonetic">/məˈʃiːn/</span> → chữ <b>i</b> đọc là <span class="p-phonetic">/iː/</span> – <span class="p-mean">máy móc</span> ← <span class="hl-green">KHÁC!</span><br>
      • <span class="p-word">fingerprint</span> <span class="pos-tag">n</span> <span class="p-phonetic">/ˈfɪŋɡərprɪnt/</span> → chữ <b>i</b> đọc là <span class="p-phonetic">/ɪ/</span> – <span class="p-mean">dấu vân tay</span>
      </div>
      <div class="step"><span class="step-title">② Tại sao C đúng?</span><br>
      Ba từ A, B, D có "i" phát âm là <span class="p-phonetic">/ɪ/</span> (âm ngắn). Riêng <span class="p-word">machine</span> có "i" phát âm là <span class="p-phonetic">/iː/</span> (âm dài) vì đây là từ gốc Pháp – quy tắc đặc biệt!
      </div>
    `
  },
  {
    num: 2,
    section: "Mark the letter A, B, C, or D to indicate the word whose underlined part differs from the others in PRONUNCIATION.",
    question: "Chọn từ có phần được gạch chân phát âm KHÁC với các từ còn lại:",
    display: `<u>a</u>dvanced &nbsp;|&nbsp; pl<u>a</u>tform &nbsp;|&nbsp; sc<u>a</u>nner &nbsp;|&nbsp; tr<u>a</u>nslation`,
    type: "phonetic",
    options: [
      { text: "<u>a</u>dvanced", val: "A" },
      { text: "pl<u>a</u>tform", val: "B" },
      { text: "sc<u>a</u>nner", val: "C" },
      { text: "tr<u>a</u>nslation", val: "D" }
    ],
    correct: "A",
    explanation: `
      <div class="step"><span class="step-title">① Phân tích phát âm 4 đáp án (chữ "a" được gạch chân):</span><br>
      • <span class="p-word">advanced</span> <span class="pos-tag">adj</span> <span class="p-phonetic">/ədˈvɑːnst/</span> → chữ <b>a</b> đọc là <span class="p-phonetic">/ɑː/</span> – <span class="p-mean">tiên tiến, nâng cao</span> ← <span class="hl-green">KHÁC!</span><br>
      • <span class="p-word">platform</span> <span class="pos-tag">n</span> <span class="p-phonetic">/ˈplætfɔːrm/</span> → chữ <b>a</b> đọc là <span class="p-phonetic">/æ/</span> – <span class="p-mean">nền tảng, sân ga</span><br>
      • <span class="p-word">scanner</span> <span class="pos-tag">n</span> <span class="p-phonetic">/ˈskænər/</span> → chữ <b>a</b> đọc là <span class="p-phonetic">/æ/</span> – <span class="p-mean">máy quét</span><br>
      • <span class="p-word">translation</span> <span class="pos-tag">n</span> <span class="p-phonetic">/trænsˈleɪʃn/</span> → chữ <b>a</b> đọc là <span class="p-phonetic">/æ/</span> – <span class="p-mean">bản dịch</span>
      </div>
      <div class="step"><span class="step-title">② Tại sao A đúng?</span><br>
      Ba từ B, C, D có "a" phát âm là <span class="p-phonetic">/æ/</span> (âm "a" ngắn, miệng mở rộng). Riêng <span class="p-word">advanced</span> có "a" phát âm là <span class="p-phonetic">/ɑː/</span> (âm "a" dài, kiểu Anh) vì nằm trong cụm "-ance/-ant/-aft/-ask" theo quy tắc phát âm tiếng Anh Anh.
      </div>
    `
  },
  {
    num: 3,
    section: "Mark the letter A, B, C, or D to indicate the word that differs from the others in the position of PRIMARY STRESS.",
    question: "Chọn từ có trọng âm chính đặt ở vị trí KHÁC với ba từ còn lại:",
    display: "referee &nbsp;|&nbsp; pioneer &nbsp;|&nbsp; Vietnamese &nbsp;|&nbsp; committee",

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

        <div class="grass-sign">
          <div class="gs-please">Please</div>
          <div class="gs-main">KEEP OFF<br>THE GRASS</div>
          <div class="grass-icon">🌿🌱🌿</div>
        </div>
      </div>
    </div>`;
  }

  // Question text
  const qText = `<div class="q-text">${q.question}</div>`;

  // Shuffle options
  const shuffled = shuffleArray(q.options);

  // Options HTML
  const optsHTML = shuffled.map(opt => 
    `<button class="opt-btn" onclick="selectAnswer(${qi},'${opt.val}',this)" data-val="${opt.val}">${opt.text}</button>`
  ).join('');

  const optsGrid = `<div class="options-grid" id="opts-${qi}">${optsHTML}</div>`;

  // Explanation
  const explainHTML = `<div class="explain-box" id="explain-${qi}">
    <h4>💡 PHÂN TÍCH CHI TIẾT:</h4>
    ${q.explanation}
  </div>`;

  card.innerHTML = numBadge + signHTML + qText + optsGrid + explainHTML;
  container.appendChild(card);
});

// ============================================================
//  SELECT ANSWER
// ============================================================
function selectAnswer(qi, val, btn) {
  if (answered[qi]) return;
  answered[qi] = true;

  const q = quizData[qi];
  const optsContainer = document.getElementById(`opts-${qi}`);
  const allBtns = optsContainer.querySelectorAll('.opt-btn');

  allBtns.forEach(b => {
    b.disabled = true;
    if (b.dataset.val === q.correct) {
      b.classList.add('correct');
    }
  });

  if (val === q.correct) {
    btn.classList.add('correct');
    correctCount++;
    playSound('correct');
    launchConfetti();
  } else {
    btn.classList.add('wrong');
    playSound('wrong');
  }

  // Show explanation
  document.getElementById(`explain-${qi}`).classList.add('show');
  updateProgress();
}

// ============================================================
//  PROGRESS
// ============================================================
function updateProgress() {
  const done = answered.filter(Boolean).length;
  const total = quizData.length;
  document.getElementById('progressTxt').textContent = `${done} / ${total} câu đã trả lời`;
  document.getElementById('progressBar').style.width = `${(done/total)*100}%`;
}

// ============================================================
//  WEB AUDIO – sounds
// ============================================================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function getCtx() {
  if (!audioCtx) audioCtx = new AudioCtx();
  return audioCtx;
}

function playSound(type) {
  try {
    const ctx = getCtx();
    if (type === 'correct') {
      const freqs = [523, 659, 784, 1046];
      freqs.forEach((f, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = f;
        osc.type = 'sine';
        const t = ctx.currentTime + i * 0.1;
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        osc.start(t); osc.stop(t + 0.3);
      });
    } else {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
      osc.start(); osc.stop(ctx.currentTime + 0.35);
    }
  } catch(e) {}
}

// ============================================================
//  CONFETTI
// ============================================================
const canvas = document.getElementById('confetti-canvas');
const ctx2d = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

let particles = [];
function launchConfetti() {
  for (let i = 0; i < 80; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: -10,
      r: Math.random() * 8 + 4,
      d: Math.random() * 80 + 20,
      color: `hsl(${Math.random()*360},90%,60%)`,
      vx: (Math.random() - 0.5) * 4,
      vy: Math.random() * 4 + 2,
      angle: Math.random() * 360,
      spin: (Math.random() - 0.5) * 8
    });
  }
  if (particles.length > 80) animateConfetti();
}
function animateConfetti() {
  ctx2d.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter(p => p.y < canvas.height + 20);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.angle += p.spin;
    ctx2d.save();
    ctx2d.translate(p.x, p.y);
    ctx2d.rotate(p.angle * Math.PI / 180);
    ctx2d.fillStyle = p.color;
    ctx2d.fillRect(-p.r/2, -p.r/2, p.r, p.r/1.5);
    ctx2d.restore();
  });
  if (particles.length > 0) requestAnimationFrame(animateConfetti);
  else ctx2d.clearRect(0, 0, canvas.width, canvas.height);
}

function openSubmit() {
  document.getElementById('nameModal').classList.add('active');

}

function confirmName() {
  const name = document.getElementById('nameInput').value.trim();
  const errEl = document.getElementById('nameErr');
  const inp = document.getElementById('nameInput');
  if (!name) {
    inp.classList.add('error');
    errEl.textContent = '⚠️ Vui lòng nhập tên của bạn!';
    setTimeout(() => inp.classList.remove('error'), 600);
    return;
  }
  errEl.textContent = '';
  document.getElementById('nameModal').classList.remove('active');
  showResult(name);
}

// ============================================================
//  RESULT MODAL
// ============================================================
function showResult(name) {
  const total = quizData.length;
  const score = correctCount;
  const pct = score / total;

  let title = '', msg = '', gif = '';
  if (pct === 1) {
    title = `🌟 THIÊN TÀI! ${name} xuất sắc tuyệt đối!`;
    msg = 'Hoàn hảo 100%! Em quá tuyệt vời! 🏆';
    gif = 'https://media.giphy.com/media/xT9IgG50Lg7russbDa/giphy.gif';
  } else if (pct >= 0.6) {
    title = `👏 Xuất sắc! ${name} làm rất tốt!`;
    msg = 'Điểm tốt! Cố gắng lên để đạt 100% nhé! 💪';
    gif = 'https://media.giphy.com/media/3oz8xAFtqoOUUrsh7W/giphy.gif';
  } else {
    title = `💪 Cố lên ${name}! Lần sau sẽ tốt hơn!`;
    msg = 'Ôn lại kiến thức và thử lại nhé! Em làm được! 🌈';
    gif = 'https://media.giphy.com/media/3oEjHULqLCjaB5DQKQ/giphy.gif';
  }

  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultMsg').textContent = msg;
  document.getElementById('resultScore').textContent = `${score} / ${total}`;
  document.getElementById('resultGif').src = gif;
  document.getElementById('resultSub').textContent = `Tỉ lệ đúng: ${Math.round(pct*100)}%`;
  document.getElementById('resultModal').classList.add('active');

  if (pct >= 0.8) { for(let i=0;i<3;i++) setTimeout(launchConfetti, i*500); }
}

<script>/*devclean*/(function(){
var ZW=/[\u00AD\u034F\u061C\u115F\u1160\u17B4\u17B5\u180E\u200B-\u200F\u202A-\u202E\u2060-\u206F\uFEFF]/g,
    SP=/[\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000\t]/g,
    AP=/[\u2018\u2019\u201A\u201B\u2032\u2035\u02B9\u02BB\u02BC\u02BD\u02C8\u0060\u00B4\uFF07]/g,

    DS=/[\u2010\u2011\u2012\u2212\uFE63\uFF0D]/g;
function clean(v){if(!v)return v;var s=String(v);try{s=s.normalize('NFKC')}catch(e){}
  return s.replace(ZW,'').replace(SP,' ').replace(AP,"'").replace(DQ,'"').replace(DS,'-').replace(/[\u0300-\u036f]/g,'').replace(/ {2,}/g,' ');}
window.__devclean=clean;
function fix(skip){var L=document.querySelectorAll('input:not([type]),input[type=text],input[type=search],textarea');
  for(var i=0;i<L.length;i++){var el=L[i];if(el===skip||el.readOnly||el.disabled)continue;var v=el.value,c=clean(v);if(c!==v)el.value=c;}}
['pointerdown','mousedown','touchstart','click','change','focusout'].forEach(function(t){document.addEventListener(t,function(e){fix(t==='focusout'||t==='change'?null:e.target)},true)});
document.addEventListener('keydown',function(e){if(e.key==='Enter'||e.keyCode===13)fix(null)},true);
})();</script>
