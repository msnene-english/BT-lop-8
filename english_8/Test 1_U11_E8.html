// --- RENDER FUNCTION ---

function renderQuiz() {

    const container = document.getElementById('quiz-container');

    let html = '';



    quizData.forEach((item, index) => {

        // Section Header

        if (index === 0 || item.section !== quizData[index-1].section) {

            html += `<div class="section-header">${item.section}</div>`;

        }



        // 1. SIMPLE MC

        if (item.type === 'simple') {

            html += createCard(item);

        }

        

        // 2. CLOZE / READING / INSERTION

        else if (item.type === 'cloze' || item.type === 'reading') {

            // Insertion Special Header

            if (item.section === 'SENTENCE INSERTION') {

                html += `<div class="data-box" style="background:#e9f7ef; border-color:#28a745;">

                    <h4>🔷 Missing Sentences:</h4>

                    ${insertionOptions.map(opt => `<div><b>${opt.id}</b>. ${opt.text}</div>`).join('')}

                </div>`;

            }

            

            // The Context Text

            html += `<div class="data-box">

                <h4>📖 Reading Text</h4>

                ${item.context}

            </div>`;



            // Glossary Table

            if (item.glossary && item.glossary.length > 0) {

                html += `<div class="glossary-box">

                    <span class="glossary-title">📚 VOCABULARY GLOSSARY (B1-C1)</span>

                    <table class="glossary-table">

                        <tr><th>Word</th><th>Meaning</th><th>Level</th></tr>

                        ${item.glossary.map(w => `

                            <tr>

                                <td><b>${w.word}</b></td>

                                <td>${w.mean}</td>

                                <td><span class="cefr-tag ${w.level.toLowerCase()}">${w.level}</span></td>

                            </tr>

                        `).join('')}

                    </table>

                </div><br>`;

            }



            // Questions

            item.questions.forEach(q => {

                // For Insertion questions, use the global options list

                if (item.section === 'SENTENCE INSERTION') {

                    q.options = insertionOptions.map(opt => ({

                        id: opt.id,

                        text: opt.text,

                        mean: opt.id === 'A' ? "Hơn nữa, máy tính luôn đúng" : 

                              opt.id === 'B' ? "Thứ hai, máy tính xử lý nhiều tin..." : 

                              opt.id === 'C' ? "nhưng chúng thường không mắc lỗi" : 

                              "bạn có thể làm việc với máy tính"

                    }));

                }

                html += createCard(q);

            });

        }



        // 3. VISUALS

        else if (item.type === 'visual') {

            let visualHTML = '';

            if (item.visualType === 'sign') {

                visualHTML = `

                <div class="visual-container">

                    <div class="blue-sign">

                        <h3>AVOID<br>CONTAMINATION</h3>

                        <div style="background:white; color:black; padding:10px; border-radius:4px;">

                            <small><b>WASH YOUR HANDS<br>BEFORE EATING,<br>DRINKING<br>OR SMOKING</b></small>

                            <div style="font-size:2rem; margin-top:5px;">👐🚰</div>

                        </div>

                    </div>

                </div>`;

            } else {

                visualHTML = `

                <div class="visual-container">

                    <div class="yellow-note">

                        <p style="margin-top:0;"><strong>Join us for a beach clean-up day!</strong></p>

                        <p>Meet at the main entrance at 8 a.m. Please bring <strong>gloves and a bottle of water</strong>.</p>

                    </div>

                </div>`;

            }

            html += visualHTML + createCard(item);

        }

    });



    container.innerHTML = html;

}



function createCard(q) {

    return `

    <div class="question-card" id="card-${q.id}">

        <div class="q-header">

            <span class="q-num">Question ${q.id}:</span>

            <span>${q.text}</span>

        </div>

        <div class="options-grid">

            ${q.options.map(opt => `

                <label class="option-label">

                    <input type="radio" name="q${q.id}" value="${opt.id}">

                    <span class="option-text"><b>${opt.id}.</b> ${opt.text}</span>

                </label>

            `).join('')}

        </div>

        <button class="btn-check-instant" onclick="checkInstant('${q.id}', '${q.correct}')">Kiểm tra ngay</button>

        <div class="explanation" id="exp-${q.id}">

            <span class="exp-title">Giải thích chi tiết:</span>

            <div style="margin-bottom:10px;">

                ${q.options.map(opt => `

                    <div class="vocab-row">

                        <span class="vocab-word ${opt.id === q.correct ? 'is-correct' : ''}">

                            ${opt.id}. ${opt.text}

                        </span>

                        <span class="vocab-mean">➜ ${opt.mean}</span>

                    </div>

                `).join('')}

            </div>

            <div style="background:white; padding:10px; border-radius:4px; border:1px solid #ddd;">

                <b>💡 Tại sao đúng?</b><br> ${q.detail}

            </div>

        </div>

    </div>`;

}



// --- LOGIC ---



window.checkInstant = function(qId, correct) {

    const card = document.getElementById(`card-${qId}`);

    const selected = document.querySelector(`input[name="q${qId}"]:checked`);

    const exp = document.getElementById(`exp-${qId}`);

    

    exp.style.display = 'block';



    if (selected) {

        if (selected.value === correct) {

            card.style.borderLeftColor = 'var(--success)';

            selected.parentElement.style.background = '#d4edda';

            selected.parentElement.style.borderColor = '#c3e6cb';

        } else {

            card.style.borderLeftColor = 'var(--danger)';

            selected.parentElement.style.background = '#f8d7da';

            selected.parentElement.style.borderColor = '#f5c6cb';

        }

    }

    

    // Highlight Correct Answer

    const correctInput = card.querySelector(`input[value="${correct}"]`);

    if(correctInput) {

        correctInput.parentElement.style.boxShadow = '0 0 0 2px var(--success)';

        correctInput.parentElement.querySelector('b').style.color = 'var(--success)';

    }

};



window.submitAll = function() {

    let score = 0;

    let total = 0;

    

    // Scan all questions

    const inputs = document.querySelectorAll('input[type="radio"]');

    const processedQs = new Set();

    

    inputs.forEach(inp => {

        const qName = inp.name;

        if(processedQs.has(qName)) return;

        processedQs.add(qName);

        total++;

        

        const qId = qName.replace('q', '');

        // Find correct answer from data

        let correct = '';

        quizData.forEach(item => {

            if(item.id == qId) correct = item.correct;

            if(item.questions) {

                const sub = item.questions.find(s => s.id == qId);

                if(sub) correct = sub.correct;

            }

        });

        

        checkInstant(qId, correct);

        

        const selected = document.querySelector(`input[name="${qName}"]:checked`);

        if(selected && selected.value === correct) score++;

    });



    const scoreText = document.getElementById('score-text');

    scoreText.innerHTML = `Kết quả: <span style="color:${score/total >= 0.5 ? 'green':'red'}">${score}/${total}</span>`;

    

    alert(`Bạn đã hoàn thành bài thi!\nĐiểm số: ${score}/${total}`);

    window.scrollTo({ top: 0, behavior: 'smooth' });

}



// Init

renderQuiz();



</script>


<script>
// Remove password lock completely - direct quiz access
(function() {
    function unlockNow() {
        var pwIds = [
            'passwordModal', 'password-modal', 'pwModal', 'pw-modal', 'pw-overlay', 
            'lockModal', 'passModal', 'authModal', 'auth-modal', 'nameModal', 'name-modal', 'nameInputModal'
        ];
        pwIds.forEach(function(id) {
            var el = document.getElementById(id);
            if (el) {
                el.style.setProperty('display', 'none', 'important');
                try { el.remove(); } catch(e) {}
            }
        });

        var modalEls = document.querySelectorAll('.password-modal, .lock-modal, .lock-overlay, #lockOverlay, #auth-modal, .modal-overlay');
        modalEls.forEach(function(el) {
            // Keep result modals if any, but hide overlays that block quiz
            if (el.id !== 'resultModal' && el.id !== 'result-modal' && el.id !== 'scoreModal') {
                el.style.setProperty('display', 'none', 'important');
                try { el.remove(); } catch(e) {}
            }
        });

        var mainIds = [
            'mainContent', 'main-content', 'mainHeader', 'main-header', 
            'app-container', 'app', 'quiz-wrapper', 'quizContainer', 'quiz-container', 'reading-content'
        ];
        mainIds.forEach(function(id) {
            var el = document.getElementById(id);
            if (el) {
                if (id === 'main-content' || id.toLowerCase().includes('header') || el.classList.contains('main-container')) {
                    el.style.setProperty('display', 'flex', 'important');
                } else {
                    el.style.setProperty('display', 'block', 'important');
                }
            }
        });

        if (typeof buildQuiz === 'function') { try { buildQuiz(); } catch(e){} }
        if (typeof initQuiz === 'function') { try { initQuiz(); } catch(e){} }
        if (typeof renderApp === 'function') { try { renderApp(); } catch(e){} }
        if (typeof renderQuiz === 'function') { try { renderQuiz(); } catch(e){} }
        if (typeof startQuiz === 'function') { try { startQuiz(); } catch(e){} }
        if (typeof renderAllQuestions === 'function') { try { renderAllQuestions(); } catch(e){} }
        if (typeof renderAll === 'function') { try { renderAll(); } catch(e){} }
        if (typeof startApp === 'function') { try { startApp(); } catch(e){} }
        if (typeof buildStarfield === 'function') { try { buildStarfield(); } catch(e){} }
        if (typeof spawnFloats === 'function') { try { spawnFloats(); } catch(e){} }
        if (typeof spawnFloaters === 'function') { try { spawnFloaters(); } catch(e){} }
        if (typeof createFloatingBubbles === 'function') { try { createFloatingBubbles(); } catch(e){} }
        if (typeof initAudio === 'function') { try { initAudio(); } catch(e){} }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', unlockNow);
    } else {
        unlockNow();
    }
    setTimeout(unlockNow, 50);
    setTimeout(unlockNow, 200);
    setTimeout(unlockNow, 600);
})();
</script>
