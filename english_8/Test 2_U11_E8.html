        .explanation-box.show { display: block; animation: fadeIn 0.5s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }



        .exp-tag {

        /* GLOSSARY TABLE */

<script>

    const quizData = [

        // PHONETICS

        {

            id: 1,

            type: "phonetics",

            section: "Pronunciation: Mark the letter A, B, C or D to indicate the word whose underlined part differs from the other three.",

            question: "Question 1:",

            options: [

                { id: "A", text: "dr<u>a</u>ma" },

                { id: "B", text: "m<u>a</u>mmal" },

                { id: "C", text: "d<u>a</u>mage" },

                { id: "D", text: "gr<u>a</u>mmar" }

            ],

            correct: "A",

            explanation: `

                <span class="exp-translate">Chọn từ có phần gạch chân phát âm khác.</span><br>

                A. drama /ˈdrɑː.mə/ (âm /ɑː/ - a dài)<br>

                B. mammal /ˈmæm.əl/ (âm /æ/ - a bẹt)<br>

                C. damage /ˈdæm.ɪdʒ/ (âm /æ/)<br>

                D. grammar /ˈɡræm.ər/ (âm /æ/)<br>

                ➔ <strong>Đáp án A</strong> là /ɑː/, còn lại là /æ/.

            `

        },

        {

            id: 2,

            type: "phonetics",

            question: "Question 2:",

            options: [

                { id: "A", text: "coll<u>ege</u>" },

                { id: "B", text: "privil<u>ege</u>" },

                { id: "C", text: "coll<u>age</u>" },

                { id: "D", text: "mess<u>age</u>" }

            ],

            correct: "C",

            explanation: `

                <span class="exp-translate">Chọn từ có phần gạch chân phát âm khác.</span><br>

                A. college /ˈkɒl.ɪdʒ/ (âm /ɪdʒ/)<br>

                B. privilege /ˈprɪv.əl.ɪdʒ/ (âm /ɪdʒ/)<br>

                C. collage /kɒˈlɑːʒ/ (âm /ɑːʒ/) - tranh cắt dán<br>

                D. message /ˈmes.ɪdʒ/ (âm /ɪdʒ/)<br>

                ➔ <strong>Đáp án C</strong> phát âm là /ɑːʒ/, các từ còn lại đuôi -age phát âm là /ɪdʒ/.

            `

        },

        // STRESS

        {

            id: 3,

            type: "stress",

            section: "Stress: Mark the letter A, B, C or D to indicate the word that differs from the other three in the position of primary stress.",

            question: "Question 3:",

            options: [

                { id: "A", text: "comment" },

                { id: "B", text: "online" },

                { id: "C", text: "discuss" },

                { id: "D", text: "breakout" }

            ],

            correct: "C",

            explanation: `

                <span class="exp-translate">Chọn từ có trọng âm khác.</span><br>

                A. comment /ˈkɒm.ent/ (trọng âm 1)<br>

                B. online /ˈɒn.laɪn/ (trọng âm 1 - danh từ/tính từ thường nhấn 1, dù động từ có thể nhấn 2 nhưng ở đây xét theo nhóm)<br>

                C. discuss /dɪˈskʌs/ (trọng âm 2)<br>

                D. breakout /ˈbreɪk.aʊt/ (trọng âm 1 - danh từ)<br>

                ➔ <strong>Đáp án C</strong> trọng âm 2, còn lại trọng âm 1.

            `

        },

        {

            id: 4,

            type: "stress",

            question: "Question 4:",

            options: [

                { id: "A", text: "development" },

                { id: "B", text: "information" },

                { id: "C", text: "understanding" },

                { id: "D", text: "biometric" }

            ],

            correct: "A",

            explanation: `

                <span class="exp-translate">Chọn từ có trọng âm khác.</span><br>

                A. development /dɪˈvel.əp.mənt/ (trọng âm 2)<br>

                B. information /ˌɪn.fəˈmeɪ.ʃən/ (trọng âm 3)<br>

                C. understanding /ˌʌn.dəˈstæn.dɪŋ/ (trọng âm 3)<br>

                D. biometric /ˌbaɪ.əʊˈmet.rɪk/ (trọng âm 3)<br>

                ➔ <strong>Đáp án A</strong> trọng âm 2, còn lại trọng âm 3.

            `

        },

        // GRAMMAR & VOCAB

        {

            id: 5,

            type: "multiple_choice",

            section: "Grammar & Vocabulary: Mark the letter A, B, C or D to indicate the correct answer.",

            question: "Question 5: People said that the internet ______ about a revolution in the way people communicated with each other.",

            options: [

                { id: "A", text: "bring" },

                { id: "B", text: "have brought" },

                { id: "C", text: "brought" },

                { id: "D", text: "had brought" }

            ],

            correct: "D",

            explanation: `

                <span class="exp-translate">Mọi người nói rằng internet đã mang lại một cuộc cách mạng trong cách mọi người giao tiếp với nhau.</span><br>

                <strong>Giải thích:</strong><br>

                - Động từ tường thuật "said" ở quá khứ.<br>

                - Hành động "mang lại cuộc cách mạng" xảy ra trước khi "nói" -> Dùng <strong>Past Perfect (Quá khứ hoàn thành)</strong>.<br>

                - Cấu trúc: S + said + (that) + S + had V3/ed.<br>

                ➔ <strong>Đáp án D</strong> (had brought).

            `

        },

        {

            id: 6,

            type: "multiple_choice",

            question: "Question 6: Nam said that he ________ her since they ______ school.",

            options: [

                { id: "A", text: "Hasn’t met – left" },

                { id: "B", text: "hadn’t met – left" },

                { id: "C", text: "hadn’t met – had left" },

                { id: "D", text: "hadn't met – had left" }

            ],

            correct: "B",

            explanation: `

                <span class="exp-translate">Nam nói rằng cậu ấy đã không gặp cô ấy kể từ khi họ ra trường.</span><br>

                <strong>Giải thích:</strong><br>

                - Câu gián tiếp với "since".<br>

                - Câu trực tiếp: "I haven't met (Present Perfect) her since we left (Past Simple) school".<br>

                - Chuyển sang gián tiếp: Lùi thì.<br>

                + Present Perfect -> Past Perfect (hadn't met).<br>

                + Past Simple trong mệnh đề 'since' giữ nguyên hoặc lùi về Past Perfect (nhưng thường giữ nguyên 'left' để mốc thời gian rõ ràng). Tuy nhiên, đáp án chuẩn nhất trong ngữ cảnh này là mệnh đề chính lùi, mệnh đề since giữ Past Simple.<br>

                ➔ <strong>Đáp án B</strong> (hadn’t met – left).

            `

        },

        {

            id: 7,

            type: "multiple_choice",

            question: "Question 7: The object of their expedition was to ___ the source of the River Nile.",

            options: [

                { id: "A", text: "produce" },

                { id: "B", text: "invent" },

                { id: "C", text: "discover" },

                { id: "D", text: "develop" }

            ],

            correct: "C",

            explanation: `

                <span class="exp-translate">Mục tiêu của cuộc thám hiểm là khám phá ra nguồn của sông Nile.</span><br>

                <strong>Từ vựng:</strong><br>

                - <span class="exp-tag tag-verb">Verb</span> Produce: sản xuất.<br>

                - <span class="exp-tag tag-verb">Verb</span> Invent: phát minh (tạo ra cái chưa từng có).<br>

                - <span class="exp-tag tag-verb">Verb</span> Discover: khám phá (tìm ra cái đã tồn tại nhưng chưa ai biết).<br>

                - <span class="exp-tag tag-verb">Verb</span> Develop: phát triển.<br>

                ➔ Nguồn sông Nile đã có sẵn, họ chỉ tìm ra nó -> Chọn <strong>Discover</strong> (Đáp án C).

            `

        },

        {

            id: 8,

            type: "multiple_choice",

            question: "Question 8: ______ products are chemical compounds or substances produced by living organisms.",

            options: [

                { id: "A", text: "Artificial" },

                { id: "B", text: "Natural" },

                { id: "C", text: "Homemade" },

                { id: "D", text: "Manmade" }

            ],

            correct: "B",

            explanation: `

                <span class="exp-translate">Các sản phẩm tự nhiên là các hợp chất hóa học hoặc chất được tạo ra bởi các sinh vật sống.</span><br>

                <strong>Từ vựng:</strong><br>

                - <span class="exp-tag tag-adj">Adj</span> Artificial: nhân tạo.<br>

                - <span class="exp-tag tag-adj">Adj</span> Natural: tự nhiên (thuộc về thiên nhiên/sinh vật sống).<br>

                - <span class="exp-tag tag-adj">Adj</span> Homemade: nhà làm.<br>

                - <span class="exp-tag tag-adj">Adj</span> Manmade: do con người làm ra.<br>

                ➔ Định nghĩa "produced by living organisms" (sinh vật sống) tương ứng với <strong>Natural</strong> (Đáp án B).

            `

        },

        {

            id: 9,

            type: "multiple_choice",

            question: "Question 9: She said that she was going to study abroad ______.",

            options: [

                { id: "A", text: "the following year" },

                { id: "B", text: "next year" },

                { id: "C", text: "the previous year" },

                { id: "D", text: "last year" }

            ],

            correct: "A",

            explanation: `

                <span class="exp-translate">Cô ấy nói rằng cô ấy sẽ đi du học vào năm sau.</span><br>

                <strong>Giải thích:</strong><br>

                - Câu gián tiếp (She said...).<br>

                - Trạng từ thời gian "next year" trong câu trực tiếp phải đổi thành "the following year" hoặc "the next year".<br>

                - "Last year" -> "the previous year".<br>

                ➔ <strong>Đáp án A</strong>.

            `

        },

        {

            id: 10,

            type: "multiple_choice",

            question: "Question 10: Although the students learn online, they receive both _____ and physical support from their teachers and schools.",

            options: [

                { id: "A", text: "spiritual" },

                { id: "B", text: "virtual" },

                { id: "C", text: "material" },

                { id: "D", text: "offline" }

            ],

            correct: "A",

            explanation: `

                <span class="exp-translate">Dù học sinh học trực tuyến, các em vẫn nhận được sự hỗ trợ cả về tinh thần và thể chất từ giáo viên.</span><br>

                <strong>Từ vựng:</strong><br>

                - <span class="exp-tag tag-adj">Adj</span> Spiritual: thuộc về tinh thần.<br>

                - <span class="exp-tag tag-adj">Adj</span> Virtual: ảo.<br>

                - <span class="exp-tag tag-adj">Adj</span> Material: vật chất.<br>

                - <span class="exp-tag tag-adj">Adj</span> Offline: ngoại tuyến.<br>

                ➔ Cụm từ "both spiritual and physical" (cả tinh thần và thể chất) là cặp từ thường đi đôi.<br>

                ➔ <strong>Đáp án A</strong>.

            `

        },

        {

            id: 11,

            type: "multiple_choice",

            question: "Question 11: Sue wants to go to the supermarket to buy some _____ bulbs.",

            options: [

                { id: "A", text: "precise" },

                { id: "B", text: "field" },

                { id: "C", text: "light" },

                { id: "D", text: "steam" }

            ],

            correct: "C",

            explanation: `

                <span class="exp-translate">Sue muốn đi siêu thị để mua vài cái bóng đèn.</span><br>

                <strong>Collocation (Cụm từ cố định):</strong><br>

                - Light bulb: bóng đèn.<br>

                - Precise: chính xác.<br>

                - Field: cánh đồng/lĩnh vực.<br>

                - Steam: hơi nước.<br>

                ➔ <strong>Đáp án C</strong>.

            `

        },

        {

            id: 12,

            type: "multiple_choice",

            question: "Question 12: Teacher: “How often do you use electronic devices for learning?”<br>Tom: “_____”",

            options: [

                { id: "A", text: "You’re welcome" },

                { id: "B", text: "Not really" },

                { id: "C", text: "Very often" },

                { id: "D", text: "Thank you" }

            ],

            correct: "C",

            explanation: `

                <span class="exp-translate">Giáo viên: "Em có thường xuyên sử dụng thiết bị điện tử để học không?" - Tom: "Rất thường xuyên ạ."</span><br>

                <strong>Giải thích giao tiếp:</strong><br>

                - Câu hỏi "How often" hỏi về tần suất.<br>

                - A. Không có chi (Đáp lại lời cảm ơn).<br>

                - B. Không hẳn (Trả lời cho câu hỏi Yes/No hoặc quan điểm).<br>

                - C. Rất thường xuyên (Trả lời tần suất).<br>

                - D. Cảm ơn.<br>

                ➔ <strong>Đáp án C</strong>.

            `

        },

        // READING 1: PARK RULES

        {

    const quizContent = document.getElementById('quiz-content');



    function renderQuiz() {

        quizData.forEach(item => {

            // Render Section Title if exists

            if (item.section) {

                const sectionTitle = document.createElement('div');

                sectionTitle.className = 'section-title';

                sectionTitle.innerText = item.section;

                quizContent.appendChild(sectionTitle);

            }



            // Render Reading Content / Gap Fill Options Box

            if (item.type === 'reading_group' || item.type === 'gap_fill_group') {

                const dataBox = document.createElement('div');

                dataBox.className = 'data-box';

                

                if (item.type === 'gap_fill_group') {

                    let optionsHtml = '<div class="gap-options-box">OPTIONS:<br>';

                    item.optionsList.forEach(opt => optionsHtml += `<div>${opt}</div>`);

                    optionsHtml += '</div><br>';

                    dataBox.innerHTML = optionsHtml + item.content;

                } else {

                    dataBox.innerHTML = item.content;

                }

                

                quizContent.appendChild(dataBox);



                // Render sub-questions

                item.questions.forEach(q => renderQuestionCard(q));

            } else {

                // Render Single Question

                if (item.dataBox) { // For sentence arrangement

                    const db = document.createElement('div');

                    db.className = 'data-box';

                    db.innerHTML = item.dataBox;

                    quizContent.appendChild(db);

                }

                renderQuestionCard(item);

            }

        });

    }



    function renderQuestionCard(q) {

        const card = document.createElement('div');

        card.className = 'question-card';

        card.id = `card-${q.id}`;



        let html = `

            <div class="q-text">

                <span class="q-number">${q.question}</span>

                ${q.type !== 'phonetics' && q.type !== 'stress' && !q.question.includes('Question') ? '' : ''}

            </div>

        `;



        if (q.customContent) {

            html += q.customContent;

        }



        html += `<div class="options-grid">`;

        

        q.options.forEach(opt => {

            html += `

                <label class="option-label" id="opt-${q.id}-${opt.id}">

                    <input type="radio" name="q${q.id}" value="${opt.id}" onchange="selectOption(${q.id}, '${opt.id}')">

                    <span><strong>${opt.id}.</strong> ${opt.text}</span>

                </label>

            `;

        });



        html += `</div>`;

        

        // Check Button

        html += `<button type="button" class="check-btn" onclick="checkSingleQuestion(${q.id})">💡 Kiểm tra & Xem giải thích</button>`;



        // Explanation Box

        html += `

            <div class="explanation-box" id="exp-${q.id}">

                <strong>Đáp án đúng: <span style="color:var(--success)">${q.correct}</span></strong>

                <div class="exp-detail">${q.explanation}</div>

            </div>

        `;



        card.innerHTML = html;

        quizContent.appendChild(card);

    }



    function selectOption(qId, optId) {

        // Just UI update if needed, currently native radio behavior is fine

        // Can remove "unanswered" style if previously set

        const card = document.getElementById(`card-${qId}`);

        if(card.classList.contains('unanswered')) {

            card.classList.remove('unanswered');

        }

    }



    function checkSingleQuestion(qId) {

        // Find the question data (search in flat or groups)

        let questionData = null;

        for (let item of quizData) {

            if (item.id === qId) {

                questionData = item;

                break;

            }

            if (item.questions) {

                const found = item.questions.find(q => q.id === qId);

                if (found) {

                    questionData = found;

                    break;

                }

            }

        }



        if (!questionData) return;



        const selected = document.querySelector(`input[name="q${qId}"]:checked`);

        const expBox = document.getElementById(`exp-${qId}`);

        const card = document.getElementById(`card-${qId}`);

        

        // Show explanation

        expBox.classList.add('show');

        

        // Reset styles

        const labels = card.querySelectorAll('.option-label');

        labels.forEach(l => l.classList.remove('correct-answer', 'wrong-selection'));



        // Highlight correct answer

        const correctLabel = document.getElementById(`opt-${qId}-${questionData.correct}`);

        if(correctLabel) correctLabel.classList.add('correct-answer');



        if (selected) {

            if (selected.value === questionData.correct) {

                card.classList.add('correct');

                card.classList.remove('wrong');

            } else {

                card.classList.add('wrong');

                card.classList.remove('correct');

                const wrongLabel = document.getElementById(`opt-${qId}-${selected.value}`);

                if(wrongLabel) wrongLabel.classList.add('wrong-selection');

            }

        } else {

            // Not answered but asked to check

            card.classList.add('unanswered');

        }

    }



    function submitQuiz() {

        let score = 0;

        let total = 40;

        let unanswered = 0;



        // Loop through all 40 questions

        for (let i = 1; i <= 40; i++) {

            checkSingleQuestion(i); // Reuse check logic to show results

            

            // Calculate Score

            // Need to find correct answer again

            let correctAns = "";

            for (let item of quizData) {

                if (item.id === i) correctAns = item.correct;

                if (item.questions) {

                    const f = item.questions.find(q => q.id === i);

                    if(f) correctAns = f.correct;

                }

            }



            const selected = document.querySelector(`input[name="q${i}"]:checked`);

            if (selected) {

                if (selected.value === correctAns) score++;

            } else {

                unanswered++;

            }

        }



        const scoreDisplay = document.getElementById('scoreDisplay');

        scoreDisplay.style.display = 'block';

        scoreDisplay.innerText = `Kết quả: ${score}/${total}`;



        if (unanswered > 0) {

            alert(`Bạn đã nộp bài! \nĐiểm số: ${score}/${total}\nCó ${unanswered} câu chưa làm (Màu vàng).`);

        } else {

            alert(`Chúc mừng bạn đã hoàn thành!\nĐiểm số: ${score}/${total}`);

        }

        

        // Scroll to top

        window.scrollTo({ top: 0, behavior: 'smooth' });

    }



    // Initialize

    renderQuiz();



</script>
