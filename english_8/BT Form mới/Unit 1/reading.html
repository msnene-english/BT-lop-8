<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài Test Tiếng Anh - Gamification</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ================= CSS VARIABLES & RESET ================= */
:root {
  --primary: #833ab4;
  --secondary: #fd1d1d;
  --tertiary: #fcb045;
  --glass-bg: rgba(255, 255, 255, 0.45);
  --glass-border: rgba(255, 255, 255, 0.7);
  --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
  --correct: #27ae60;
  --correct-bg: rgba(39, 174, 96, 0.25);
  --wrong: #c0392b;
  --wrong-bg: rgba(192, 57, 43, 0.2);
  --text-dark: #2c3e50;
  --text-light: #576574;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }

body {
  min-height: 100vh;
  overflow: hidden; /* Dùng split-screen cuộn riêng */
  background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
  background-size: 400% 400%;
  animation: gradientBG 15s ease infinite;
  color: var(--text-dark);
}
@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ================= BACKGROUND PATTERN ================= */
.bg-pattern {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg width='250' height='250' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='20' y='50' font-size='30' opacity='0.2'%3E📚%3C/text%3E%3Ctext x='150' y='120' font-size='40' opacity='0.15'%3E🏫%3C/text%3E%3Ctext x='60' y='200' font-size='35' opacity='0.15'%3E🏃‍♂️%3C/text%3E%3Ctext x='200' y='220' font-size='25' opacity='0.2'%3E✨%3C/text%3E%3C/svg%3E");
  mask-image: radial-gradient(ellipse at center, white 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, white 30%, transparent 80%);
}

/* ================= FLOATING ITEMS ================= */
.floating-item {
  position: fixed;
  z-index: -1;
  pointer-events: none;
  animation: floatUp linear infinite;
  opacity: 0.6;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
}
@keyframes floatUp {
  0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.8; }
  90% { opacity: 0.8; }
  100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
}

/* ================= HEADER ================= */
.header-bar {
  position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 100;
  background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px);
  padding: 8px 24px; border-radius: 30px; border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow); font-weight: 800; font-size: 0.95rem; color: #6c5ce7;
  display: flex; gap: 15px; align-items: center;
}
.score-tracker { background: #6c5ce7; color: white; padding: 4px 12px; border-radius: 20px; font-weight: 900; }

/* ================= SPLIT SCREEN LAYOUT ================= */
.split-layout {
  display: flex; height: 100vh; padding: 75px 20px 20px; gap: 20px;
}
.pane {
  flex: 1; overflow-y: auto; padding: 30px; border-radius: 24px;
  background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
  scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.2) transparent;
}
.pane::-webkit-scrollbar { width: 8px; }
.pane::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }

/* ================= READING COMPONENT ================= */
.ex-title { font-size: 1.6rem; font-weight: 900; color: #2d3436; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 2px dashed rgba(0,0,0,0.1); padding-bottom: 10px; }
.paragraph-box { margin-bottom: 25px; }
.en-text { font-size: 1.15rem; line-height: 1.8; color: #1e272e; font-weight: 600; text-align: justify; margin-bottom: 12px; }
.btn-trans {
  background: linear-gradient(135deg, #00b894, #55efc4); color: white; border: none;
  padding: 8px 18px; border-radius: 12px; font-weight: 800; font-size: 0.9rem; cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
}
.btn-trans:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 184, 148, 0.4); }
.vi-text {
  display: none; background: rgba(255,255,255,0.7); padding: 15px; border-left: 5px solid #00b894;
  border-radius: 0 12px 12px 0; margin-top: 10px; font-size: 1.05rem; font-style: italic; color: #2d3436; line-height: 1.7;
}

/* ================= GLOSSARY TABLE ================= */
.glossary-title { font-size: 1.2rem; font-weight: 900; color: #d63031; margin: 30px 0 15px; }
.glass-table { width: 100%; border-collapse: collapse; border-radius: 12px; overflow: hidden; background: rgba(255,255,255,0.5); }
.glass-table th { background: linear-gradient(135deg, #ff7675, #d63031); color: white; padding: 12px; text-align: left; }
.glass-table td { padding: 12px; border-bottom: 1px solid rgba(0,0,0,0.05); font-weight: 700; color: #2d3436; }
.glass-table tr:last-child td { border-bottom: none; }
.glass-table tr:nth-child(even) { background: rgba(255,255,255,0.3); }

/* ================= EXERCISE COMPONENT ================= */
.q-card {
  background: rgba(255,255,255,0.8); border-radius: 18px; padding: 25px; margin-bottom: 25px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.05); border: 2px solid rgba(255,255,255,1);
}
.q-text { font-size: 1.2rem; font-weight: 800; color: #2c3e50; margin-bottom: 18px; line-height: 1.6; }
.opts-grid { display: flex; flex-direction: column; gap: 12px; }
.opt-btn {
  background: white; border: 2px solid #dfe6e9; border-radius: 14px; padding: 16px 20px;
  font-size: 1.05rem; font-weight: 700; color: #2d3436; text-align: left; cursor: pointer;
  transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; gap: 10px;
}
.opt-btn:hover:not(:disabled) { border-color: #74b9ff; transform: scale(1.02); box-shadow: 0 8px 25px rgba(116, 185, 255, 0.2); }
.opt-btn:disabled { cursor: not-allowed; }

/* TRẠNG THÁI ĐÚNG / SAI */
.opt-btn.correct { background: var(--correct-bg); border-color: var(--correct); color: #145A32; }
.opt-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong); color: #7B241C; animation: shake 0.4s; }
.opt-btn.reveal-correct { border: 3px dashed var(--correct); background: rgba(39, 174, 96, 0.1); }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* ================= EXPLANATION (MASTER LEVEL) ================= */
.explanation {
  display: none; margin-top: 20px; padding: 20px; background: #fdfbfb;
  border-radius: 16px; border-left: 6px solid #6c5ce7; font-size: 1.05rem; line-height: 1.7;
  animation: slideDown 0.4s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
}
@keyframes slideDown { from{opacity:0; transform:translateY(-10px)} to{opacity:1; transform:translateY(0)} }
.explanation.show { display: block; }
.exp-title { font-weight: 900; font-size: 1.2rem; color: #6c5ce7; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
.exp-list { list-style: none; margin-bottom: 15px; }
.exp-list li { margin-bottom: 8px; padding: 8px; background: rgba(0,0,0,0.02); border-radius: 8px; }

/* STRICT SPAN CLASSES */
.p-word { color: #0984e3; font-weight: 900; background: rgba(9, 132, 227, 0.1); padding: 2px 6px; border-radius: 6px; }
.p-mean { color: #d35400; font-weight: 900; }
.p-grammar { text-decoration: underline; text-decoration-color: #e84393; text-decoration-thickness: 3px; font-weight: 900; color: #e84393; }
.hl-green { color: #27ae60; font-weight: 900; }
.hl-red { color: #c0392b; text-decoration: line-through; font-weight: 900; }
.quote-box { background: #fff9c4; padding: 15px; border-radius: 12px; border-left: 5px solid #f1c40f; font-size: 1rem; color: #2d3436; }

/* ================= SUBMIT & MODALS ================= */
.submit-wrap { text-align: center; margin: 40px 0; }
.btn-submit {
  background: linear-gradient(135deg, #a29bfe, #6c5ce7); color: white; border: none;
  padding: 20px 50px; border-radius: 50px; font-size: 1.3rem; font-weight: 900; cursor: pointer;
  box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4); transition: transform 0.3s;
}
.btn-submit:hover { transform: scale(1.05) translateY(-5px); }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center; z-index: 1000;
}
.modal-box {
  background: rgba(255,255,255,0.95); border-radius: 28px; padding: 40px 30px;
  width: 90%; max-width: 480px; text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.4);
  animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn { from {transform: scale(0.7); opacity:0;} to {transform: scale(1); opacity:1;} }
.name-input {
  width: 100%; padding: 16px; border: 3px solid #dfe6e9; border-radius: 16px; font-size: 1.2rem;
  font-weight: 800; text-align: center; margin: 20px 0; outline: none; color: #2d3436;
}
.name-input:focus { border-color: #6c5ce7; }
.btn-action { background: linear-gradient(135deg, #0984e3, #74b9ff); color: white; border: none; padding: 16px 40px; border-radius: 50px; font-size: 1.2rem; font-weight: 900; cursor: pointer; transition: transform 0.2s; }
.btn-action:hover { transform: scale(1.05); }

.score-display { font-size: 4rem; font-weight: 900; background: linear-gradient(135deg, #6c5ce7, #a29bfe); -webkit-background-clip: text; color: transparent; margin: 10px 0; }
.score-10 { font-size: 1.6rem; color: #e84393; font-weight: 900; margin-bottom: 20px; }
.meme-img { width: 100%; height: 220px; object-fit: cover; border-radius: 16px; margin-bottom: 20px; border: 3px solid #dfe6e9; }
.feedback-text { font-size: 1.15rem; font-weight: 800; color: #2d3436; line-height: 1.6; }

/* ================= CONFETTI ================= */
.confetti { position: fixed; z-index: 9999; pointer-events: none; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(1080deg); opacity: 0; } }

/* ================= RESPONSIVE ================= */
@media(max-width: 900px) {
  .split-layout { flex-direction: column; overflow-y: auto; height: auto; }
  body { overflow: auto; }
  .pane { overflow-y: visible; }
}
</style>
</head>
<body>

<div class="bg-pattern"></div>

<div class="header-bar">
  <span>👩‍🏫 Giáo viên tạo: MS Chí Nên</span>
  <span class="score-tracker">Tiến độ: <span id="progressText">0 / 24</span></span>
</div>

<div class="split-layout">
  <!-- BÊN TRÁI: READING PASSAGES -->
  <div class="pane left-pane" id="readingPane">
    <!-- Nội dung bài đọc sẽ được render bằng JS -->
  </div>

  <!-- BÊN PHẢI: EXERCISES -->
  <div class="pane right-pane" id="exercisePane">
    <!-- Nội dung câu hỏi sẽ được render bằng JS -->
    <div class="submit-wrap">
      <button class="btn-submit" onclick="openNameModal()">🎯 NỘP BÀI TÍNH ĐIỂM & XEM KẾT QUẢ</button>
    </div>
  </div>
</div>

<!-- MODAL NHẬP TÊN -->
<div class="modal-overlay" id="nameModal">
  <div class="modal-box">
    <h2 style="font-size: 1.8rem; font-weight: 900; color: #2d3436;">Tên em là gì nhỉ? 🌟</h2>
    <input type="text" id="studentName" class="name-input" placeholder="Nhập tên để MS Chí Nên chấm điểm...">
    <button class="btn-action" onclick="submitQuiz()">Bắt đầu nộp bài 🚀</button>
  </div>
</div>

<!-- MODAL KẾT QUẢ -->
<div class="modal-overlay" id="resultModal">
  <div class="modal-box">
    <h2 id="resName" style="font-size: 1.6rem; font-weight: 900; color: #2d3436;">Chúc mừng!</h2>
    <img id="resImg" class="meme-img" src="" alt="Meme">
    <div class="score-display" id="resScore">0/24</div>
    <div class="score-10" id="resScore10">Hệ 10: 0/10 điểm</div>
    <p class="feedback-text" id="resFeedback"></p>
    <br>
    <button class="btn-action" onclick="closeModal('resultModal')" style="background: linear-gradient(135deg, #00b894, #55efc4);">Xem lại giải thích 👀</button>
  </div>
</div>

<script>
// ================= HIỆU ỨNG ĐỒ VẬT, CÂY CỐI BAY BAY =================
function createFloatingItems() {
  const items = ['🌲', '🌳', '🍃', '🍁', '📚', '✏️', '⛵', '🏴‍☠️', '👻']; // Cây, lá, đồ học tập và một chút thú vị ẩn giấu
  const container = document.body;
  for (let i = 0; i < 25; i++) {
    let el = document.createElement('div');
    el.className = 'floating-item';
    el.innerText = items[Math.floor(Math.random() * items.length)];
    el.style.left = Math.random() * 100 + 'vw';
    // Random kích thước từ 1.5rem đến 3.5rem
    el.style.fontSize = (Math.random() * 2 + 1.5) + 'rem';
    // Random thời gian bay và thời gian chờ
    el.style.animationDuration = (Math.random() * 12 + 10) + 's';
    el.style.animationDelay = (Math.random() * 10) + 's';
    container.appendChild(el);
  }
}
createFloatingItems();

// ================= HỆ THỐNG ÂM THANH WEB AUDIO API =================
const AudioContext = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContext();

function playDing() {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
  osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); // A6
  gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
  gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
  osc.connect(gainNode); gainNode.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.5);
}

function playTingTing() {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(300, audioCtx.currentTime);
  osc.frequency.setValueAtTime(200, audioCtx.currentTime + 0.15);
  gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gainNode.gain.setValueAtTime(0, audioCtx.currentTime + 0.1);
  gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime + 0.15);
  gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
  osc.connect(gainNode); gainNode.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.3);
}

function spawnConfetti() {
  const colors = ['#f1c40f', '#e74c3c', '#9b59b6', '#2ecc71', '#3498db', '#e67e22'];
  for (let i = 0; i < 40; i++) {
    let conf = document.createElement('div');
    conf.className = 'confetti';
    conf.style.left = Math.random() * 100 + 'vw';
    conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    conf.style.width = (Math.random() * 12 + 6) + 'px';
    conf.style.height = (Math.random() * 8 + 4) + 'px';
    let duration = Math.random() * 2 + 1.5;
    conf.style.animationDuration = duration + 's';
    document.body.appendChild(conf);
    setTimeout(() => conf.remove(), duration * 1000);
  }
}

function toggleTrans(id) {
  const el = document.getElementById(id);
  el.style.display = (el.style.display === 'block') ? 'none' : 'block';
}

// ================= DỮ LIỆU ĐỀ BÀI (FULL 24 CÂU KHÔNG CẮT XÉN) =================
const data = [
  {
    title: "Exercise 19 (Part 1): Skating",
    paragraphs: [
      {
        en: "A favourite winter activity is skating. But before you go skating on a pond or lake, there are a few safety tips you should know. The ice should be at least 6 inches thick. Never skate alone. Never assume the ice is safe, and do not go out onto the ice after an animal or toy. Always be familiar with the area where you want to skate and be sure it is well-lit if you go skating at night. The safest place to go skating is on a skating rink. Some cities have outdoor skating rinks. And most cities have an indoor skating rink you can use for a small fee.",
        vi: "Một hoạt động mùa đông yêu thích là trượt băng. Nhưng trước khi bạn đi trượt băng trên ao hoặc hồ, có một vài mẹo an toàn bạn nên biết. Lớp băng phải dày ít nhất 6 inch. Đừng bao giờ trượt băng một mình. Đừng bao giờ cho rằng băng là an toàn, và đừng đi ra ngoài lớp băng để đuổi theo một con vật hay đồ chơi. Luôn quen thuộc với khu vực bạn muốn trượt và đảm bảo nó được chiếu sáng tốt nếu bạn đi trượt vào ban đêm. Nơi an toàn nhất để trượt là trên sân trượt băng. Một số thành phố có sân trượt ngoài trời. Và hầu hết các thành phố đều có sân trượt trong nhà mà bạn có thể dùng với một khoản phí nhỏ."
      },
      {
        en: "When you go skating for the first time, make sure you wear warm socks, a warm hat, and lots of layers of clothing. Most rinks have hot drinks and snacks, but you can also bring your own snacks. Weekends are usually the busiest time of the week to go skating. Weekday nights are usually less crowded. Evening skating can be a lot of fun for the whole family. Most rinks have floodlights. At night, the rink is lit up and bright.",
        vi: "Khi bạn đi trượt băng lần đầu, hãy chắc chắn rằng bạn đi tất ấm, đội mũ ấm và mặc nhiều lớp quần áo. Hầu hết các sân trượt đều có đồ uống nóng và đồ ăn nhẹ, nhưng bạn cũng có thể tự mang theo đồ ăn vặt. Cuối tuần thường là thời gian bận rộn nhất trong tuần để đi trượt băng. Các buổi tối trong tuần thường ít đông đúc hơn. Trượt băng buổi tối có thể rất vui cho cả gia đình. Hầu hết các sân đều có đèn pha. Vào ban đêm, sân trượt được thắp sáng rực rỡ."
      }
    ],
    glossary: [
      {w: "Assume", p: "(v)", m: "Giả định, cho rằng"},
      {w: "Familiar", p: "(adj)", m: "Quen thuộc, am hiểu"},
      {w: "Rink", p: "(n)", m: "Sân trượt băng"},
      {w: "Fee", p: "(n)", m: "Lệ phí, khoản phí"},
      {w: "Layer", p: "(n)", m: "Lớp (quần áo, bề mặt)"},
      {w: "Crowded", p: "(adj)", m: "Đông đúc, chật chội"},
      {w: "Floodlight", p: "(n)", m: "Đèn pha chiếu sáng"},
      {w: "Well-lit", p: "(adj)", m: "Được chiếu sáng tốt"},
      {w: "Snack", p: "(n)", m: "Đồ ăn nhẹ"},
      {w: "Thick", p: "(adj)", m: "Dày"}
    ],
    questions: [
      {
        q: "What can be the best title for the passage?",
        opts: [{t: "Winter Fun", c: false}, {t: "Skating Safety Tips", c: true}, {t: "Best Skating Rinks", c: false}, {t: "How to Knit a Scarf", c: false}],
        exp: `
          📝 <b>Dịch câu hỏi:</b> Tiêu đề tốt nhất cho đoạn văn có thể là gì?<br>
          <b>Phân tích 4 đáp án:</b>
          <ul class='exp-list'>

// ================= RENDER LOGIC =================
function shuffleArray(array) {
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

let totalQuestions = 0;
let answeredCount = 0;
let totalScore = 0;

function initApp() {
  const readPane = document.getElementById('readingPane');
  const exPane = document.getElementById('exercisePane');
  
  // Lấy node DOM gốc thay vì innerHTML string để không làm mất event listeners
  const submitWrap = document.querySelector('.submit-wrap');
  
  let qGlobalIndex = 1;

  data.forEach((ex, exIndex) => {
    // ---- 1. RENDER LEFT (READING) ----
    const rBlock = document.createElement('div');
    rBlock.style.marginBottom = "50px";
    
    let htmlRead = `<h1 class="ex-title">📖 ${ex.title}</h1>`;
    
    // Paragraphs
    ex.paragraphs.forEach((p, pIndex) => {
      let tid = `trans_${exIndex}_${pIndex}`;
      htmlRead += `
        <div class="paragraph-box">
          <div class="en-text">${p.en}</div>
          <button class="btn-trans" onclick="toggleTrans('${tid}')">Mở dịch đoạn này 🌟</button>
          <div class="vi-text" id="${tid}">${p.vi}</div>
        </div>
      `;
    });

    // Glossary
    if (ex.glossary && ex.glossary.length > 0) {
      htmlRead += `<h2 class="glossary-title">📚 Academic Glossary</h2>
      <table class="glass-table">
        <thead><tr><th>Từ vựng</th><th>Loại từ</th><th>Nghĩa tiếng Việt</th></tr></thead>
        <tbody>`;
      ex.glossary.forEach(g => { htmlRead += `<tr><td>${g.w}</td><td>${g.p}</td><td>${g.m}</td></tr>`; });
      htmlRead += `</tbody></table>`;
    }
    
    rBlock.innerHTML = htmlRead;
    readPane.appendChild(rBlock);

    // ---- 2. RENDER RIGHT (QUESTIONS) ----
    const qBlock = document.createElement('div');
    qBlock.style.marginBottom = "50px";
    qBlock.innerHTML = `<h1 class="ex-title">🎯 ${ex.title} - Trắc nghiệm</h1>`;
    
    ex.questions.forEach((qObj) => {
      totalQuestions++;
      
      const qCard = document.createElement('div');
      qCard.className = 'q-card';
      qCard.innerHTML = `<div class="q-text">Câu ${qGlobalIndex}: ${qObj.q}</div>`;
      
      const optsGrid = document.createElement('div');
      optsGrid.className = 'opts-grid';
      
      let shuffOpts = shuffleArray(qObj.opts);
      
      shuffOpts.forEach((opt) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = opt.t;
        
        btn.onclick = function() {
          // Khóa tất cả các nút trong câu này
          const allBtns = optsGrid.querySelectorAll('.opt-btn');
          allBtns.forEach(b => b.disabled = true);
          
          answeredCount++;
          document.getElementById('progressText').innerText = `${answeredCount} / ${totalQuestions}`;
          
          if (opt.c) {
            btn.classList.add('correct');
            playDing();
            spawnConfetti();
            totalScore++;
          } else {
            btn.classList.add('wrong');
            playTingTing();
            // Highlight đáp án đúng
            allBtns.forEach(b => {
              if (shuffOpts.find(o => o.t === b.innerText).c) {
                b.classList.add('reveal-correct');
              }
            });
          }
          
          expDiv.classList.add('show');
        };
        optsGrid.appendChild(btn);
      });
      
      qCard.appendChild(optsGrid);
      
      // Explanation Box
      const expDiv = document.createElement('div');
      expDiv.className = 'explanation';
      expDiv.innerHTML = `<div class="exp-title">🌟 Giải thích chuẩn Master</div>${qObj.exp}`;
      qCard.appendChild(expDiv);
      
      qBlock.appendChild(qCard);
      qGlobalIndex++;
    });
    
    exPane.appendChild(qBlock);
  });
  
  // Nút Nộp Bài sẽ được gỡ và nối vào cuối thay vì ghi đè bằng innerHTML
  exPane.appendChild(submitWrap);
}

// Gọi khởi tạo
initApp();

// ================= SUBMIT & MODALS LOGIC =================
function openNameModal() {
  if (answeredCount < totalQuestions) {
    alert(`Em mới làm được ${answeredCount}/${totalQuestions} câu thôi kìa. Ráng làm full 100% các câu rồi mới nộp bài nha! 💪`);
    return;
  }
  document.getElementById('nameModal').style.display = 'flex';
}

function closeModal(id) {
  document.getElementById(id).style.display = 'none';
}

function submitQuiz() {
  const name = document.getElementById('studentName').value.trim();
  if (!name) {
    alert("Em quên nhập tên kìa! 🥺");
    return;
  }
  
  closeModal('nameModal');
  
  // Tính điểm hệ 10
  const score10 = Math.round((totalScore / totalQuestions) * 10 * 10) / 10;
  const pct = totalScore / totalQuestions;
  
  document.getElementById('resName').innerText = `Giỏi quá ${name} ơi!`;
  document.getElementById('resScore').innerText = `${totalScore} / ${totalQuestions}`;
  document.getElementById('resScore10').innerText = `Hệ 10: ${score10} / 10 điểm`;
  
  const imgEl = document.getElementById('resImg');
  const fbEl = document.getElementById('resFeedback');
  
  if (pct === 1) {
    imgEl.src = "https://media.giphy.com/media/11sBLVxNs7v6WA/giphy.gif"; 
    fbEl.innerText = "MS Chí Nên: THIÊN TÀI! Em đã trả lời đúng 100% không sai một ly nào! Tuyệt vời! 🏆🌟";
    setTimeout(spawnConfetti, 500);
    setTimeout(spawnConfetti, 1500);
  } else if (pct >= 0.6) {
    imgEl.src = "https://media.giphy.com/media/3o7TKqgqfaGccG9nWg/giphy.gif";
    fbEl.innerText = "MS Chí Nên: Rất tốt! Em đã nắm bài khá chắc, nhớ xem lại phần giải thích cho câu bị sai nhé! 👏";
  } else {
    imgEl.src = "https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif"; 
    fbEl.innerText = "MS Chí Nên: Chà, bài này hơi khó nhằn nhỉ! Đừng buồn, hãy đọc siêu kỹ phần giải thích bên dưới để làm lại nhé! Cố lên! 💪";
  }
  
  document.getElementById('resultModal').style.display = 'flex';
}
</script>

window.__devclean=clean;
function fix(skip){var L=document.querySelectorAll('input:not([type]),input[type=text],input[type=search],textarea');
  for(var i=0;i<L.length;i++){var el=L[i];if(el===skip||el.readOnly||el.disabled)continue;var v=el.value,c=clean(v);if(c!==v)el.value=c;}}
['pointerdown','mousedown','touchstart','click','change','focusout'].forEach(function(t){document.addEventListener(t,function(e){fix(t==='focusout'||t==='change'?null:e.target)},true)});
