<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 Nguyễn Trường Tộ p1 — English 8 GK1 | MS Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --space0:#0B0724; --space1:#150E3D; --space2:#241659;
  --pan-lo:#6B4FB8; --pan-hi:#9B7FE0; --pan-edge:#C2AEF5;
  --inner-lo:#33299B; --inner-hi:#5B4FC7;
  --orange:#FF9A2E; --orange-hi:#FFC94D; --orange-lo:#D97B1F; --orange-txt:#6B3200;
  --star:#FFB627; --pink:#F0509B; --cyan:#3FD9F5; --green:#3BE07A; --red:#FF5A6E;
  --txt:#F4EEFF; --txt2:#C3B5EC;
}
html{scroll-behavior:smooth}
body{font-family:'Nunito','Segoe UI',sans-serif;color:var(--txt);background:var(--space0);
  min-height:100vh;overflow-x:hidden;line-height:1.7;padding-bottom:150px;-webkit-tap-highlight-color:transparent}

/* ══════════ VŨ TRỤ ══════════ */
.sky{position:fixed;inset:0;z-index:-9;
  background:
   radial-gradient(ellipse 50% 36% at 18% 12%,rgba(155,127,224,.34) 0%,transparent 64%),
   radial-gradient(ellipse 46% 32% at 84% 22%,rgba(63,217,245,.20) 0%,transparent 64%),
   radial-gradient(ellipse 52% 36% at 62% 78%,rgba(240,80,155,.20) 0%,transparent 66%),
   linear-gradient(175deg,#0B0724 0%,#150E3D 30%,#241659 58%,#150E3D 80%,#07051A 100%)}
#stars{position:fixed;inset:0;z-index:-8;pointer-events:none}

/* ngôi sao 4 cánh lấp lánh */
.spark{position:fixed;z-index:-7;pointer-events:none;animation:sparkTwinkle ease-in-out infinite alternate}
@keyframes sparkTwinkle{0%{transform:scale(.6) rotate(0);opacity:.35}100%{transform:scale(1.15) rotate(28deg);opacity:1}}

/* hành tinh & vật thể bay */
.floaty{position:fixed;z-index:-6;pointer-events:none;animation:floatBob ease-in-out infinite alternate}
@keyframes floatBob{0%{transform:translateY(0) rotate(-3deg)}100%{transform:translateY(-26px) rotate(3deg)}}
.crosser{position:fixed;z-index:-6;pointer-events:none;animation:crossFly linear infinite}
@keyframes crossFly{0%{transform:translate(-18vw,0)}50%{transform:translate(50vw,-32px)}100%{transform:translate(118vw,8px)}}

/* bề mặt mặt trăng dưới chân trang */
.moon-floor{position:fixed;left:0;right:0;bottom:0;height:150px;z-index:-5;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(11,7,36,.4) 22%,rgba(11,7,36,0) 24%)}
.moon-floor svg{position:absolute;bottom:-4px;left:-2%;width:104%;height:auto;display:block;
  filter:drop-shadow(0 -6px 22px rgba(155,127,224,.28))}

/* ══════════ KHUNG PANEL GAME ══════════ */
.wrap{position:relative;z-index:4;max-width:1000px;margin:0 auto;padding:18px 14px 20px}
.panel{position:relative;border-radius:30px;padding:9px;
  background:linear-gradient(180deg,var(--pan-hi),var(--pan-lo));
  border:3px solid var(--pan-edge);
  box-shadow:0 10px 0 rgba(58,38,110,.9),0 20px 44px rgba(0,0,0,.55),inset 0 3px 0 rgba(255,255,255,.28)}
.panel::after{content:'';position:absolute;left:14px;right:14px;top:6px;height:34%;border-radius:22px;
  background:linear-gradient(180deg,rgba(255,255,255,.26),transparent);pointer-events:none}
.panel-in{position:relative;border-radius:23px;padding:20px 18px;
  background:linear-gradient(180deg,var(--inner-hi),var(--inner-lo));
  box-shadow:inset 0 5px 16px rgba(0,0,0,.42),inset 0 -2px 0 rgba(255,255,255,.12)}

/* ruy băng tiêu đề */
.ribbon{position:relative;margin:0 auto 16px;max-width:560px;padding:11px 34px;text-align:center;
  background:linear-gradient(180deg,#B49BEE,#8A6DD6);border:3px solid #D3C3FA;border-radius:12px;
  box-shadow:0 6px 0 rgba(58,38,110,.85),0 12px 24px rgba(0,0,0,.4);
  font-family:'Fredoka One','Baloo 2',cursive;font-size:clamp(15px,3vw,22px);letter-spacing:1.4px;color:#fff;
  text-shadow:0 3px 0 rgba(70,44,130,.95),0 0 18px rgba(255,182,39,.45)}
.ribbon::before,.ribbon::after{content:'';position:absolute;top:8px;width:26px;height:26px;
  background:#6B52B5;border:3px solid #D3C3FA;transform:rotate(45deg);z-index:-1}
.ribbon::before{left:-15px}.ribbon::after{right:-15px}

/* ══════════ HUD GAME ══════════ */
.topbar{position:sticky;top:0;z-index:60;margin-bottom:14px;padding:8px 0 10px;
  background:linear-gradient(180deg,rgba(11,7,36,.95) 66%,rgba(11,7,36,.8) 86%,rgba(11,7,36,0));
  backdrop-filter:blur(7px)}
.hud{margin-bottom:9px;padding:10px;border-radius:24px;
  background:linear-gradient(180deg,rgba(155,127,224,.96),rgba(85,62,160,.96));
  border:3px solid var(--pan-edge);backdrop-filter:blur(10px);
  box-shadow:0 8px 0 rgba(48,30,96,.9),0 14px 34px rgba(0,0,0,.5)}
.hud-row{display:flex;flex-wrap:wrap;gap:9px;align-items:center;justify-content:center}
.gauge{display:flex;align-items:center;gap:8px;flex:1 1 150px;min-width:140px;padding:6px 12px 6px 7px;
  border-radius:99px;background:linear-gradient(180deg,#4A3BA8,#2E2478);
  box-shadow:inset 0 3px 9px rgba(0,0,0,.5),0 2px 0 rgba(255,255,255,.14)}
.gauge .ic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;
  background:radial-gradient(circle at 34% 30%,#FFE59B,var(--star));box-shadow:0 0 14px rgba(255,182,39,.7),inset 0 -2px 0 rgba(0,0,0,.2)}
.gauge .ic.blue{background:radial-gradient(circle at 34% 30%,#BFF3FF,var(--cyan));box-shadow:0 0 14px rgba(63,217,245,.7)}
.gauge .ic.pink{background:radial-gradient(circle at 34% 30%,#FFC0DC,var(--pink));box-shadow:0 0 14px rgba(240,80,155,.7)}
.gauge .bar{flex:1;height:14px;border-radius:99px;background:rgba(10,6,34,.7);overflow:hidden;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
.gauge .fill{height:100%;width:0%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);
  background:linear-gradient(90deg,#FFE59B,var(--star),var(--orange));box-shadow:0 0 12px rgba(255,182,39,.8)}
.gauge .fill.blue{background:linear-gradient(90deg,#BFF3FF,var(--cyan),#2E8BFF);box-shadow:0 0 12px rgba(63,217,245,.8)}
.gauge .val{flex:none;font-family:'Fredoka One',cursive;font-size:.98rem;color:#fff;min-width:46px;text-align:right;
  text-shadow:0 2px 0 rgba(40,22,90,.9)}
.streak{display:flex;align-items:center;gap:7px;padding:7px 15px;border-radius:99px;
  font-family:'Fredoka One',cursive;font-size:.95rem;color:#6B3200;white-space:nowrap;
  background:linear-gradient(180deg,var(--orange-hi),var(--orange));border:2px solid #FFE08A;
  box-shadow:0 4px 0 var(--orange-lo),0 0 18px rgba(255,154,46,.5)}
.streak.hot{animation:streakPop .5s ease}
@keyframes streakPop{0%,100%{transform:scale(1)}45%{transform:scale(1.22) rotate(-4deg)}}

/* ══════════ HEADER ══════════ */
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;text-align:center}
.hero-txt{flex:1 1 260px;min-width:240px}
.hero h1{font-family:'Fredoka One',cursive;font-size:clamp(18px,4vw,30px);line-height:1.34;color:#fff;
  text-shadow:0 4px 0 rgba(62,38,118,.95),0 0 26px rgba(255,182,39,.45)}
.hero h1 em{font-style:normal;color:var(--star)}
.hero .tag{display:inline-block;margin-top:9px;padding:7px 18px;border-radius:99px;font-weight:800;font-size:.86rem;
  color:#3B1E72;background:linear-gradient(180deg,#F4ECFF,#D8C8F8);border:2px solid #fff;
  box-shadow:0 4px 0 rgba(88,60,158,.55)}
.mascot{flex:none;width:118px;animation:mascotFloat 3s ease-in-out infinite alternate}
@keyframes mascotFloat{0%{transform:translateY(0) rotate(-2deg)}100%{transform:translateY(-12px) rotate(2deg)}}
@media(max-width:560px){.mascot{width:86px}}

/* ══════════ NHẮC NHỞ XOAY ══════════ */
.rmb{display:flex;gap:11px;align-items:center;margin:0;padding:10px 15px;border-radius:18px;
  font-size:.87rem;font-weight:700;line-height:1.66;color:#FFF4DA;
  background:linear-gradient(120deg,rgba(255,154,46,.2),rgba(240,80,155,.16),rgba(63,217,245,.16));
  background-size:280% 100%;animation:rmbFlow 9s ease-in-out infinite;
  border:2px dashed rgba(255,201,77,.55);box-shadow:inset 0 0 26px rgba(255,182,39,.1)}
@keyframes rmbFlow{50%{background-position:100% 50%}}
.rmb .ic{font-size:1.5rem;flex:none;animation:rmbBeat 1.5s ease-in-out infinite}
@keyframes rmbBeat{50%{transform:scale(1.25) rotate(-9deg)}}
.rmb b{color:var(--star)}.rmb .hi{color:var(--cyan);font-weight:900}
#rmbTxt{flex:1;animation:rmbFade .5s ease}
.rmb-min{flex:none;width:28px;height:28px;border:none;border-radius:9px;cursor:pointer;
  font-family:'Fredoka One',cursive;font-size:1rem;color:#6B3200;
  background:linear-gradient(180deg,#FFC94D,#FF9A2E);box-shadow:0 3px 0 #D97B1F;transition:all .16s}
.rmb-min:hover{transform:translateY(-2px);box-shadow:0 5px 0 #D97B1F}
.rmb.mini{padding:7px 13px}
.rmb.mini #rmbTxt{display:none}
.rmb.mini::after{content:'Lời nhắc của cô (bấm + để mở)';flex:1;font-size:.82rem;opacity:.85}
@media(max-width:620px){
  .rmb{font-size:.8rem;line-height:1.55;padding:9px 12px}
  .gauge{min-width:118px;flex:1 1 118px;padding:5px 10px 5px 6px}
  .gauge .val{font-size:.86rem;min-width:40px}
  .streak{padding:6px 12px;font-size:.84rem}
}
@keyframes rmbFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ══════════ MỤC BÀI ══════════ */
.sec-hd{display:flex;gap:13px;align-items:center;margin:26px 0 14px;padding:13px 17px;border-radius:20px;
  background:linear-gradient(180deg,rgba(155,127,224,.5),rgba(85,62,160,.42));
  border:2px solid rgba(194,174,245,.5);box-shadow:0 5px 0 rgba(48,30,96,.55)}
.sec-hd .si{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.45rem;
  background:linear-gradient(180deg,var(--orange-hi),var(--orange));border:2px solid #FFE08A;
  box-shadow:0 4px 0 var(--orange-lo)}
.sec-hd h2{font-family:'Fredoka One',cursive;font-size:1.04rem;color:#fff;text-shadow:0 3px 0 rgba(62,38,118,.9)}
.sec-hd p{font-size:.84rem;color:var(--txt2);font-weight:700;margin-top:2px;line-height:1.6}

/* ══════════ A.I — KÉO THẢ ══════════ */
.pool-lbl{font-family:'Fredoka One',cursive;font-size:.86rem;color:var(--star);margin-bottom:9px;
  text-shadow:0 2px 0 rgba(62,38,118,.9)}
.pool{display:flex;flex-wrap:wrap;gap:9px;min-height:74px;padding:13px;border-radius:18px;margin-bottom:16px;
  background:rgba(10,6,34,.5);border:2px dashed rgba(194,174,245,.42);box-shadow:inset 0 4px 14px rgba(0,0,0,.45)}
.chip{padding:9px 16px;border-radius:99px;cursor:pointer;user-select:none;font-weight:900;font-size:.94rem;
  color:#3B1E72;background:linear-gradient(180deg,#FFFFFF,#D9CCF7);border:2px solid #fff;
  box-shadow:0 4px 0 rgba(88,60,158,.85);transition:transform .14s,box-shadow .14s}
.chip:hover{transform:translateY(-3px);box-shadow:0 7px 0 rgba(88,60,158,.85)}
.chip.sel{background:linear-gradient(180deg,var(--orange-hi),var(--orange));color:var(--orange-txt);
  border-color:#FFE08A;box-shadow:0 5px 0 var(--orange-lo),0 0 24px rgba(255,182,39,.8);transform:translateY(-4px) scale(1.07)}
.chip.ok{background:linear-gradient(180deg,#9DFFC4,var(--green));color:#053D21;border-color:#CFFFE2;
  box-shadow:0 4px 0 #1C9E52;cursor:default}
.chip.no{background:linear-gradient(180deg,#FFB3BD,var(--red));color:#5A0A16;border-color:#FFD6DB;
  box-shadow:0 4px 0 #C42C3E;animation:shakeX .42s ease}
@keyframes shakeX{0%,100%{transform:translateX(0)}22%{transform:translateX(-7px)}45%{transform:translateX(7px)}70%{transform:translateX(-4px)}}

.dz-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.dz-grid{grid-template-columns:1fr}}
.dz{padding:8px;border-radius:24px;cursor:pointer;transition:transform .16s,box-shadow .16s;
  background:linear-gradient(180deg,var(--pan-hi),var(--pan-lo));border:3px solid var(--pan-edge);
  box-shadow:0 7px 0 rgba(48,30,96,.9)}
.dz:hover{transform:translateY(-4px);box-shadow:0 11px 0 rgba(48,30,96,.9),0 0 30px rgba(255,182,39,.35)}
.dz-in{border-radius:18px;padding:13px;min-height:130px;
  background:linear-gradient(180deg,var(--inner-hi),var(--inner-lo));box-shadow:inset 0 4px 14px rgba(0,0,0,.45)}
.zone-hdr{text-align:center;font-family:'Fredoka One',cursive;font-size:1.02rem;padding:9px;border-radius:14px;margin-bottom:11px;
  color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.zh-z{background:linear-gradient(180deg,#5BD8FF,#2E8BFF);border:2px solid #BFF3FF;box-shadow:0 4px 0 #1D5FC0}
.zh-s{background:linear-gradient(180deg,#FF8ABF,#E33C8C);border:2px solid #FFD0E6;box-shadow:0 4px 0 #A81B62}
.zone-hdr small{display:block;font-family:'Nunito';font-size:.68rem;font-weight:800;opacity:.9}
.zone-body{display:flex;flex-wrap:wrap;gap:8px;min-height:62px}
.dep{margin-top:11px}
.dep-item{margin-top:8px;padding:11px 14px;border-radius:14px;font-size:.87rem;line-height:1.72;color:#EDE4FF;
  background:rgba(10,6,34,.55);border-left:4px solid var(--green);animation:popIn .3s ease}
.dep-item.bad{border-left-color:var(--red);background:rgba(90,10,26,.42)}
.dep-w{font-family:'Fredoka One',cursive;font-size:.98rem;margin-bottom:4px}
.dw-z{color:var(--cyan)}.dw-s{color:var(--pink)}
.ans-box{display:inline-block;padding:2px 11px;border-radius:99px;font-weight:900;color:#053D21;
  background:linear-gradient(180deg,#9DFFC4,var(--green))}
.ai-score{margin-top:13px;text-align:center;font-family:'Fredoka One',cursive;font-size:.96rem;color:var(--star);
  text-shadow:0 2px 0 rgba(62,38,118,.9);min-height:22px}

/* ══════════ A.II — TRẮC NGHIỆM ══════════ */
.q-card{position:relative;margin-bottom:16px;padding:8px;border-radius:26px;
  background:linear-gradient(180deg,var(--pan-hi),var(--pan-lo));border:3px solid var(--pan-edge);
  box-shadow:0 8px 0 rgba(48,30,96,.9),0 16px 34px rgba(0,0,0,.45)}
.q-in{border-radius:20px;padding:18px 17px 15px;
  background:linear-gradient(180deg,var(--inner-hi),var(--inner-lo));box-shadow:inset 0 4px 14px rgba(0,0,0,.45)}
.q-num{display:inline-flex;align-items:center;gap:7px;padding:5px 15px;border-radius:99px;margin-bottom:11px;
  font-family:'Fredoka One',cursive;font-size:.8rem;color:var(--orange-txt);
  background:linear-gradient(180deg,var(--orange-hi),var(--orange));border:2px solid #FFE08A;box-shadow:0 3px 0 var(--orange-lo)}
.q-text{font-size:1.02rem;font-weight:800;color:#fff;margin-bottom:13px;line-height:1.7}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(max-width:540px){.opts{grid-template-columns:1fr}}
.opt{position:relative;padding:14px 16px;border-radius:16px;cursor:pointer;text-align:center;
  font-family:'Nunito';font-size:1.06rem;font-weight:900;color:var(--orange-txt);
  background:linear-gradient(180deg,var(--orange-hi),var(--orange));border:3px solid #FFE08A;
  box-shadow:0 6px 0 var(--orange-lo);transition:transform .13s,box-shadow .13s}
.opt u{text-decoration-color:#B23A00;text-decoration-thickness:3px;text-underline-offset:3px}
.opt:hover:not(.done){transform:translateY(-3px);box-shadow:0 9px 0 var(--orange-lo),0 0 26px rgba(255,182,39,.55)}
.opt:active:not(.done){transform:translateY(4px);box-shadow:0 2px 0 var(--orange-lo)}
.opt.done{cursor:default}
.opt.right{background:linear-gradient(180deg,#9DFFC4,var(--green));border-color:#CFFFE2;box-shadow:0 6px 0 #1C9E52;color:#053D21}
.opt.wrongp{background:linear-gradient(180deg,#FFB3BD,var(--red));border-color:#FFD6DB;box-shadow:0 6px 0 #C42C3E;color:#5A0A16}
.opt.reveal{background:linear-gradient(180deg,#C8FFDF,#5EE39A);border-color:#E6FFF1;box-shadow:0 6px 0 #2AA865;color:#053D21}
.opt.dim{opacity:.45}
.opt.shake{animation:shakeX .42s ease}

.expl{display:none;margin-top:14px;padding:16px 17px;border-radius:18px;font-size:.92rem;line-height:1.85;color:#EDE4FF;
  background:rgba(10,6,34,.62);border:2px solid rgba(194,174,245,.35);box-shadow:inset 0 3px 12px rgba(0,0,0,.4);
  animation:popIn .32s ease}
.expl.show{display:block}
@keyframes popIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.exp-step{margin-bottom:10px;padding:10px 13px;border-radius:13px;background:rgba(255,255,255,.06);
  border-left:4px solid var(--star)}
.exp-step:last-child{margin-bottom:0}
.exp-step strong{color:var(--star)}
.pw{color:var(--cyan);font-weight:900}
.pph{background:rgba(240,80,155,.22);color:#FFC2DE;padding:2px 8px;border-radius:7px;font-weight:800;font-size:.9em}
.rb{margin-top:10px;padding:11px 14px;border-radius:14px;font-size:.86rem;line-height:1.8;color:#FFF0C9;
  background:rgba(255,182,39,.12);border:2px dashed rgba(255,201,77,.45)}

/* ══════════ NÚT & MODAL ══════════ */
.submit-wrap{text-align:center;margin:30px 0 8px}
.btn-game{padding:16px 46px;border:3px solid #FFE08A;border-radius:99px;cursor:pointer;
  font-family:'Fredoka One',cursive;font-size:1.06rem;letter-spacing:1px;color:var(--orange-txt);
  background:linear-gradient(180deg,var(--orange-hi),var(--orange));
  box-shadow:0 8px 0 var(--orange-lo),0 14px 30px rgba(255,154,46,.42);transition:transform .14s,box-shadow .14s}
.btn-game:hover{transform:translateY(-3px);box-shadow:0 11px 0 var(--orange-lo),0 18px 38px rgba(255,154,46,.55)}
.btn-game:active{transform:translateY(5px);box-shadow:0 3px 0 var(--orange-lo)}
.btn-game.sm{padding:11px 28px;font-size:.92rem;box-shadow:0 5px 0 var(--orange-lo)}
.btn-game.ghost{background:linear-gradient(180deg,#BFA9F2,#8A6DD6);color:#fff;border-color:#D3C3FA;box-shadow:0 5px 0 #4E3496}

.ov{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(7,4,24,.86);backdrop-filter:blur(8px)}
.ov.show{display:flex}
.modal{width:94%;max-width:430px;padding:9px;border-radius:32px;text-align:center;
  background:linear-gradient(180deg,var(--pan-hi),var(--pan-lo));border:3px solid var(--pan-edge);
  box-shadow:0 12px 0 rgba(48,30,96,.95),0 26px 60px rgba(0,0,0,.7);animation:bounceIn .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes bounceIn{from{opacity:0;transform:scale(.7) translateY(30px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-in{border-radius:25px;padding:26px 22px;
  background:linear-gradient(180deg,var(--inner-hi),var(--inner-lo));box-shadow:inset 0 5px 16px rgba(0,0,0,.45)}
.modal input{width:100%;margin:14px 0 6px;padding:13px 16px;border-radius:14px;text-align:center;
  font-family:'Nunito';font-size:1rem;font-weight:800;color:#3B1E72;
  background:linear-gradient(180deg,#fff,#E8DEFB);border:3px solid #D3C3FA;outline:none;
  box-shadow:inset 0 3px 8px rgba(88,60,158,.25)}
.modal input.err{border-color:var(--red);animation:shakeX .42s ease}
.err-msg{display:none;color:#FFC2C9;font-weight:800;font-size:.86rem;margin-bottom:6px}
.err-msg.show{display:block}
.res-emoji{font-size:3.4rem;line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.res-score{font-family:'Fredoka One',cursive;font-size:3rem;line-height:1.1;margin:8px 0 2px;color:var(--star);
  text-shadow:0 4px 0 rgba(62,38,118,.95),0 0 28px rgba(255,182,39,.6)}
.res-ten{font-family:'Fredoka One',cursive;font-size:1.1rem;color:#fff;margin-bottom:10px;text-shadow:0 3px 0 rgba(62,38,118,.9)}
.res-note{font-size:.9rem;font-weight:700;color:var(--txt2);line-height:1.75;margin-bottom:12px}
.sco-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;margin:7px 0;

(function(){

let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(freqs,type,vol){const c=ac();if(!c)return;const n=c.currentTime;
  freqs.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.value=f;o.connect(g);g.connect(c.destination);
    const t=n+i*.08;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.001,t+.34);o.start(t);o.stop(t+.38);});}
function sOK(){beep([659,880,1175],'triangle',.18)}
function sBAD(){beep([260,200,150],'square',.13)}
function sLVL(){beep([523,659,784,1047,1319],'triangle',.2)}
document.addEventListener('click',()=>{try{ac()}catch(e){}},{once:true});

function confetti(n){n=n||46;
  const C=['#FFB627','#FF9A2E','#F0509B','#3FD9F5','#3BE07A','#C2AEF5','#fff'];
  for(let i=0;i<n;i++){const d=document.createElement('div');d.className='cfp';
    const s=6+Math.random()*10;
    d.style.cssText='left:'+(Math.random()*100)+'vw;width:'+s+'px;height:'+s+'px;'+
      'background:'+C[i%C.length]+';border-radius:'+(Math.random()>.5?'50%':'3px')+';'+
      'animation-duration:'+(1.3+Math.random()*1.5)+'s;animation-delay:'+(Math.random()*.35)+'s';
    document.body.appendChild(d);setTimeout(()=>d.remove(),3400);}}
function xpPop(el,txt){
  const r=el.getBoundingClientRect();
  const d=document.createElement('div');d.className='xp-pop';d.textContent=txt;
  d.style.left=(r.left+r.width/2-24)+'px';d.style.top=(r.top-6)+'px';
  document.body.appendChild(d);setTimeout(()=>d.remove(),1100);}

/* ═══════════════ TRẠNG THÁI GAME ═══════════════ */
const TOTAL=30;
let s1=0,s2=0,done={},inter=0,streak=0,best=0,xp=0;
function refreshHUD(){
  const sc=s1+s2;
  document.getElementById('valScore').textContent=sc+'/'+TOTAL;
  document.getElementById('fillScore').style.width=(sc/TOTAL*100)+'%';
  document.getElementById('valProg').textContent=Math.round(inter/TOTAL*100)+'%';
  document.getElementById('fillProg').style.width=(inter/TOTAL*100)+'%';
  document.getElementById('streakTxt').textContent='CHUỖI '+streak;
  document.getElementById('xpTxt').textContent=xp+' XP';
}
function gainXP(el,ok){
  if(ok){ streak++; if(streak>best)best=streak;
    const bonus = streak>=5?20 : streak>=3?10 : 0;
    const got = 10+bonus; xp+=got;
    xpPop(el, '+'+got+' XP'+(bonus?' 🔥':''));
    const sb=document.getElementById('streakBox');
    sb.classList.remove('hot'); void sb.offsetWidth; sb.classList.add('hot');
    if(streak===3||streak===5||streak===10){sLVL();confetti(60);}
  } else { streak=0; }
  refreshHUD();
}
function addDone(k){if(!done[k]){done[k]=true;inter++;refreshHUD();}}
function sfl(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function buildMCQ(q){

  return p;

function pickMCQ(id,ch,cor,btn){
  if(done['mcq_'+id])return;
  addDone('mcq_'+id);
  const opts=document.querySelectorAll('#o-'+id+' .opt');
  opts.forEach(b=>b.classList.add('done'));
  const ok=(ch===cor);
  if(ok){ if(id[0]==='p')s1++;else s2++; btn.classList.add('right'); }
  else { btn.classList.add('wrongp','shake'); opts[cor].classList.add('reveal');

         setTimeout(()=>btn.classList.remove('shake'),460); }
  document.getElementById('e-'+id).classList.add('show');
  if(ok){sOK();confetti(30)}else{sBAD()}
  gainXP(btn,ok);
}

function fix(skip){var L=document.querySelectorAll('input:not([type]),input[type=text],input[type=search],textarea');

var DUCK='https://hoctienganhcungcomaianulis.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/Ti%E1%BA%BFng%20V%E1%BB%8Bt%20k%C3%AAu%20meme%20mp3.mp3';
window.answered=0;window.score=0;
function sync(){try{var d=(typeof done==='object'&&done)?Object.keys(done).length:0;window.answered=d;window.score=(typeof s1!=='undefined'?s1:0)+(typeof s2!=='undefined'?s2:0);}catch(e){}}
['pickMCQ','place'].forEach(function(n){var f=window[n];if(typeof f!=='function')return;window[n]=function(){var r=f.apply(this,arguments);sync();return r;};});
if(typeof window.sBAD==='function'){var b=window.sBAD;window.sBAD=function(){try{b()}catch(e){}try{var a=new Audio(DUCK);a.volume=.8;a.play()}catch(e){}};}
var ck=document.createElement('div');ck.id='lfClock';document.body.appendChild(ck);
function fmt(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);return (m<10?'0':'')+m+':'+((s%60)<10?'0':'')+(s%60)}
var tick=setInterval(function(){ck.textContent='⏱ '+fmt(Date.now()-T0)},1000);ck.textContent='⏱ 00:00';
function dur(ms){var s=Math.floor(ms/1000);return Math.floor(s/60)+' phút '+(s%60)+' giây'}
function now(){var d=new Date(),p=function(n){return(n<10?'0':'')+n};return p(d.getHours())+':'+p(d.getMinutes())+' · '+p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()}
if(typeof window.showResult==='function'){var sr=window.showResult;window.showResult=function(){
  var inp=document.getElementById('nameIn'),err=document.getElementById('nameErr');var nm=inp?inp.value.trim().replace(/\s+/g,' '):'';
  if(inp&&nm.split(' ').length<2){if(err){err.textContent='⚠️ Con nhập đủ HỌ và TÊN nhé (ví dụ: Nguyễn Văn An)';err.classList.add('show')}inp.classList.add('err');setTimeout(function(){inp.classList.remove('err')},500);return;}
  if(err)err.textContent='⚠️ Con chưa nhập tên kìa!';
  sync();var r=sr.apply(this,arguments);var el=Date.now()-T0;clearInterval(tick);ck.textContent='⏱ '+fmt(el);
  var old=document.getElementById('ngTag');if(old)old.remove();
  var tag=document.createElement('div');tag.id='ngTag';
  tag.innerHTML='👤 <b>'+nm.replace(/</g,'&lt;')+'</b><br>⏱ Làm bài trong '+dur(el)+'<br>⏰ Nộp lúc '+now()+'<br>📘 '+document.title.replace(/\s*\|.*$/,'');
  var note=document.getElementById('resNote');if(note)note.insertAdjacentElement('beforebegin',tag);else{var m=document.querySelector('#resOv .modal-in');if(m)m.appendChild(tag)}
  return r;};}
function dict(){document.querySelectorAll('[id^="e-"]').forEach(function(ex){if(ex.querySelector('.lf-cbw'))return;var ws=[];ex.querySelectorAll('.pw').forEach(function(p){var w=p.textContent.trim().toLowerCase();if(/^[a-z' -]+$/.test(w)&&ws.indexOf(w)<0)ws.push(w)});
  if(!ws.length)return;var d=document.createElement('div');d.className='cbw lf-cbw';d.innerHTML=ws.slice(0,4).map(function(w){return '<a target="_blank" rel="noopener" href="https://dictionary.cambridge.org/vi/dictionary/english/'+encodeURIComponent(w)+'">🔊 Cambridge · '+w+'</a>'}).join('');ex.appendChild(d)});}
dict();setTimeout(dict,800);
})();</script>

<script>/*attempts*/(function(){
var KEY='att:'+decodeURIComponent(location.pathname),done=false;
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a.slice(-20)))}catch(e){}}
function fmt(d){var p=function(n){return(n<10?'0':'')+n};return p(d.getDate())+'/'+p(d.getMonth()+1);}
function durOf(tag){var m=(tag.textContent||'').match(/Làm bài trong\s*((?:\d+\s*phút\s*)?\d+\s*giây)/);return m?m[1].replace(/\s+/g,' '):'';}
function score(){var a=document.getElementById('resScore');if(a)return a.textContent.replace(/\s+/g,'');
  a=document.getElementById('rS');if(a)return a.textContent.replace(/\s+/g,'');
  a=document.getElementById('rSc');var b=document.getElementById('rTt');if(a)return a.textContent.trim()+'/'+(b?b.textContent.trim():'?');return '?';}
function add(tag){
  if(tag.querySelector('.ngAtt'))return;
  var a=load();
  if(!done){done=true;a.push({s:score(),t:Date.now(),d:durOf(tag)});save(a);}
  var k=a.length,prev=a.slice(Math.max(0,k-6),k-1);
  var d=document.createElement('div');d.className='ngAtt';
  d.style.cssText='display:block;margin-top:6px;padding-top:6px;border-top:2px dashed #DDD6FE';
  d.innerHTML='🔁 <b>Lần nộp thứ '+k+'</b> trên máy này'+(prev.length?'<br><small>'+prev.map(function(x,i){return 'Lần '+(k-prev.length+i)+': <b>'+x.s+'</b>'+(x.d?' · ⏱ làm trong <b>'+x.d+'</b>':'')+' · '+fmt(new Date(x.t))}).join('<br>')+'</small>':'');
  tag.appendChild(d);
}
function check(){var t=document.getElementById('ngTag')||document.querySelector('#rn .ngTag');if(t&&t.textContent.trim())add(t);}
new MutationObserver(check).observe(document.body,{childList:true,subtree:true,characterData:true});
})();</script>
<script>
// Remove password lock completely - direct quiz access
(function() {
    function unlockNow() {
        var pwIds = [
            'passwordModal', 'password-modal', 'pwModal', 'pw-modal', 'pw-overlay', 
            'lockModal', 'passModal', 'authModal', 'auth-modal', 'nameModal', 'name-modal', 'nameInputModal'
        ];
        pwIds.forEach(function(id) {
            var el = document.getElementById(id);
            if (el) {
                el.style.setProperty('display', 'none', 'important');
                try { el.remove(); } catch(e) {}
            }
        });

        var modalEls = document.querySelectorAll('.password-modal, .lock-modal, .lock-overlay, #lockOverlay, #auth-modal, .modal-overlay');
        modalEls.forEach(function(el) {
            if (el.id !== 'resultModal' && el.id !== 'result-modal' && el.id !== 'scoreModal') {
                el.style.setProperty('display', 'none', 'important');
                try { el.remove(); } catch(e) {}
            }
        });

        var mainIds = [
            'mainContent', 'main-content', 'mainHeader', 'main-header', 
            'app-container', 'app', 'quiz-wrapper', 'quizContainer', 'quiz-container', 'reading-content'
        ];
        mainIds.forEach(function(id) {
            var el = document.getElementById(id);
            if (el) {
                if (id === 'main-content' || id.toLowerCase().includes('header') || el.classList.contains('main-container')) {
                    el.style.setProperty('display', 'flex', 'important');
                } else {
                    el.style.setProperty('display', 'block', 'important');
                }
            }
        });

        if (typeof buildQuiz === 'function') { try { buildQuiz(); } catch(e){} }
        if (typeof initQuiz === 'function') { try { initQuiz(); } catch(e){} }
        if (typeof renderApp === 'function') { try { renderApp(); } catch(e){} }
        if (typeof renderQuiz === 'function') { try { renderQuiz(); } catch(e){} }
        if (typeof startQuiz === 'function') { try { startQuiz(); } catch(e){} }
        if (typeof renderAllQuestions === 'function') { try { renderAllQuestions(); } catch(e){} }
        if (typeof renderAll === 'function') { try { renderAll(); } catch(e){} }
        if (typeof startApp === 'function') { try { startApp(); } catch(e){} }
        if (typeof buildStarfield === 'function') { try { buildStarfield(); } catch(e){} }
        if (typeof spawnFloats === 'function') { try { spawnFloats(); } catch(e){} }
        if (typeof spawnFloaters === 'function') { try { spawnFloaters(); } catch(e){} }
        if (typeof createFloatingBubbles === 'function') { try { createFloatingBubbles(); } catch(e){} }
        if (typeof initAudio === 'function') { try { initAudio(); } catch(e){} }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', unlockNow);
    } else {
        unlockNow();
    }
    setTimeout(unlockNow, 50);
    setTimeout(unlockNow, 200);
    setTimeout(unlockNow, 600);
})();
</script>
